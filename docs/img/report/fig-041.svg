<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 232" width="772" height="232" role="img" aria-labelledby="t d"><title id="t">Legacy gate and LangGraph critique step both call one shared repair-then-judge step</title><desc id="d">The repair is one shared step that both writing paths call, so they can&#x27;t drift apart. In the graph it runs inside the critique step, and the Editor sees the repaired draft instead of queueing a whole new one.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="231" rx="10"/><defs><marker id="dc30_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="22" font-size="11" class="m" font-weight="600">LEGACY PATH</text><rect class="node" x="20" y="32" width="120" height="44" rx="6"/><text x="80" y="58" font-size="12" text-anchor="middle">Draft</text><line class="edge" x1="140" y1="54" x2="178" y2="54" marker-end="url(#dc30_k)"/><rect class="node" x="180" y="32" width="110" height="44" rx="6"/><text x="235" y="58" font-size="12" text-anchor="middle">Gate</text><line class="edge" x1="290" y1="60" x2="348" y2="88" marker-end="url(#dc30_k)"/><text x="20" y="122" font-size="11" class="m" font-weight="600">LANGGRAPH PATH</text><rect class="node" x="20" y="132" width="120" height="44" rx="6"/><text x="80" y="158" font-size="12" text-anchor="middle">Draft</text><line class="edge" x1="140" y1="154" x2="178" y2="154" marker-end="url(#dc30_k)"/><rect class="node" x="180" y="132" width="110" height="44" rx="6"/><text x="235" y="158" font-size="12" text-anchor="middle">Critique step</text><line class="edge" x1="290" y1="148" x2="348" y2="114" marker-end="url(#dc30_k)"/><rect class="node hl" x="350" y="70" width="210" height="60" rx="6"/><text x="455" y="96" font-size="12" text-anchor="middle">One shared step</text><text x="455" y="112" font-size="11" class="m" text-anchor="middle">repair, then judge it</text><line class="edge" x1="560" y1="85" x2="598" y2="56" marker-end="url(#dc30_k)"/><rect class="node" x="600" y="32" width="120" height="44" rx="6"/><text x="660" y="58" font-size="12" text-anchor="middle">save or rewrite</text><line class="edge" x1="560" y1="115" x2="598" y2="150" marker-end="url(#dc30_k)"/><rect class="node" x="600" y="132" width="120" height="44" rx="6"/><text x="660" y="150" font-size="12" text-anchor="middle">Editor</text><text x="660" y="166" font-size="11" class="m" text-anchor="middle">takes the repair</text><text x="455" y="194" font-size="11" class="m" text-anchor="middle">runs inside critique, on the critic's lane: no new GPU draft queued</text></svg>

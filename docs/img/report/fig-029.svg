<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 202" width="752" height="202" role="img" aria-labelledby="t d"><title id="t">A padded scene fails pacing correctly and also fails show-tell, which reads the whole scene</title><desc id="d">One filler paragraph, two failures. Show-tell and emotional goal still read everything, so a flaw that belongs to pacing also drags them down. Section 5d fixes this by blaming each flaw once.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="201" rx="10"/><defs><marker id="dc21_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="dc21_w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs><rect class="node" x="20" y="55" width="150" height="60" rx="6"/><text x="95" y="81" font-size="12" text-anchor="middle">Padded scene</text><text x="95" y="97" font-size="11" class="w" text-anchor="middle">3 filler ¶</text><line class="edge" x1="170" y1="75" x2="238" y2="47" marker-end="url(#dc21_k)"/><line class="edge" x1="170" y1="95" x2="238" y2="123" marker-end="url(#dc21_k)"/><rect class="node hl" x="240" y="20" width="230" height="50" rx="6"/><text x="355" y="41" font-size="12" text-anchor="middle">Pacing judge</text><text x="355" y="57" font-size="11" class="m" text-anchor="middle">numbered ¶: flags the filler</text><rect class="node" x="240" y="100" width="230" height="50" rx="6"/><text x="355" y="121" font-size="12" text-anchor="middle">Show-tell judge</text><text x="355" y="137" font-size="11" class="m" text-anchor="middle">reads the whole scene</text><line class="edge" x1="470" y1="45" x2="528" y2="45" marker-end="url(#dc21_k)"/><rect class="node" x="530" y="20" width="170" height="50" rx="6"/><text x="615" y="41" font-size="12" text-anchor="middle">pacing fails</text><text x="615" y="57" font-size="11" class="g" text-anchor="middle">correct</text><line class="edge w" x1="470" y1="125" x2="528" y2="125" marker-end="url(#dc21_w)"/><rect class="node bad" x="530" y="100" width="170" height="50" rx="6"/><text x="615" y="121" font-size="12" text-anchor="middle">show-tell fails too</text><text x="615" y="137" font-size="11" class="w" text-anchor="middle">15 of 30 padded scenes</text></svg>

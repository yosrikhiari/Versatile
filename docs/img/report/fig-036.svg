<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 227" width="752" height="227" role="img" aria-labelledby="t d"><title id="t">Old judge found 31 versus 23 contradictions, new checker 0 versus 0, so the finding is retracted</title><desc id="d">Same 24 saved scenes, two graders. The old finding came from the judge&#x27;s false alarms, not the writer. Keeping the raw scenes is what made re-grading cheap.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="226" rx="10"/><defs><marker id="dc27_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="65" width="150" height="56" rx="6"/><text x="95" y="89" font-size="12" text-anchor="middle">24 saved scenes</text><text x="95" y="105" font-size="11" class="m" text-anchor="middle">with / without facts</text><line class="edge" x1="170" y1="80" x2="218" y2="47" marker-end="url(#dc27_k)"/><line class="edge" x1="170" y1="105" x2="218" y2="138" marker-end="url(#dc27_k)"/><rect class="node bad" x="220" y="20" width="190" height="50" rx="6"/><text x="315" y="41" font-size="12" text-anchor="middle">Old judge</text><text x="315" y="57" font-size="11" class="w" text-anchor="middle">31 vs 23 "contradictions"</text><rect class="node hl" x="220" y="115" width="190" height="50" rx="6"/><text x="315" y="136" font-size="12" text-anchor="middle">New checker</text><text x="315" y="152" font-size="11" class="a" text-anchor="middle">0 vs 0</text><line class="edge" x1="410" y1="45" x2="458" y2="45" marker-end="url(#dc27_k)"/><rect class="node bad" x="460" y="20" width="240" height="50" rx="6"/><text x="580" y="41" font-size="12" text-anchor="middle">"facts list makes it worse"</text><text x="580" y="57" font-size="11" class="w" text-anchor="middle">retracted</text><line class="edge" x1="410" y1="140" x2="458" y2="140" marker-end="url(#dc27_k)"/><rect class="node" x="460" y="115" width="240" height="50" rx="6"/><text x="580" y="144" font-size="11" text-anchor="middle">neither hurts nor measurably helps</text><text x="315" y="188" font-size="11" class="m" text-anchor="middle">my own read of the 2 worst verdicts: no contradiction</text></svg>

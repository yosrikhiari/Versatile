<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 222" width="732" height="222" role="img" aria-labelledby="t d"><title id="t">phi4-mini repeats the instruction; it grades itself 8 of 10, qwen3 grades it 1 of 10</title><desc id="d">Same empty answer, two graders. Grading itself, phi4-mini missed the mistake it had just made. An independent model called it &quot;task not completed&quot;.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="221" rx="10"/><defs><marker id="dc1_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="65" width="140" height="56" rx="6"/><text x="90" y="89" font-size="12" text-anchor="middle">Task prompt</text><text x="90" y="105" font-size="11" class="m" text-anchor="middle">tighten a summary</text><line class="edge" x1="160" y1="93" x2="208" y2="93" marker-end="url(#dc1_k)"/><rect class="node bad" x="210" y="58" width="200" height="70" rx="6"/><text x="310" y="81" font-size="12" text-anchor="middle">phi4-mini answers</text><text x="310" y="97" font-size="11" class="w" text-anchor="middle">repeats the instruction</text><text x="310" y="113" font-size="11" class="w" text-anchor="middle">back, word for word</text><line class="edge" x1="410" y1="78" x2="478" y2="50" marker-end="url(#dc1_k)"/><text x="438" y="44" font-size="11" class="m" text-anchor="middle">same model</text><line class="edge" x1="410" y1="108" x2="478" y2="136" marker-end="url(#dc1_k)"/><text x="430" y="162" font-size="11" class="m" text-anchor="middle">independent judge</text><rect class="node bad" x="480" y="20" width="200" height="56" rx="6"/><text x="580" y="44" font-size="12" text-anchor="middle">phi4-mini grades itself</text><text x="580" y="60" font-size="11" class="w" text-anchor="middle">8 / 10: looks fine</text><rect class="node hl" x="480" y="110" width="200" height="56" rx="6"/><text x="580" y="134" font-size="12" text-anchor="middle">qwen3:8b grades it</text><text x="580" y="150" font-size="11" class="a" text-anchor="middle">1 / 10: task not done</text></svg>

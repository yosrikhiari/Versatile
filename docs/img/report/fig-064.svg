<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 932 262" width="932" height="262" role="img" aria-labelledby="t d"><title id="t">Masterpieces: reviewers would revise 1 of 12, the gate fails 11 of 12. Generated scenes: reviewers would revise 53 of 78, the gate fails 12 of 78.</title><desc id="d">The reviewers pass great prose and fault generated prose, which is the right direction. The gate does the opposite. It failed &quot;The Lady with the Dog&quot; on show-tell (3/10) and gave every generated scene 7–9.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="931" height="261" rx="10"/>
    <text x="20" y="22" font-size="13" font-weight="600">Share of scenes each judge says need work</text>
    
    <text x="20" y="62" font-size="12" font-weight="600">12 masterpiece passages</text>
    <text x="238" y="86" font-size="12" text-anchor="end">reviewers: revise</text>
    <rect class="barB" x="250" y="74" width="42" height="16"/><text x="298" y="87" font-size="11" class="num">1 / 12</text>
    <text x="238" y="110" font-size="12" text-anchor="end">gate: fail</text>
    <rect class="barA" x="250" y="98" width="458" height="16" style="fill:var(--warn)"/><text x="714" y="111" font-size="11" class="num w">11 / 12</text>
    <text x="20" y="146" font-size="12" font-weight="600">78 generated scenes</text>
    <text x="238" y="170" font-size="12" text-anchor="end">reviewers: revise</text>
    <rect class="barB" x="250" y="158" width="340" height="16"/><text x="596" y="171" font-size="11" class="num">53 / 78</text>
    <text x="238" y="194" font-size="12" text-anchor="end">gate: fail</text>
    <rect class="barA" x="250" y="182" width="77" height="16" style="fill:var(--warn)"/><text x="333" y="195" font-size="11" class="num w">12 / 78</text>
  </svg>

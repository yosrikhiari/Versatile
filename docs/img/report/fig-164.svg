<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 672 162" width="672" height="162" role="img" aria-labelledby="t d"><title id="t">A flipped score is checked for identical inputs before blaming the judge</title><desc id="d">Diff the inputs first. Here the &quot;unstable&quot; judge was scoring two different inputs, created by my own fix.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="671" height="161" rx="10"/><defs><marker id="dc85_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="40" width="140" height="50" rx="6"/><text x="90" y="69" font-size="12" text-anchor="middle">Score flipped</text><line class="edge" x1="160" y1="65" x2="198" y2="65" marker-end="url(#dc85_k)"/><rect class="node code" x="200" y="40" width="160" height="50" rx="6"/><text x="280" y="69" font-size="12" text-anchor="middle">Inputs identical?</text><line class="edge" x1="360" y1="55" x2="418" y2="32" marker-end="url(#dc85_k)"/><rect class="node" x="420" y="10" width="200" height="40" rx="6"/><text x="520" y="34" font-size="12" text-anchor="middle">yes → judge is noisy</text><line class="edge" x1="360" y1="75" x2="418" y2="98" marker-end="url(#dc85_k)"/><rect class="node hl" x="420" y="80" width="200" height="40" rx="6"/><text x="520" y="104" font-size="12" text-anchor="middle">no → your change</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 197" width="772" height="197" role="img" aria-labelledby="t d"><title id="t">Step 1 labels serve as a test set and as training data for a pairwise judge</title><desc id="d">The labelled set pays twice: it measures the gate today and later becomes training data. Trained pairwise judges reach 78% on human story preferences, above every prompted judge.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="196" rx="10"/><defs><marker id="dc81_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node hl" x="20" y="55" width="170" height="60" rx="6"/><text x="105" y="81" font-size="12" text-anchor="middle">Step 1 labels</text><text x="105" y="97" font-size="11" class="m" text-anchor="middle">real scenes</text><line class="edge" x1="190" y1="75" x2="238" y2="47" marker-end="url(#dc81_k)"/><line class="edge" x1="190" y1="95" x2="238" y2="123" marker-end="url(#dc81_k)"/><rect class="node" x="240" y="20" width="200" height="50" rx="6"/><text x="340" y="41" font-size="12" text-anchor="middle">Measure the gate</text><text x="340" y="57" font-size="11" class="m" text-anchor="middle">test set</text><rect class="node" x="240" y="100" width="200" height="50" rx="6"/><text x="340" y="121" font-size="12" text-anchor="middle">Train a judge</text><text x="340" y="137" font-size="11" class="m" text-anchor="middle">training data</text><line class="edge" x1="440" y1="125" x2="488" y2="125" marker-end="url(#dc81_k)"/><rect class="node hl" x="490" y="100" width="230" height="50" rx="6"/><text x="605" y="121" font-size="12" text-anchor="middle">Trained pairwise judge</text><text x="605" y="137" font-size="11" class="a" text-anchor="middle">78% on human preferences</text><text x="530" y="50" font-size="11" class="a" text-anchor="middle">the same labels pay twice</text></svg>

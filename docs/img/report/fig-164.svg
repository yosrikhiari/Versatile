<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 712 152" width="712" height="152" role="img" aria-labelledby="t d"><title id="t">Requests separated by identical 30-second gaps</title><desc id="d">The waste was in identical 30-second gaps between reasonable requests, a sign that some rule was pausing the program.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="711" height="151" rx="10"/><rect class="node hl" x="20" y="30" width="70" height="30" rx="3"/><text x="55" y="49" font-size="10" text-anchor="middle">request</text><rect class="node hl" x="190" y="30" width="70" height="30" rx="3"/><text x="225" y="49" font-size="10" text-anchor="middle">request</text><rect class="node hl" x="360" y="30" width="70" height="30" rx="3"/><text x="395" y="49" font-size="10" text-anchor="middle">request</text><rect class="node hl" x="530" y="30" width="70" height="30" rx="3"/><text x="565" y="49" font-size="10" text-anchor="middle">request</text><line class="edge w dash" x1="92" y1="45" x2="188" y2="45"/><text x="140" y="80" font-size="11" class="w" text-anchor="middle">30 s</text><line class="edge w dash" x1="262" y1="45" x2="358" y2="45"/><text x="310" y="80" font-size="11" class="w" text-anchor="middle">30 s</text><line class="edge w dash" x1="432" y1="45" x2="528" y2="45"/><text x="480" y="80" font-size="11" class="w" text-anchor="middle">30 s</text><text x="340" y="108" font-size="11" class="m" text-anchor="middle">a gap that is always exactly 30 s is a rule firing</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 242" width="732" height="242" role="img" aria-labelledby="t d"><title id="t">Three judge calls combined into an average, versus one call whose probabilities give the same average</title><desc id="d">DeepSeek-GRM asks the judge several times and combines the votes. The probabilities from one call hold the same information, which is the cheaper route tested in section 5.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="241" rx="10"/><defs><marker id="dc4_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="70" width="90" height="50" rx="6"/><text x="65" y="99" font-size="12" text-anchor="middle">Scene</text><rect class="node" x="170" y="15" width="170" height="32" rx="6"/><text x="255" y="35" font-size="12" text-anchor="middle">judge call 1 → 7</text><line class="edge" x1="110" y1="95" x2="168" y2="31" marker-end="url(#dc4_k)"/><line class="edge" x1="340" y1="31" x2="378" y2="60" marker-end="url(#dc4_k)"/><rect class="node" x="170" y="55" width="170" height="32" rx="6"/><text x="255" y="75" font-size="12" text-anchor="middle">judge call 2 → 5</text><line class="edge" x1="110" y1="95" x2="168" y2="71" marker-end="url(#dc4_k)"/><line class="edge" x1="340" y1="71" x2="378" y2="73" marker-end="url(#dc4_k)"/><rect class="node" x="170" y="95" width="170" height="32" rx="6"/><text x="255" y="115" font-size="12" text-anchor="middle">judge call 3 → 7</text><line class="edge" x1="110" y1="95" x2="168" y2="111" marker-end="url(#dc4_k)"/><line class="edge" x1="340" y1="111" x2="378" y2="86" marker-end="url(#dc4_k)"/><rect class="node" x="380" y="45" width="140" height="56" rx="6"/><text x="450" y="69" font-size="12" text-anchor="middle">Combine votes</text><text x="450" y="85" font-size="11" class="m" text-anchor="middle">3 calls → 6.3</text><rect class="node hl" x="170" y="150" width="350" height="36" rx="6"/><text x="345" y="172" font-size="12" text-anchor="middle">1 call: read the probability of every score</text><line class="edge" x1="100" y1="120" x2="168" y2="165" marker-end="url(#dc4_k)"/><rect class="node hl" x="570" y="80" width="120" height="60" rx="6"/><text x="630" y="106" font-size="12" text-anchor="middle">Averaged score</text><text x="630" y="122" font-size="11" class="m" text-anchor="middle">less noise</text><line class="edge" x1="520" y1="73" x2="568" y2="100" marker-end="url(#dc4_k)"/><line class="edge" x1="520" y1="168" x2="568" y2="125" marker-end="url(#dc4_k)"/><text x="545" y="204" font-size="11" class="a" text-anchor="middle">one call instead of three</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 712 172" width="712" height="172" role="img" aria-labelledby="t d"><title id="t">The old corpus has both long scenes and the pacing problems, so a length detector looks excellent</title><desc id="d">Every reviewer pacing problem came from one batch of long scenes, so spotting length alone scored an AUC of 0.97. Split test sets by source before trusting a score.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="711" height="171" rx="10"/><defs><marker id="dc86_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="50" width="150" height="44" rx="6"/><text x="95" y="76" font-size="12" text-anchor="middle">Old corpus</text><line class="edge" x1="170" y1="62" x2="218" y2="42" marker-end="url(#dc86_k)"/><line class="edge" x1="170" y1="82" x2="218" y2="102" marker-end="url(#dc86_k)"/><rect class="node" x="220" y="20" width="190" height="40" rx="6"/><text x="315" y="44" font-size="12" text-anchor="middle">long scenes (~980 w)</text><rect class="node bad" x="220" y="84" width="190" height="40" rx="6"/><text x="315" y="108" font-size="12" text-anchor="middle">pacing problems</text><line class="edge" x1="410" y1="40" x2="458" y2="64" marker-end="url(#dc86_k)"/><line class="edge" x1="410" y1="104" x2="458" y2="80" marker-end="url(#dc86_k)"/><rect class="node bad" x="460" y="50" width="200" height="44" rx="6"/><text x="560" y="68" font-size="12" text-anchor="middle">a "long" detector</text><text x="560" y="84" font-size="11" class="w" text-anchor="middle">AUC 0.97</text></svg>

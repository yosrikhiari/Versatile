<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 232" width="772" height="232" role="img" aria-labelledby="t d"><title id="t">With the list of openings in the prompt, reuse rose from 16 of 24 to 21 of 24</title><desc id="d">Told what not to write, the writer wrote it: &quot;sharp enough to cut through the morning haze and the scent of damp earth&quot;, 19 words lifted from a shown opening. Same lesson as 5ad: this model copies whatever it is shown, however it is labelled. The list was taken out again.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="231" rx="10"/>
<text x="20" y="18" font-size="11" class="m">6 scenes × 4 tries, qwen3:8b · grey: no list · orange: list in the prompt</text>
<text x="20" y="52" font-size="11">reuses an earlier opening</text><rect x="300" y="40" width="200" height="14" class="barB"/><text x="506" y="52" font-size="10">16 / 24</text><rect x="300" y="57" width="262" height="14" class="w"/><text x="568" y="69" font-size="10" class="w">21 / 24</text>
<text x="20" y="102" font-size="11">reuses one of the 8 it was shown</text><rect x="300" y="90" width="138" height="14" class="barB"/><text x="444" y="102" font-size="10">11 / 24</text><rect x="300" y="107" width="188" height="14" class="w"/><text x="494" y="119" font-size="10" class="w">15 / 24</text>
<text x="20" y="152" font-size="11">longest stretch copied from a shown opening</text><text x="300" y="152" font-size="11">2.7 words on average → 4.4, up to 19</text>
<text x="20" y="184" font-size="11" class="m">no scene got better, 3 got worse · not significant (p = 0.25), but every scene that moved, moved the wrong way</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 212" width="732" height="212" role="img" aria-labelledby="t d"><title id="t">Fork, plan, write, merge between main book and branch</title><desc id="d">A What If is a full copy of the book. Only the scenes from the change on are planned and rewritten, and only the scenes you tick go back into the main book.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="211" rx="10"/>
<defs><marker id="sb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<text x="20" y="40" font-size="12">main book</text>
<rect x="110" y="26" width="38" height="22" rx="3" class="node"/><rect x="154" y="26" width="38" height="22" rx="3" class="node"/><rect x="198" y="26" width="38" height="22" rx="3" class="node"/><rect x="242" y="26" width="38" height="22" rx="3" class="node"/><rect x="286" y="26" width="38" height="22" rx="3" class="node"/><rect x="330" y="26" width="38" height="22" rx="3" class="node"/><rect x="374" y="26" width="38" height="22" rx="3" class="node"/><rect x="418" y="26" width="38" height="22" rx="3" class="node"/>
<text x="20" y="120" font-size="12" class="a">branch</text>
<rect x="110" y="106" width="38" height="22" rx="3" class="node"/><rect x="154" y="106" width="38" height="22" rx="3" class="node"/><rect x="198" y="106" width="38" height="22" rx="3" class="node"/><rect x="242" y="106" width="38" height="22" rx="3" class="node hl"/><rect x="286" y="106" width="38" height="22" rx="3" class="node hl"/><rect x="330" y="106" width="38" height="22" rx="3" class="node hl"/><rect x="374" y="106" width="38" height="22" rx="3" class="node hl"/><rect x="418" y="106" width="38" height="22" rx="3" class="node hl"/>
<line x1="129" y1="48" x2="129" y2="104" class="edge dash" marker-end="url(#sb1)"/><text x="134" y="80" font-size="10" class="m">1 fork: copy + knowledge</text>
<text x="390" y="100" text-anchor="middle" font-size="10" class="a">2 plan · 3 write: from the chosen scene on</text>
<line x1="500" y1="104" x2="500" y2="50" class="edge a" marker-end="url(#sb1)"/><text x="508" y="80" font-size="10" class="a">4 merge chosen scenes</text>
<text x="560" y="40" font-size="10" class="m">snapshot first</text>
<text x="20" y="165" font-size="11" class="m">every copied scene remembers which scene it came from, so merge puts it back in the right place</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 172" width="692" height="172" role="img" aria-labelledby="t d"><title id="t">Chapter detection order: headings, contents page, numbering</title><desc id="d">The detector tries the most trustworthy signal first. A book&#x27;s own contents page beats any guess about what a heading looks like.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="171" rx="10"/>
<defs><marker id="qa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="50" width="100" height="40" rx="4" class="node"/><text x="70" y="75" text-anchor="middle" font-size="12">the file</text>
<line x1="120" y1="70" x2="150" y2="70" class="edge" marker-end="url(#qa8)"/>
<rect x="152" y="20" width="140" height="30" rx="4" class="node"/><text x="222" y="40" text-anchor="middle" font-size="11">headings in the file?</text>
<rect x="312" y="20" width="150" height="30" rx="4" class="node hl"/><text x="387" y="40" text-anchor="middle" font-size="11">its contents page?</text>
<rect x="482" y="20" width="160" height="30" rx="4" class="node"/><text x="562" y="40" text-anchor="middle" font-size="11">numbers running 1, 2, 3?</text>
<line x1="292" y1="35" x2="310" y2="35" class="edge" marker-end="url(#qa8)"/><line x1="462" y1="35" x2="480" y2="35" class="edge" marker-end="url(#qa8)"/>
<text x="387" y="72" text-anchor="middle" font-size="11" class="m">5 of 6 books: found here</text>
<rect x="152" y="95" width="490" height="30" rx="4" class="node code"/><text x="397" y="115" text-anchor="middle" font-size="11">then: scenes at the author's breaks · long opening → prologue · words counted to the last one</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 234" width="732" height="234" role="img" aria-labelledby="t d"><title id="t">First read versus after fixes: time, places, links, digests</title><desc id="d">Ethan Frome, first read versus after the fixes. Every bar that shrank was a defect: repeated places, churning links, duplicated digests, and 30-second pauses.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="233" rx="10"/><text x="20" y="35" font-size="12">time (min)</text><rect x="230" y="26" width="304" height="11" class="barB"/><text x="540" y="35" font-size="10" class="m">16 first read</text><rect x="230" y="40" width="205" height="11" class="barA"/><text x="441" y="49" font-size="10" class="a">10.8 after fixes</text><text x="20" y="79" font-size="12">places</text><rect x="230" y="70" width="352" height="11" class="barB"/><text x="588" y="79" font-size="10" class="m">37 first read</text><rect x="230" y="84" width="200" height="11" class="barA"/><text x="436" y="93" font-size="10" class="a">21 after fixes</text><text x="20" y="123" font-size="12">network links</text><rect x="230" y="114" width="329" height="11" class="barB"/><text x="565" y="123" font-size="10" class="m">52 first read</text><rect x="230" y="128" width="95" height="11" class="barA"/><text x="331" y="137" font-size="10" class="a">15 after fixes</text><text x="20" y="167" font-size="12">digests (one per scene = 12)</text><rect x="230" y="158" width="304" height="11" class="barB"/><text x="540" y="167" font-size="10" class="m">24 first read</text><rect x="230" y="172" width="152" height="11" class="barA"/><text x="388" y="181" font-size="10" class="a">12 after fixes</text></svg>

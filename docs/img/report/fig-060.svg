<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 197" width="732" height="197" role="img" aria-labelledby="t d"><title id="t">Problem scenes score 7 in 32 percent of cases versus 16 percent for fine scenes</title><desc id="d">The pacing signal is there: problem scenes get a borderline 7 twice as often. A rule tuned on blatant fake filler just sets the bar too high for real filler.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="196" rx="10"/><text x="20" y="22" font-size="12" font-weight="600">Share of scenes the pacing judge scores 7</text><text x="200" y="59" font-size="11" text-anchor="end">problem scenes</text><rect class="barA" x="210" y="46" width="320" height="18"/><text x="536" y="60" font-size="11" class="a">32%</text><text x="200" y="93" font-size="11" text-anchor="end">fine scenes</text><rect class="barB" x="210" y="80" width="160" height="18"/><text x="376" y="94" font-size="11">16%</text><text x="20" y="130" font-size="11" class="m">but the rule fails a scene only on ≥ 2 confirmed filler flags,</text><text x="20" y="150" font-size="11" class="w">and real filler is milder: usually 1 flag, so the scene passes</text></svg>

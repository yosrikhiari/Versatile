<rect x="20" y="15" width="110" height="30" rx="4" class="node"/><text x="75" y="34" text-anchor="middle" font-size="11">user 1</text><line x1="130" y1="30" x2="238" y2="72" class="edge" marker-end="url(#rb6)"/><rect x="20" y="57" width="110" height="30" rx="4" class="node"/><text x="75" y="76" text-anchor="middle" font-size="11">user 2</text><line x1="130" y1="72" x2="238" y2="72" class="edge" marker-end="url(#rb6)"/><rect x="20" y="99" width="110" height="30" rx="4" class="node"/><text x="75" y="118" text-anchor="middle" font-size="11">user 3</text><line x1="130" y1="114" x2="238" y2="72" class="edge" marker-end="url(#rb6)"/>

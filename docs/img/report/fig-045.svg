<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 197" width="752" height="197" role="img" aria-labelledby="t d"><title id="t">Changing the question still blames the wrong dimension; changing the input blames the right one</title><desc id="d">Better instructions didn&#x27;t help: asked for evidence, the judge found the flaw and blamed it on whatever it was asked about. Narrowing what each judge reads did help.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="196" rx="10"/><defs><marker id="dc33_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="22" font-size="12" font-weight="600">Two ways to stop wrong blame</text><rect class="node" x="20" y="36" width="230" height="50" rx="6"/><text x="135" y="57" font-size="12" text-anchor="middle">Change the question</text><text x="135" y="73" font-size="11" class="m" text-anchor="middle">"quote your evidence"</text><line class="edge" x1="250" y1="61" x2="298" y2="61" marker-end="url(#dc33_k)"/><rect class="node bad" x="300" y="36" width="240" height="50" rx="6"/><text x="420" y="57" font-size="12" text-anchor="middle">quotes the planted flaw</text><text x="420" y="73" font-size="11" class="w" text-anchor="middle">for every dimension</text><text x="555" y="65" font-size="11" class="w">blame still wrong</text><rect class="node code" x="20" y="106" width="230" height="50" rx="6"/><text x="135" y="127" font-size="12" text-anchor="middle">Change the input</text><text x="135" y="143" font-size="11" class="m" text-anchor="middle">hide the flaw from other judges</text><line class="edge" x1="250" y1="131" x2="298" y2="131" marker-end="url(#dc33_k)"/><rect class="node hl" x="300" y="106" width="240" height="50" rx="6"/><text x="420" y="127" font-size="12" text-anchor="middle">voice never sees</text><text x="420" y="143" font-size="11" class="m" text-anchor="middle">the summary</text><text x="555" y="135" font-size="11" class="a">blame right</text></svg>

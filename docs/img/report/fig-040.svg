<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 197" width="752" height="197" role="img" aria-labelledby="t d"><title id="t">Five of six scenes pass; one fails, the repair does not clear it, the full rewrite does</title><desc id="d">On the first real book the repair fired once and didn&#x27;t clear the scene alone; the full rewrite then did. Real failures are more often voice or emotion, which can&#x27;t be repaired in place, so repairs will be rarer than in planted tests.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="196" rx="10"/><defs><marker id="dc29_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="22" font-size="12" font-weight="600">6 scenes, gate on</text><rect class="node" x="20" y="40" width="34" height="34" rx="4"/><text x="37" y="61" font-size="13" text-anchor="middle">✓</text><rect class="node" x="62" y="40" width="34" height="34" rx="4"/><text x="79" y="61" font-size="13" text-anchor="middle">✓</text><rect class="node" x="104" y="40" width="34" height="34" rx="4"/><text x="121" y="61" font-size="13" text-anchor="middle">✓</text><rect class="node bad" x="146" y="40" width="34" height="34" rx="4"/><text x="163" y="61" font-size="13" text-anchor="middle">✗</text><rect class="node" x="188" y="40" width="34" height="34" rx="4"/><text x="205" y="61" font-size="13" text-anchor="middle">✓</text><rect class="node" x="230" y="40" width="34" height="34" rx="4"/><text x="247" y="61" font-size="13" text-anchor="middle">✓</text><path class="edge" d="M163 74 V125 H278" marker-end="url(#dc29_k)"/><rect class="node" x="280" y="100" width="130" height="50" rx="6"/><text x="345" y="121" font-size="12" text-anchor="middle">Repair</text><text x="345" y="137" font-size="11" class="w" text-anchor="middle">still fails</text><line class="edge" x1="410" y1="125" x2="448" y2="125" marker-end="url(#dc29_k)"/><rect class="node hl" x="450" y="100" width="130" height="50" rx="6"/><text x="515" y="121" font-size="12" text-anchor="middle">Full rewrite</text><text x="515" y="137" font-size="11" class="g" text-anchor="middle">passes</text><line class="edge" x1="580" y1="125" x2="618" y2="125" marker-end="url(#dc29_k)"/><rect class="node" x="620" y="100" width="90" height="50" rx="6"/><text x="665" y="121" font-size="12" text-anchor="middle">Saved</text><text x="665" y="137" font-size="11" class="m" text-a
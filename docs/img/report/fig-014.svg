<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 232" width="752" height="232" role="img" aria-labelledby="t d"><title id="t">One big consistency question versus extracted facts compared in pairs with quotes</title><desc id="d">ConStory-Bench&#x27;s method. Instead of one big question, pull out small facts and compare them in pairs, each backed by a quoted line.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="231" rx="10"/><defs><marker id="dc11_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="170" height="40" rx="6"/><text x="105" y="44" font-size="12" text-anchor="middle">Scene + whole story</text><line class="edge" x1="190" y1="40" x2="238" y2="40" marker-end="url(#dc11_k)"/><rect class="node bad" x="240" y="20" width="230" height="40" rx="6"/><text x="355" y="44" font-size="12" text-anchor="middle">"Is this consistent?"</text><text x="485" y="44" font-size="11" class="w">one big question: misses details</text><line class="grid" x1="20" y1="78" x2="700" y2="78"/><rect class="node" x="20" y="100" width="170" height="60" rx="6"/><text x="105" y="126" font-size="12" text-anchor="middle">Pull out pieces</text><text x="105" y="142" font-size="11" class="m" text-anchor="middle">status, dates, places</text><line class="edge" x1="190" y1="125" x2="238" y2="112" marker-end="url(#dc11_k)"/><line class="edge" x1="190" y1="135" x2="238" y2="150" marker-end="url(#dc11_k)"/><rect class="node bad" x="240" y="95" width="260" height="32" rx="6"/><text x="370" y="115" font-size="12" text-anchor="middle">Halim: dead   vs   Ch1: alive</text><rect class="node" x="240" y="135" width="260" height="32" rx="6"/><text x="370" y="155" font-size="12" text-anchor="middle">Date: spring   vs   Ch3: spring</text><line class="edge" x1="500" y1="111" x2="548" y2="124" marker-end="url(#dc11_k)"/><rect class="node hl" x="550" y="105" width="150" height="40" rx="6"/><text x="625" y="129" font-size="12" text-anchor="middle">flag + quoted line</text><text x="370" y="190" font-size="11" class="m" text-anchor="middle">many small pairwise comparisons, each with a quote as evidence</text></svg>

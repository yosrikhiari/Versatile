<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 232" width="752" height="232" role="img" aria-labelledby="t d"><title id="t">Empty summary is telling plus filler; faithful summary drops show-tell by 1.83 and pacing by 0.07</title><desc id="d">My first summary defect was also filler, so pacing was right to complain. With a fairer version that keeps the plot, pacing barely moves and show-tell takes the hit. The pacing judge was fine all along.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="231" rx="10"/><defs><marker id="dc19_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="22" font-size="12" font-weight="600">Empty summary (my first fixture)</text><rect class="node" x="20" y="34" width="280" height="44" rx="6"/><text x="160" y="52" font-size="12" text-anchor="middle">"The moment passed, having…"</text><text x="160" y="68" font-size="11" class="m" text-anchor="middle">no plot, no image</text><line class="edge" x1="300" y1="56" x2="348" y2="56" marker-end="url(#dc19_k)"/><rect class="node" x="350" y="34" width="160" height="44" rx="6"/><text x="430" y="60" font-size="12" text-anchor="middle">telling  +  filler</text><line class="edge" x1="510" y1="56" x2="548" y2="56" marker-end="url(#dc19_k)"/><rect class="node" x="550" y="34" width="150" height="44" rx="6"/><text x="625" y="52" font-size="12" text-anchor="middle">pacing complains</text><text x="625" y="68" font-size="11" class="g" text-anchor="middle">and it's right</text><line class="grid" x1="20" y1="96" x2="700" y2="96"/><text x="20" y="118" font-size="12" font-weight="600">Faithful summary (fairer fixture: plot kept)</text><text x="188" y="150" font-size="12" text-anchor="end">show-tell drop</text><rect class="barA" x="200" y="138" width="366" height="16"/><text x="572" y="151" font-size="11" class="a">−1.83</text><text x="188" y="180" font-size="12" text-anchor="end">pacing drop</text><rect class="barB" x="200" y="168" width="14" height="16"/><text x="220" y="181" font-size="11">−0.07</text></svg>

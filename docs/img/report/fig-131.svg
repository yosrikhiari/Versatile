<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 220" width="772" height="220" role="img" aria-labelledby="t d"><title id="t">Dot strip: Ethan Frome&#x27;s third-person chapters all at 0, its frame and The Time Machine between 28 and 94</title><desc id="d">On all 29 original chapters of both books the measure separates cleanly: third-person chapters score exactly 0 once speech is removed, first-person ones 28 to 94. Nothing lands in between.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="219" rx="10"/><text x="20" y="18" font-size="11" class="m">first-person pronouns per 1,000 words of narration, each original chapter one dot</text><text x="20" y="54" font-size="12">Ethan Frome, chapters I–IX</text><circle cx="170" cy="45" r="4.5" class="barB"/><circle cx="170" cy="50" r="4.5" class="barB"/><circle cx="170" cy="55" r="4.5" class="barB"/><circle cx="170" cy="45" r="4.5" class="barB"/><circle cx="170" cy="50" r="4.5" class="barB"/><circle cx="170" cy="55" r="4.5" class="barB"/><circle cx="170" cy="45" r="4.5" class="barB"/><circle cx="170" cy="50" r="4.5" class="barB"/><circle cx="170" cy="55" r="4.5" class="barB"/><circle cx="170" cy="45" r="4.5" class="barB"/><text x="20" y="94" font-size="12">Ethan Frome, frame</text><circle cx="424" cy="90" r="4.5" class="barA"/><circle cx="327" cy="90" r="4.5" class="barA"/><circle cx="516" cy="90" r="4.5" class="barA"/><text x="20" y="134" font-size="12">The Time Machine</text><circle cx="332" cy="130" r="4.5" class="barA"/><circle cx="321" cy="130" r="4.5" class="barA"/><circle cx="375" cy="130" r="4.5" class="barA"/><circle cx="543" cy="130" r="4.5" class="barA"/><circle cx="559" cy="130" r="4.5" class="barA"/><circle cx="435" cy="130" r="4.5" class="barA"/><circle cx="656" cy="130" r="4.5" class="barA"/><circle cx="532" cy="130" r="4.5" class="barA"/><circle cx="672" cy="130" r="4.5" class="barA"/><circle cx="548" cy="130" r="4.5" class="barA"/><circle cx="575" cy="130" r="4.5" class="barA"/><circle cx="678" cy="130" r="4.5" class="barA"/><circle cx="537" cy="130" r="4.5" class="barA"/><circle cx="462" cy="130" r="4.5" class="barA"/><circle cx="667" cy="130" r="4.5" class="barA"/><circle cx="462" cy="130" r="4.5" class="barA"/><circle cx="424" cy="130" r="4.5" class="barA"/><line x1="181" y1="30" x2="181" y2="146" class="edge dash"/><line x1="224" y1="30" x2="224" y2="146" class="edge dash"/><text x="177" y="162" font-size="10" class="m" text-anchor="end">≤ 2 third</text><text x="228" y="162" font-size="10" class="m">≥ 10 first</text><text x="170" y="178" font-size="10" class="m" text-anchor="middle">0</text><text x="305" y="178" font-size="10" class="m" text-anchor="middle">25</text><text x="440" y="178" font-size="10" class="m" text-anchor="middle">50</text><text x="575" y="178" font-size="10" class="m" text-anchor="middle">75</text><text x="710" y="178" font-size="10" class="m" text-anchor="middle">100</text></svg>

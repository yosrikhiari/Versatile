<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 182" width="772" height="182" role="img" aria-labelledby="t d"><title id="t">Sentence repair fails on the real miss and damages a false alarm; the check was switched to flag only</title><desc id="d">Run 4: patching one sentence cannot remove an absence a whole chapter is built on, and on a false alarm it edits the original book. So the check now only flags.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="181" rx="10"/>
<defs><marker id="ud1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="330" height="44" rx="4" class="node bad"/><text x="185" y="38" text-anchor="middle" font-size="11">chapter VIII, a real miss:</text><text x="185" y="54" text-anchor="middle" font-size="11">“Zeena’s absence was like a silence…”</text><line x1="350" y1="42" x2="388" y2="42" class="edge" marker-end="url(#ud1)"/><rect x="390" y="20" width="330" height="44" rx="4" class="node bad"/><text x="555" y="38" text-anchor="middle" font-size="11">repaired to “The silence of</text><text x="555" y="54" text-anchor="middle" font-size="11">Zeena’s absence…”: still absent</text><rect x="20" y="80" width="330" height="44" rx="4" class="node dash"/><text x="185" y="98" text-anchor="middle" font-size="11">epilogue, a false alarm:</text><text x="185" y="114" text-anchor="middle" font-size="11">“Nobody knows Zeena’s thoughts.”</text><line x1="350" y1="102" x2="388" y2="102" class="edge" marker-end="url(#ud1)"/><rect x="390" y="80" width="330" height="44" rx="4" class="node bad"/><text x="555" y="98" text-anchor="middle" font-size="11">the book’s own sentence changed:</text><text x="555" y="114" text-anchor="middle" font-size="11">“No one can say what Zeena is thinking.”</text></svg>

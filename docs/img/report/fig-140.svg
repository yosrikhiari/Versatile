<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 258" width="772" height="258" role="img" aria-labelledby="t d"><title id="t">All eight rewritten chapters first person (rates 60 to 78) and past tense (97 to 100 percent)</title><desc id="d">Once each brief said “NARRATION: first person” and “TENSE: past tense”, all eight rewrites kept both. On branch 16, written on the same premise without those lines, all seven rewritten chapters had slipped to “he”. That is one branch against one branch: a strong sign, not a rate.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="257" rx="10"/><text x="20" y="16" font-size="11" class="m">each rewritten chapter of the new branch · branch 16 (same premise, no brief rules): all 7 in the third person</text><text x="250" y="36" font-size="11" class="m">first-person rate (≥ 10 = first)</text><text x="520" y="36" font-size="11" class="m">past-tense share (≥ 75% = past)</text><text x="20" y="58" font-size="11">Explanation</text><rect x="250" y="48" width="174" height="13" class="barA"/><text x="430" y="59" font-size="10">67</text><rect x="520" y="48" width="157" height="13" class="barA"/><text x="683" y="59" font-size="10">98%</text><text x="20" y="80" font-size="11">The Morlocks</text><rect x="250" y="70" width="203" height="13" class="barA"/><text x="459" y="81" font-size="10">78</text><rect x="520" y="70" width="160" height="13" class="barA"/><text x="686" y="81" font-size="10">100%</text><text x="20" y="102" font-size="11">When Night Came</text><rect x="250" y="92" width="182" height="13" class="barA"/><text x="438" y="103" font-size="10">70</text><rect x="520" y="92" width="155" height="13" class="barA"/><text x="681" y="103" font-size="10">97%</text><text x="20" y="124" font-size="11">Palace of Green Porcelain</text><rect x="250" y="114" width="179" height="13" class="barA"/><text x="435" y="125" font-size="10">69</text><rect x="520" y="114" width="158" height="13" class="barA"/><text x="684" y="125" font-size="10">99%</text><text x="20" y="146" font-size="11">In the Darkness</text><rect x="250" y="136" width="156" height="13" class="barA"/><text x="412" y="147" font-size="10">60</text><rect x="520" y="136" width="157" height="13" class="barA"/><text x="683" y="147" font-size="10">98%</text><text x="20" y="168" font-size="11">Trap of the White Sphinx</text><rect x="250" y="158" width="200" height="13" class="barA"/><text x="456" y="169" font-size="10">77</text><rect x="520" y="158" width="158" height="13" class="barA"/><text x="6
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 162" width="692" height="162" role="img" aria-labelledby="t d"><title id="t">Mocked models pass the tests; a real live read found 8 defects</title><desc id="d">One live read of Ethan Frome found eight defects that passing tests had hidden.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="161" rx="10"/><defs><marker id="dc91_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="15" width="170" height="40" rx="6"/><text x="105" y="39" font-size="12" text-anchor="middle">Mocked model</text><line class="edge" x1="190" y1="35" x2="238" y2="35" marker-end="url(#dc91_k)"/><rect class="node hl" x="240" y="15" width="170" height="40" rx="6"/><text x="325" y="39" font-size="12" text-anchor="middle">tests pass</text><text x="425" y="40" font-size="11" class="m">returns what you expect</text><rect class="node" x="20" y="75" width="170" height="40" rx="6"/><text x="105" y="99" font-size="12" text-anchor="middle">Real model, live read</text><line class="edge" x1="190" y1="95" x2="238" y2="95" marker-end="url(#dc91_k)"/><rect class="node bad" x="240" y="75" width="170" height="40" rx="6"/><text x="325" y="99" font-size="12" text-anchor="middle">8 defects found</text><text x="425" y="100" font-size="11" class="w">duplicates, a lost marriage…</text></svg>

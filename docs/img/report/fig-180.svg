<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 672 162" width="672" height="162" role="img" aria-labelledby="t d"><title id="t">Ten votes of which seven say 7 and three say 5 equal one call with probabilities 0.7 and 0.3</title><desc id="d">Schematic. The probabilities of one call carry the spread that many separate votes would show, so a printed 7 can&#x27;t hide the 30% doubt.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="671" height="161" rx="10"/><defs><marker id="dc101_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="20" font-size="12" font-weight="600">10 separate calls</text><rect class="node" x="20" y="32" width="24" height="24" rx="3"/><text x="32" y="48" font-size="11" text-anchor="middle">7</text><rect class="node" x="48" y="32" width="24" height="24" rx="3"/><text x="60" y="48" font-size="11" text-anchor="middle">7</text><rect class="node bad" x="76" y="32" width="24" height="24" rx="3"/><text x="88" y="48" font-size="11" text-anchor="middle">5</text><rect class="node" x="104" y="32" width="24" height="24" rx="3"/><text x="116" y="48" font-size="11" text-anchor="middle">7</text><rect class="node" x="132" y="32" width="24" height="24" rx="3"/><text x="144" y="48" font-size="11" text-anchor="middle">7</text><rect class="node bad" x="160" y="32" width="24" height="24" rx="3"/><text x="172" y="48" font-size="11" text-anchor="middle">5</text><rect class="node" x="188" y="32" width="24" height="24" rx="3"/><text x="200" y="48" font-size="11" text-anchor="middle">7</text><rect class="node" x="216" y="32" width="24" height="24" rx="3"/><text x="228" y="48" font-size="11" text-anchor="middle">7</text><rect class="node bad" x="244" y="32" width="24" height="24" rx="3"/><text x="256" y="48" font-size="11" text-anchor="middle">5</text><rect class="node" x="272" y="32" width="24" height="24" rx="3"/><text x="284" y="48" font-size="11" text-anchor="middle">7</text><text x="20" y="90" font-size="11" class="m">7 of 10 say 7, 3 say 5</text><line class="edge" x1="310" y1="44" x2="358" y2="44" marker-end="url(#dc101_k)"/><text x="334" y="38" font-size="11" class="m" text-anchor="middle">same as</text><rect class="node hl" x="360" y="20" width="260" height="50" rx="6"/><text x="490" y="41" font-size="12" text-anchor="middle">1 call, read the probabilities</text><text x="490" y="57" font-size="11" class="a" text-anchor="middle">P(7) = 0.7 · P(5) = 0.3</text></svg>

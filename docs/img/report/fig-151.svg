<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 268" width="772" height="268" role="img" aria-labelledby="t d"><title id="t">Before: the goal bar shows the manuscript total, 459 of 500 on opening the sample, and moves only at the 10-second save. After: 0 of 500 on opening, 12 of 500 one second after typing.</title><desc id="d">Measured in the app. Today&#x27;s words are now the same day-over-day difference the workspace&#x27;s writing history already used, so the header and the workspace agree. The open scene&#x27;s count is live, and the streak counts today from the first word, not the first save.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="267" rx="10"/>
<text x="20" y="18" font-size="11" class="m">the sample story (459 words), opened, then 12 words typed into a scene</text>
<text x="20" y="50" font-size="12">before</text>
<text x="120" y="44" font-size="11" class="m">on opening</text><rect x="120" y="50" width="200" height="12" class="grid" fill="none"/><rect x="120" y="50" width="184" height="12" class="barB"/><text x="330" y="61" font-size="11" class="w">459 / 500 · nothing written</text>
<text x="120" y="88" font-size="11" class="m">1 s after typing</text><rect x="120" y="94" width="200" height="12" class="grid" fill="none"/><rect x="120" y="94" width="184" height="12" class="barB"/><text x="330" y="105" font-size="11" class="w">still 459 / 500 · moves at the 10 s save, to 471</text>
<line x1="20" y1="124" x2="720" y2="124" class="grid"/>
<text x="20" y="150" font-size="12">after</text>
<text x="120" y="144" font-size="11" class="m">on opening</text><rect x="120" y="150" width="200" height="12" class="grid" fill="none"/><text x="330" y="161" font-size="11" class="a">0 / 500</text>
<text x="120" y="188" font-size="11" class="m">1 s after typing</text><rect x="120" y="194" width="200" height="12" class="grid" fill="none"/><rect x="120" y="194" width="5" height="12" class="barA"/><text x="330" y="205" font-size="11" class="a">12 / 500 · before “Saved” · header 471 words · streak 1</text>
<text x="20" y="228" font-size="11" class="m">today = the live total − the last total saved on an earlier day (0 for a new book; what an import or the sample arrived with)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 262" width="772" height="262" role="img" aria-labelledby="t d"><title id="t">Generated books reuse an earlier opening&#x27;s picture in 43 percent of openings, published books in 12 percent</title><desc id="d">Generated books reuse an opening picture three to four times as often as published ones, and the published hits are mostly not pictures at all. The measure has a human baseline before it is used to judge a fix.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="261" rx="10"/>
<text x="20" y="18" font-size="11" class="m">openings that reuse a picture from an earlier opening</text>
<text x="20" y="52" font-size="11">generated books (8 runs, 70 openings)</text><rect x="300" y="40" width="172" height="16" class="barB"/><text x="478" y="53" font-size="11">30 / 70 · 43%</text>
<text x="20" y="80" font-size="11" class="m">  of which the salt-road book (30 scenes)</text><rect x="300" y="68" width="208" height="16" class="barB"/><text x="514" y="81" font-size="11">15 / 29 · 52%</text>
<text x="20" y="114" font-size="11">six published books (114 chapter openings)</text><rect x="300" y="102" width="48" height="16" class="barA"/><text x="354" y="115" font-size="11">14 / 114 · 12%</text>
<line x1="300" y1="130" x2="700" y2="130" class="grid"/>
<text x="20" y="156" font-size="11" class="m">most repeated in the salt-road book: damp earth ×6 · fingers brushing ×4 · coarse fabric ×3 · stood at the edge ×3</text>
<text x="20" y="176" font-size="11" class="m">the published "repeats" are mostly names and stock phrases: time machine, great deal, long time</text>
<text x="20" y="204" font-size="11" class="m">the same measure later names what the writer reuses; it is shipped code (openingReuse.ts), not a script</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 142" width="692" height="142" role="img" aria-labelledby="t d"><title id="t">Import, then understand, then branch</title><desc id="d">What If needs what the book knows about itself, so an imported book goes through import and understanding before it can branch.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="141" rx="10"/>
<defs><marker id="qa7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="30" width="170" height="50" rx="6" class="node"/><text x="105" y="52" text-anchor="middle" font-size="13">1 · Import</text><text x="105" y="70" text-anchor="middle" font-size="11" class="m">file → chapters, scenes</text>
<line x1="190" y1="55" x2="238" y2="55" class="edge" marker-end="url(#qa7)"/>
<rect x="240" y="30" width="180" height="50" rx="6" class="node"/><text x="330" y="52" text-anchor="middle" font-size="13">2 · Understand</text><text x="330" y="70" text-anchor="middle" font-size="11" class="m">bible, network, summaries</text>
<line x1="420" y1="55" x2="468" y2="55" class="edge" marker-end="url(#qa7)"/>
<rect x="470" y="30" width="170" height="50" rx="6" class="node hl"/><text x="555" y="52" text-anchor="middle" font-size="13">3 · Branch</text><text x="555" y="70" text-anchor="middle" font-size="11" class="m">what if…</text></svg>

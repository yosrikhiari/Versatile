<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">Problem and fine scenes both get 7 or 8 from the show-tell judge</title><desc id="d">Problem scenes and fine scenes get the same mix of 7s and 8s. A whole-scene score doesn&#x27;t react to a single telling line like &quot;she felt the strain of keeping it all inside&quot;.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/><defs><marker id="dc48_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="190" height="44" rx="6"/><text x="115" y="46" font-size="12" text-anchor="middle">Problem scene</text><rect class="node" x="20" y="86" width="190" height="44" rx="6"/><text x="115" y="112" font-size="12" text-anchor="middle">Fine scene</text><line class="edge" x1="210" y1="42" x2="268" y2="67" marker-end="url(#dc48_k)"/><line class="edge" x1="210" y1="108" x2="268" y2="83" marker-end="url(#dc48_k)"/><rect class="node" x="270" y="50" width="180" height="50" rx="6"/><text x="360" y="71" font-size="12" text-anchor="middle">Show-tell judge</text><text x="360" y="87" font-size="11" class="m" text-anchor="middle">whole-scene 1–10</text><line class="edge" x1="450" y1="75" x2="498" y2="75" marker-end="url(#dc48_k)"/><rect class="node bad" x="500" y="50" width="180" height="50" rx="6"/><text x="590" y="71" font-size="12" text-anchor="middle">7 or 8 either way</text><text x="590" y="87" font-size="11" class="w" text-anchor="middle">no signal</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 212" width="732" height="212" role="img" aria-labelledby="t d"><title id="t">Clean scenes 0 to 3 filler flags, padded scenes 2 to 4, overlapping at 2 to 3</title><desc id="d">Clean scenes got 0–3 paragraphs called filler, padded ones 2–4, and borderline labels flipped between two ways of calling Ollama (0 flags versus 3 on the same clean scene). A pass mark picked on these 4 scenes would be fitted to noise.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="211" rx="10"/><rect class="node bad" x="390" y="30" width="110" height="76"/><rect class="barB" x="170" y="40" width="330" height="18"/><text x="158" y="54" font-size="12" text-anchor="end">clean scenes</text><rect class="barA" x="390" y="78" width="220" height="18"/><text x="158" y="92" font-size="12" text-anchor="end">padded scenes</text><line class="edge" x1="170" y1="118" x2="610" y2="118"/><text x="170" y="134" font-size="11" class="m" text-anchor="middle">0</text><text x="280" y="134" font-size="11" class="m" text-anchor="middle">1</text><text x="390" y="134" font-size="11" class="m" text-anchor="middle">2</text><text x="500" y="134" font-size="11" class="m" text-anchor="middle">3</text><text x="610" y="134" font-size="11" class="m" text-anchor="middle">4</text><text x="445" y="22" font-size="11" class="w" text-anchor="middle">overlap: 2–3 flags</text><text x="390" y="158" font-size="11" class="m" text-anchor="middle">paragraphs called "filler" per scene</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 202" width="752" height="202" role="img" aria-labelledby="t d"><title id="t">ConStory-Bench and FlawedFictions feed the continuity checker to measure recall</title><desc id="d">Two ready-made test sets of natural contradictions. They answer the question planted flaws can&#x27;t: what share of real, subtle errors the checker finds.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="201" rx="10"/><defs><marker id="dc40_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="280" height="64" rx="6"/><text x="160" y="40" font-size="12" text-anchor="middle">ConStory-Bench</text><text x="160" y="56" font-size="11" class="m" text-anchor="middle">public, MIT · exact quotes + places</text><text x="160" y="72" font-size="11" class="w" text-anchor="middle">labelled by a model: approximate</text><rect class="node" x="20" y="96" width="280" height="64" rx="6"/><text x="160" y="116" font-size="12" text-anchor="middle">FlawedFictions</text><text x="160" y="132" font-size="11" class="m" text-anchor="middle">207 plot holes, human-verified</text><text x="160" y="148" font-size="11" class="m" text-anchor="middle">data by email request</text><line class="edge" x1="300" y1="52" x2="378" y2="80" marker-end="url(#dc40_k)"/><line class="edge" x1="300" y1="128" x2="378" y2="100" marker-end="url(#dc40_k)"/><rect class="node hl" x="380" y="65" width="160" height="50" rx="6"/><text x="460" y="94" font-size="12" text-anchor="middle">Continuity checker</text><line class="edge" x1="540" y1="90" x2="578" y2="90" marker-end="url(#dc40_k)"/><rect class="node" x="580" y="65" width="130" height="50" rx="6"/><text x="645" y="86" font-size="12" text-anchor="middle">Recall on real</text><text x="645" y="102" font-size="11" class="m" text-anchor="middle">contradictions</text></svg>

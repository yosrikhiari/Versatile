<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 232" width="772" height="232" role="img" aria-labelledby="t d"><title id="t">The digest job copied a scene&#x27;s character list from the store, a Vue proxy; IndexedDB cannot store it, so every queued task failed. Converted to plain data, the sample&#x27;s four scenes got digests for the first time.</title><desc id="d">A digest is the short summary of a scene that the later checks and the timeline read. No hand-written or edited scene had been getting one. The new test writes through a real (in-memory) IndexedDB and fails on the old code; so does the router test.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="231" rx="10"/>
<defs><marker id="hb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="hb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker><marker id="hb3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
<rect x="20" y="20" width="170" height="46" rx="4" class="node"/><text x="105" y="40" text-anchor="middle" font-size="11">scene edited</text><text x="105" y="54" text-anchor="middle" font-size="11" class="m">its digest is now stale</text>
<line x1="190" y1="43" x2="218" y2="43" class="edge" marker-end="url(#hb1)"/>
<rect x="220" y="20" width="200" height="46" rx="4" class="node"/><text x="320" y="40" text-anchor="middle" font-size="11">task built from the store row:</text><text x="320" y="54" text-anchor="middle" font-size="11">charactersPresent = a Vue proxy</text>
<line x1="420" y1="43" x2="448" y2="43" class="edge w" marker-end="url(#hb2)"/>
<rect x="450" y="20" width="270" height="46" rx="4" class="node bad"/><text x="585" y="40" text-anchor="middle" font-size="11">IndexedDB cannot store a proxy:</text><text x="585" y="54" text-anchor="middle" font-size="11">DataCloneError · no digest, ever</text>
<rect x="220" y="96" width="200" height="46" rx="4" class="node code"/><text x="320" y="116" text-anchor="middle" font-size="11">now: the queue stores</text><text x="320" y="130" text-anchor="middle" font-size="11">toPlain(payload)</text>
<line x1="420" y1="119" x2="448" y2="119" class="edge a" marker-end="url(#hb3)"/>
<rect x="450" y="96" width="270" height="46" rx="4" class="node hl"/><text x="585" y="116" text-anchor="middle" font-size="11">the sample's 4 scenes got digests,</text><text x="585" y="130" text-anchor="middle" font-size="11">for the first time</text>
<text x="20" y="168" font-size="11" class="m">reproduced with a plain Vue ref and no Pinia: older than the upgrade</text>
<text x="20" y="186" font-size="11" class="m">the existing tests replaced the queue with a stand-in, so a real database write never happened in them</text>
</svg>

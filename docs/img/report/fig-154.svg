<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 392" width="992" height="392" role="img" aria-labelledby="t d"><title id="t">Today: draft goes to one critic call with five scores, then pass or rewrite the whole scene. Proposed: draft goes through code checks, five focused questions read as probabilities, a quote check, and a claim-by-claim contradiction check against the fact ledger, then a verdict with quoted problems and a rewrite of only those sentences.</title><desc id="d">Blue pieces are new. Green is the code layer you already have, which should grow. The continuity dimension moves out of the scene critic into step ④, where your own §14 calibration already showed the contradiction checker can see a planted death.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="991" height="391" rx="10"/>
    <defs>
      <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    </defs>
    <text x="20" y="24" class="m" font-size="12" font-weight="600" letter-spacing="1">TODAY</text>
    <rect class="node" x="20" y="40" width="110" height="56" rx="8"/><text x="75" y="73" font-size="13" text-anchor="middle">Draft</text>
    <rect class="node bad" x="190" y="40" width="330" height="56" rx="8"/><text x="355" y="64" font-size="13" text-anchor="middle">One call: "score these 5 things 1–10"</text><text x="355" y="83" font-size="11" class="w" text-anchor="middle">prints 7 or 8 for nearly every scene</text>
    <rect class="node" x="580" y="40" width="360" height="56" rx="8"/><text x="760" y="64" font-size="13" text-anchor="middle">Pass, or rewrite the WHOLE scene</text><text x="760" y="83" font-size="11" class="m" text-anchor="middle">feedback: "voice 6" — no idea which line</text>
    <line class="edge" x1="130" y1="68" x2="188" y2="68" marker-end="url(#ar3)"/>
    <line class="edge" x1="520" y1="68" x2="578" y2="68" marker-end="url(#ar3)"/>

    <line class="grid" x1="20" y1="126" x2="940" y2="126"/>

    <text x="20" y="156" class="a" font-size="12" font-weight="600" letter-spacing="1">PROPOSED</text>
    <rect class="node" x="20" y="200" width="90" height="70" rx="8"/><text x="65" y="240" font-size="13" text-anchor="middle">Draft</text>

    <rect class="node code" x="140" y="180" width="150" height="110" rx="8"/>
    <text x="215" y="204" font-size="12" text-anchor="middle" font-weight="600">① Code checks</text>
    <text x="215" y="226" font-size="11" class="m" text-anchor="middle">repetition, length,</text>
    <text x="215" y="242" font-size="11" class="m" text-anchor="middle">named cast present,</text>
    <text x="215" y="258" font-size="11" class="m" text-anchor="middle">"she felt sad" count</text>
    <text x="215" y="278" font-size="10" class="g" text-anchor="middle">free · exact</text>

    <rect class="node hl" x="315" y="180" width="160" height="110" rx="8"/>
    <text x="395" y="204" font-size="12" text-anchor="middle" font-weight="600">② 5 focused questions</text>
    <text x="395" y="226" font-size="11" class="m" text-anchor="middle">one dimension per call</text>
    <text x="395" y="242" font-size="11" class="m" text-anchor="middle">read the probabilities</text>
    <text x="395" y="258" font-size="11" class="m" text-anchor="middle">own pass mark each</text>
    <text x="395" y="278" font-size="10" class="a" text-anchor="middle">G-Eval · DeepSeek-GRM</text>

    <rect class="node hl" x="500" y="180" width="150" height="110" rx="8"/>
    <text x="575" y="204" font-size="12" text-anchor="middle" font-weight="600">③ Quote check</text>
    <text x="575" y="226" font-size="11" class="m" text-anchor="middle">every fail must quote</text>
    <text x="575" y="242" font-size="11" class="m" text-anchor="middle">a sentence; code checks</text>
    <text x="575" y="258" font-size="11" class="m" text-anchor="middle">it's really there</text>
    <text x="575" y="278" font-size="10" class="a" text-anchor="middle">DeepSeekMath-V2</text>

    <rect class="node hl" x="675" y="180" width="160" height="110" rx="8"/>
    <text x="755" y="204" font-size="12" text-anchor="middle" font-weight="600">④ Claim check</text>
    <text x="755" y="226" font-size="11" class="m" text-anchor="middle">split scene into facts,</text>
    <text x="755" y="242" font-size="11" class="m" text-anchor="middle">check each vs ledger</text>
    <text x="755" y="258" font-size="11" class="m" text-anchor="middle">(replaces "continuity")</text>
    <text x="755" y="278" font-size="10" class="a" text-anchor="middle">FActScore · ConStory</text>

    <rect class="node" x="860" y="180" width="80" height="110" rx="8"/>
    <text x="900" y="222" font-size="12" text-anchor="middle">Rewrite</text>
    <text x="900" y="238" font-size="12" text-anchor="middle">only the</text>
    <text x="900" y="254" font-size="12" text-anchor="middle">quoted</text>
    <text x="900" y="270" font-size="12" text-anchor="middle">lines</text>

    <line class="edge" x1="110" y1="235" x2="138" y2="235" marker-end="url(#ar3)"/>
    <line class="edge" x1="290" y1="235" x2="313" y2="235" marker-end="url(#ar3)"/>
    <line class="edge" x1="475" y1="235" x2="498" y2="235" marker-end="url(#ar3)"/>
    <line class="edge" x1="650" y1="235" x2="673" y2="235" marker-end="url(#ar3)"/>
    <line class="edge" x1="835" y1="235" x2="858" y2="235" marker-end="url(#ar3)"/>
    <path class="edge dash" d="M215 290 V330 H900 V292" marker-end="url(#ar3)"/>
    <text x="560" y="348" font-size="11" class="m" text-anchor="middle">a hard code failure skips the model calls entirely and goes straight to rewrite</text>
  </svg>

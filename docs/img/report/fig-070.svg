<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 222" width="992" height="222" role="img" aria-labelledby="t d"><title id="t">Continuity claims check: sentences naming someone in the facts, then extract stated and assumed facts, then match claims against facts, then confirm each pair, merged with the direct check.</title><desc id="d">Each step is a question a small model answers reliably. The hard part turned out to be the last one.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="991" height="221" rx="10"/>
    <defs><marker id="ar10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
    <rect class="node code" x="20" y="30" width="160" height="100" rx="8"/>
    <text x="100" y="58" font-size="12" text-anchor="middle" font-weight="600">Sentences that</text>
    <text x="100" y="76" font-size="12" text-anchor="middle" font-weight="600">name someone</text>
    <text x="100" y="94" font-size="11" class="m" text-anchor="middle">in the story facts</text>
    <text x="100" y="118" font-size="10" class="g" text-anchor="middle">code</text>
    <rect class="node hl" x="215" y="30" width="200" height="100" rx="8"/>
    <text x="315" y="58" font-size="12" text-anchor="middle" font-weight="600">① Extract</text>
    <text x="315" y="78" font-size="11" class="m" text-anchor="middle">what each one states</text>
    <text x="315" y="94" font-size="11" class="m" text-anchor="middle">OR takes for granted</text>
    <text x="315" y="116" font-size="10" class="a" text-anchor="middle">"since the day X died" → "X is dead"</text>
    <rect class="node hl" x="450" y="30" width="200" height="100" rx="8"/>
    <text x="550" y="58" font-size="12" text-anchor="middle" font-weight="600">② Match</text>
    <text x="550" y="78" font-size="11" class="m" text-anchor="middle">which claims can't be</text>
    <text x="550" y="94" font-size="11" class="m" text-anchor="middle">true if the facts are?</text>
    <text x="550" y="116" font-size="10" class="g" text-anchor="middle">code checks the fact is real</text>
    <rect class="node hl" x="685" y="30" width="255" height="100" rx="8"/>
    <text x="812" y="58" font-size="12" text-anchor="middle" font-weight="600">③ Confirm each pair</text>
    <text x="812" y="78" font-size="11" class="m" text-anchor="middle">the facts are the story SO FAR:</text>
    <text x="812" y="94" font-size="11" class="m" text-anchor="middle">a scene may show a change,</text>
    <text x="812" y="110" font-size="11" class="m" text-anchor="middle">not assume one never told</text>
    <line class="edge" x1="180" y1="80" x2="213" y2="80" marker-end="url(#ar10)"/>
    <line class="edge" x1="415" y1="80" x2="448" y2="80" marker-end="url(#ar10)"/>
    <line class="edge" x1="650" y1="80" x2="683" y2="80" marker-end="url(#ar10)"/>
    <text x="480" y="170" font-size="11" class="m" text-anchor="middle">runs beside the old direct check; what either confirms is merged, each pair confirmed once</text>
  </svg>

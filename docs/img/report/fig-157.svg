<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 202" width="772" height="202" role="img" aria-labelledby="t d"><title id="t">A replacement judge must pass the bench of 78 real scenes and 12 masterpieces to become a gate again</title><desc id="d">A warning-only judge comes back as a gate only through the bench. The first show-tell replacement didn&#x27;t make it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="201" rx="10"/><defs><marker id="dc72_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="60" width="150" height="50" rx="6"/><text x="95" y="81" font-size="12" text-anchor="middle">Warning judge</text><text x="95" y="97" font-size="11" class="m" text-anchor="middle">show-tell, pacing…</text><line class="edge" x1="170" y1="85" x2="208" y2="85" marker-end="url(#dc72_k)"/><rect class="node" x="210" y="60" width="150" height="50" rx="6"/><text x="285" y="81" font-size="12" text-anchor="middle">Replacement</text><text x="285" y="97" font-size="11" class="m" text-anchor="middle">built and tried</text><line class="edge" x1="360" y1="85" x2="398" y2="85" marker-end="url(#dc72_k)"/><rect class="node hl" x="400" y="50" width="170" height="70" rx="6"/><text x="485" y="73" font-size="12" text-anchor="middle">Bench</text><text x="485" y="89" font-size="11" class="m" text-anchor="middle">78 real scenes</text><text x="485" y="105" font-size="11" class="m" text-anchor="middle">+ 12 masterpieces</text><line class="edge" x1="570" y1="70" x2="608" y2="42" marker-end="url(#dc72_k)"/><rect class="node hl" x="610" y="15" width="110" height="50" rx="6"/><text x="665" y="36" font-size="12" text-anchor="middle">passes</text><text x="665" y="52" font-size="11" class="a" text-anchor="middle">→ gate again</text><line class="edge" x1="570" y1="100" x2="608" y2="128" marker-end="url(#dc72_k)"/><rect class="node bad" x="610" y="105" width="110" height="50" rx="6"/><text x="665" y="126" font-size="12" text-anchor="middle">fails</text><text x="665" y="142" font-size="11" class="w" text-anchor="middle">stays a warning</text><text x="340" y="160" font-size="11" class="m" text-anchor="middle">example: "count the telling" scored AUC 0.46 and failed 7 of 12 masterpieces</text></svg>

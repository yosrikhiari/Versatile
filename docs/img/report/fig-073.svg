<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 192" width="772" height="192" role="img" aria-labelledby="t d"><title id="t">Extract and match find the contradictions; the confirm step rejects the missed ones</title><desc id="d">Recall is low for one reason: the misses get through extraction and matching, then the confirming question turns them down. A better confirmer is the next lever.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="191" rx="10"/><defs><marker id="dc57_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="50" width="140" height="56" rx="6"/><text x="90" y="74" font-size="12" text-anchor="middle">Contradictions</text><text x="90" y="90" font-size="11" class="m" text-anchor="middle">planted + real</text><line class="edge" x1="160" y1="78" x2="198" y2="78" marker-end="url(#dc57_k)"/><rect class="node hl" x="200" y="50" width="120" height="56" rx="6"/><text x="260" y="74" font-size="12" text-anchor="middle">① Extract</text><text x="260" y="90" font-size="11" class="g" text-anchor="middle">finds them</text><line class="edge" x1="320" y1="78" x2="358" y2="78" marker-end="url(#dc57_k)"/><rect class="node hl" x="360" y="50" width="120" height="56" rx="6"/><text x="420" y="74" font-size="12" text-anchor="middle">② Match</text><text x="420" y="90" font-size="11" class="g" text-anchor="middle">pairs them</text><line class="edge" x1="480" y1="78" x2="518" y2="78" marker-end="url(#dc57_k)"/><rect class="node bad" x="520" y="50" width="210" height="56" rx="6"/><text x="625" y="74" font-size="12" text-anchor="middle">③ Confirm</text><text x="625" y="90" font-size="11" class="w" text-anchor="middle">too cautious: misses die here</text><text x="375" y="140" font-size="11" class="m" text-anchor="middle">caught: 5 of 12 plants, 3 of 17 reviewer problems</text></svg>

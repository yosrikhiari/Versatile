<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 932 282" width="932" height="282" role="img" aria-labelledby="t d"><title id="t">Before and after. Masterpieces failed: 11 of 12 before, 0 of 12 after. Today&#x27;s scenes failed: 11 of 48 before, 1 of 48 after. Reviewer continuity problems caught: 0 of 17 before, 3 of 17 after.</title><desc id="d">The cost: the critic now takes about 13–18 seconds more per scene (25.6 minutes for all 78, against 8.1), almost all of it the new continuity step below.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="931" height="281" rx="10"/>
    <text x="20" y="22" font-size="13" font-weight="600">The default gate, before and after (live, same scenes)</text>
    
    <text x="20" y="60" font-size="12" font-weight="600">Masterpieces failed</text>
    <text x="288" y="60" font-size="11" text-anchor="end">before</text><rect class="barA" x="300" y="49" width="403" height="14" style="fill:var(--warn)"/><text x="709" y="61" font-size="11" class="num w">11 / 12</text>
    <text x="288" y="80" font-size="11" text-anchor="end">after</text><rect class="barB" x="300" y="69" width="2" height="14"/><text x="308" y="81" font-size="11" class="num">0 / 12</text>
    <text x="20" y="124" font-size="12" font-weight="600">Today's scenes failed</text>
    <text x="288" y="124" font-size="11" text-anchor="end">before</text><rect class="barA" x="300" y="113" width="101" height="14" style="fill:var(--warn)"/><text x="407" y="125" font-size="11" class="num w">11 / 48</text>
    <text x="288" y="144" font-size="11" text-anchor="end">after</text><rect class="barB" x="300" y="133" width="9" height="14"/><text x="315" y="145" font-size="11" class="num">1 / 48 (voice)</text>
    <text x="20" y="188" font-size="12" font-weight="600">Reviewer continuity problems caught</text>
    <text x="288" y="208" font-size="11" text-anchor="end">before</text><rect class="barA" x="300" y="197" width="2" height="14" style="fill:var(--warn)"/><text x="308" y="209" font-size="11" class="num w">0 / 17</text>
    <text x="288" y="228" font-size="11" text-anchor="end">after</text><rect class="barB" x="300" y="217" width="78" height="14"/><text x="384" y="229" font-size="11" class="num">3 / 17 — and still 0 false alarms on 42 fine scenes</text>
  </svg>

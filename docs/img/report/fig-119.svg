<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 304" width="772" height="304" role="img" aria-labelledby="t d"><title id="t">Seven rewrites: six real flags all fixed, one needing a second try; one false alarm rewritten harmlessly</title><desc id="d">Six real flags, six fixed: five on the first rewrite, one on the second. The rewrite of a false alarm did no harm.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="303" rx="10"/><text x="20" y="18" font-size="11" class="m">scene</text><text x="130" y="18" font-size="11" class="m">flag was</text><text x="310" y="18" font-size="11" class="m">after “Rewrite this scene”</text><text x="630" y="18" font-size="11" class="m">minutes</text><text x="20" y="46" font-size="12">B10 VIII</text><rect x="130" y="28" width="160" height="26" rx="4" class="node hl"/><text x="210" y="45" text-anchor="middle" font-size="11">real</text><rect x="310" y="28" width="300" height="26" rx="4" class="node hl"/><text x="460" y="45" text-anchor="middle" font-size="11">fixed</text><text x="630" y="46" font-size="12">9.9</text><text x="20" y="80" font-size="12">T2 VIII</text><rect x="130" y="62" width="160" height="26" rx="4" class="node hl"/><text x="210" y="79" text-anchor="middle" font-size="11">real</text><rect x="310" y="62" width="300" height="26" rx="4" class="node hl"/><text x="460" y="79" text-anchor="middle" font-size="11">fixed</text><text x="630" y="80" font-size="12">7.3</text><text x="20" y="114" font-size="12">T2 IX ·1</text><rect x="130" y="96" width="160" height="26" rx="4" class="node hl"/><text x="210" y="113" text-anchor="middle" font-size="11">real</text><rect x="310" y="96" width="300" height="26" rx="4" class="node hl"/><text x="460" y="113" text-anchor="middle" font-size="11">fixed</text><text x="630" y="114" font-size="12">4.8</text><text x="20" y="148" font-size="12">T3 VIII</text><rect x="130" y="130" width="160" height="26" rx="4" class="node hl"/><text x="210" y="147" text-anchor="middle" font-size="11">real</text><rect x="310" y="130" width="300" height="26" rx="4" class="node bad"/><text x="460" y="147" text-anchor="middle" font-size="11">not fixed → 2nd try fixed</text><text x="630" y="148" font-size="12">8.0 + 8.1</text><text x="20" y="182" font-size="12">T3 IX ·1</text><rect x="130" y="164" width="160" height="26" rx="4" class="node hl"/><text x="210" y="181" text-anchor="middle" font-size="11">real</text><rect x="310" y="164" width="300" height="26" rx="4" class="node hl"/><text x="460" y="181" text-anchor="middle" font-size="11">fixed</text><text x="630" y="182" font-size="12">7.0</text><text x="20" y="216" font-size="12">T3 IX ·2</text><rect x="130" y="198" width="160" height="26" rx="4" class="node hl"/><text x="210" y="215" text-anchor="middle" font-size="11">real</text><rect x="310" y="198" width="300" height="26" rx="4" class="node hl"/><text x="460" y="215" text-anchor="middle" font-size="11">fixed</text><text x="630" y="216" font-size="12">7.2</text><text x="20" y="250" font-size="12">T2 IX ·2</text><rect x="130" y="232" width="160" height="26" rx="4" class="node dash"/><text x="210" y="249" text-anchor="middle" font-size="11">false (a memory)</text><rect x="310" y="232" width="300" height="26" rx="4" class="node dash"/><text x="460" y="249" text-anchor="middle" font-size="11">harmless</text><text x="630" y="250" font-size="12">4.1</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 248" width="772" height="248" role="img" aria-labelledby="t d"><title id="t">Before: five tabs then a prompt-type switch. After: Scene, Chapter, Arc and a More menu holding Ideate and Blurb; the prompt type becomes chips inside Ideate.</title><desc id="d">Ideate and Blurb are not ways of writing the book and are used far less, so they moved under More. On the way, a shared control was fixed: with no mode checked in the row (while Ideate or Blurb is open), the keyboard could not reach it at all.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="247" rx="10"/>
<text x="20" y="18" font-size="11" class="m">the first screen of the Generator panel</text>
<text x="20" y="48" font-size="12">before</text>
<rect x="100" y="32" width="70" height="26" rx="3" class="node hl"/><text x="135" y="49" font-size="11" text-anchor="middle">Ideate</text>
<rect x="174" y="32" width="70" height="26" rx="3" class="node"/><text x="209" y="49" font-size="11" text-anchor="middle">Scene</text>
<rect x="248" y="32" width="70" height="26" rx="3" class="node"/><text x="283" y="49" font-size="11" text-anchor="middle">Chapter</text>
<rect x="322" y="32" width="70" height="26" rx="3" class="node"/><text x="357" y="49" font-size="11" text-anchor="middle">Arc</text>
<rect x="396" y="32" width="70" height="26" rx="3" class="node"/><text x="431" y="49" font-size="11" text-anchor="middle">Blurb</text>
<text x="480" y="49" font-size="11" class="w">mode 1</text>
<rect x="100" y="64" width="90" height="24" rx="3" class="node hl"/><text x="145" y="80" font-size="10" text-anchor="middle">Story seed</text>
<rect x="194" y="64" width="90" height="24" rx="3" class="node"/><text x="239" y="80" font-size="10" text-anchor="middle">Scenario</text>
<rect x="288" y="64" width="90" height="24" rx="3" class="node"/><text x="333" y="80" font-size="10" text-anchor="middle">What If</text>
<rect x="382" y="64" width="84" height="24" rx="3" class="node"/><text x="424" y="80" font-size="10" text-anchor="middle">Obstacle</text>
<text x="480" y="80" font-size="11" class="w">mode 2 · both forgotten on close</text>
<line x1="20" y1="104" x2="720" y2="104" class="grid"/>
<text x="20" y="134" font-size="12">after</text>
<rect x="100" y="118" width="96" height="26" rx="3" class="node hl"/><text x="148" y="135" font-size="11" text-anchor="middle">Scene</text>
<rect x="200" y="118" width="96" height="26" rx="3" class="node"/><text x="248" y="135" font-size="11" text-anchor="middle">Chapter</text>
<rect x="300" y="118" width="96" height="26" rx="3" class="node"/><text x="348" y="135" font-size="11" text-anchor="middle">Arc</text>
<rect x="404" y="118" width="62" height="26" rx="3" class="node dash"/><text x="435" y="135" font-size="11" text-anchor="middle">More ▾</text>
<text x="480" y="135" font-size="11" class="a">one row of modes, then a brief and a button</text>
<text x="404" y="164" font-size="10" class="m">Ideate · Blurb</text>
<text x="480" y="164" font-size="11" class="m">the More button then names the mode;</text><text x="480" y="180" font-size="11" class="m">the prompt type is chips inside Ideate</text>
<text x="20" y="206" font-size="11" class="m">reopens on the last mode used in each project; a panel asking for a mode still wins</text>
</svg>

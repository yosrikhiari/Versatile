<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 232" width="772" height="232" role="img" aria-labelledby="t d"><title id="t">Tense measured by code: speech removed, share of past-tense verb forms among 56 paired verbs, compared with the scene&#x27;s own original</title><desc id="d">Plain code, no model call. The same verbs are counted in both tenses, so neither gets more chances.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="231" rx="10"/>
<defs><marker id="ta1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="200" height="58" rx="4" class="node"/><text x="120" y="38" text-anchor="middle" font-size="11">a scene</text><text x="120" y="53" text-anchor="middle" font-size="11">narration + “quoted speech”</text><text x="120" y="68" text-anchor="middle" font-size="11">(speech is naturally present)</text><line x1="220" y1="49" x2="258" y2="49" class="edge" marker-end="url(#ta1)"/><rect x="260" y="20" width="210" height="58" rx="4" class="node code"/><text x="365" y="38" text-anchor="middle" font-size="11">remove speech, also speech</text><text x="365" y="53" text-anchor="middle" font-size="11">over several paragraphs</text><text x="365" y="68" text-anchor="middle" font-size="11">(opens “ … never closes)</text><line x1="470" y1="49" x2="508" y2="49" class="edge" marker-end="url(#ta1)"/><rect x="510" y="20" width="210" height="58" rx="4" class="node code"/><text x="615" y="38" text-anchor="middle" font-size="11">count 56 paired verbs</text><text x="615" y="53" text-anchor="middle" font-size="11">was / is · said / says</text><text x="615" y="68" text-anchor="middle" font-size="11">looked / looks · I walk</text><rect x="20" y="112" width="220" height="46" rx="4" class="node hl"/><text x="130" y="139" text-anchor="middle" font-size="11">≥ 75% past → past</text><rect x="260" y="112" width="220" height="46" rx="4" class="node hl"/><text x="370" y="139" text-anchor="middle" font-size="11">≤ 35% past → present</text><rect x="500" y="112" width="220" height="46" rx="4" class="node dash"/><text x="610" y="132" text-anchor="middle" font-size="11">between, or < 10 verbs</text><text x="610" y="146" text-anchor="middle" font-size="11">→ unclear, never flagged</text>
<text x="20" y="190" font-size="11" class="m">compared with the scene's OWN original, as for point of view: some scenes really are told in the present</text></svg>

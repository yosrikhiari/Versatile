<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 142" width="692" height="142" role="img" aria-labelledby="t d"><title id="t">Thirty scenes all scored 8 of 10, including broken ones</title><desc id="d">Schematic of the old critic&#x27;s scores across 30 scenes: a flat line. A constant tells you nothing about any scene.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="141" rx="10"/><line class="grid" x1="60" y1="60" x2="600" y2="60"/><circle class="barB" cx="60" cy="60" r="4"/><circle class="barB" cx="78.5" cy="60" r="4"/><circle class="barB" cx="97" cy="60" r="4"/><circle class="w" cx="115.5" cy="60" r="4"/><circle class="barB" cx="134" cy="60" r="4"/><circle class="barB" cx="152.5" cy="60" r="4"/><circle class="barB" cx="171" cy="60" r="4"/><circle class="barB" cx="189.5" cy="60" r="4"/><circle class="barB" cx="208" cy="60" r="4"/><circle class="w" cx="226.5" cy="60" r="4"/><circle class="barB" cx="245" cy="60" r="4"/><circle class="barB" cx="263.5" cy="60" r="4"/><circle class="barB" cx="282" cy="60" r="4"/><circle class="barB" cx="300.5" cy="60" r="4"/><circle class="barB" cx="319" cy="60" r="4"/><circle class="barB" cx="337.5" cy="60" r="4"/><circle class="barB" cx="356" cy="60" r="4"/><circle class="w" cx="374.5" cy="60" r="4"/><circle class="barB" cx="393" cy="60" r="4"/><circle class="barB" cx="411.5" cy="60" r="4"/><circle class="barB" cx="430" cy="60" r="4"/><circle class="barB" cx="448.5" cy="60" r="4"/><circle class="barB" cx="467" cy="60" r="4"/><circle class="barB" cx="485.5" cy="60" r="4"/><circle class="w" cx="504" cy="60" r="4"/><circle class="barB" cx="522.5" cy="60" r="4"/><circle class="barB" cx="541" cy="60" r="4"/><circle class="barB" cx="559.5" cy="60" r="4"/><circle class="barB" cx="578" cy="60" r="4"/><circle class="barB" cx="596.5" cy="60" r="4"/><text x="44" y="64" font-size="11" class="m" text-anchor="end">8</text><text x="330" y="38" font-size="11" class="m" text-anchor="middle">every scene scored 8 / 10, broken ones too</text><text x="330" y="92" font-size="11" class="w" text-anchor="middle">orange = deliberately broken</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">A failure with a quote is kept only if code finds the quote in the scene</title><desc id="d">DeepSeekMath-V2&#x27;s &quot;prove it&quot; step. A complaint only counts if its quote is really in the scene, and plain code does the checking.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/><defs><marker id="dc5_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="50" width="100" height="50" rx="6"/><text x="70" y="79" font-size="12" text-anchor="middle">Judge</text><line class="edge" x1="120" y1="75" x2="168" y2="75" marker-end="url(#dc5_k)"/><rect class="node" x="170" y="45" width="160" height="60" rx="6"/><text x="250" y="71" font-size="12" text-anchor="middle">Fail + quote</text><text x="250" y="87" font-size="11" class="m" text-anchor="middle">"the exact sentence"</text><line class="edge" x1="330" y1="75" x2="378" y2="75" marker-end="url(#dc5_k)"/><rect class="node code" x="380" y="45" width="170" height="60" rx="6"/><text x="465" y="71" font-size="12" text-anchor="middle">Is it in the scene?</text><text x="465" y="87" font-size="11" class="g" text-anchor="middle">code: exact match</text><line class="edge" x1="550" y1="65" x2="588" y2="37" marker-end="url(#dc5_k)"/><rect class="node hl" x="590" y="15" width="100" height="40" rx="6"/><text x="640" y="39" font-size="12" text-anchor="middle">yes → keep</text><line class="edge" x1="550" y1="85" x2="588" y2="113" marker-end="url(#dc5_k)"/><rect class="node bad" x="590" y="95" width="100" height="40" rx="6"/><text x="640" y="119" font-size="12" text-anchor="middle">no → discard</text><text x="350" y="142" font-size="11" class="m" text-anchor="middle">invented problems are dropped before anyone acts on them</text></svg>

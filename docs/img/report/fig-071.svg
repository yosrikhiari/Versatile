<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 182" width="752" height="182" role="img" aria-labelledby="t d"><title id="t">Version 1 caught 3 of 9 but was void, version 2 caught 1, version 3 caught 3 with no false alarms</title><desc id="d">Same score for v1 and v3, very different meaning. v1&#x27;s example was copied from a test scene. v2 answered a fair question about the wrong thing. v3 asks whether the scene assumes a change the story never told.</desc><style>

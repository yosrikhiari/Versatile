<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 192" width="772" height="192" role="img" aria-labelledby="t d"><title id="t">Books with and without the gate, paired scenes judged by a different judge</title><desc id="d">Step 7 compares gated and ungated books with a judge other than the gate, so the gate never grades itself. (5o answered it scene by scene instead.)</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="191" rx="10"/><defs><marker id="dc80_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node hl" x="20" y="20" width="160" height="44" rx="6"/><text x="100" y="46" font-size="12" text-anchor="middle">Books, gate on</text><rect class="node" x="20" y="100" width="160" height="44" rx="6"/><text x="100" y="126" font-size="12" text-anchor="middle">Books, gate off</text><line class="edge" x1="180" y1="42" x2="238" y2="70" marker-end="url(#dc80_k)"/><line class="edge" x1="180" y1="122" x2="238" y2="94" marker-end="url(#dc80_k)"/><rect class="node" x="240" y="55" width="160" height="54" rx="6"/><text x="320" y="78" font-size="12" text-anchor="middle">Pair their</text><text x="320" y="94" font-size="11" class="m" text-anchor="middle">committed scenes</text><line class="edge" x1="400" y1="82" x2="448" y2="82" marker-end="url(#dc80_k)"/><rect class="node hl" x="450" y="55" width="150" height="54" rx="6"/><text x="525" y="78" font-size="12" text-anchor="middle">Judge that is</text><text x="525" y="94" font-size="11" class="m" text-anchor="middle">not the gate</text><line class="edge" x1="600" y1="82" x2="628" y2="82" marker-end="url(#dc80_k)"/><rect class="node" x="630" y="55" width="100" height="54" rx="6"/><text x="680" y="78" font-size="12" text-anchor="middle">difference</text><text x="680" y="94" font-size="11" class="m" text-anchor="middle">± range</text><text x="525" y="140" font-size="11" class="m" text-anchor="middle">+ your own spot-check reading</text></svg>

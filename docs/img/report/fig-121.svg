<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 216" width="772" height="216" role="img" aria-labelledby="t d"><title id="t">Four false alarms, each an other-time sentence, and the code rule that sets them aside</title><desc id="d">All four false alarms describe the person at another time: a habit, the past, a memory, a moment ago. The prompt already told the model to skip these, and it didn’t, so code does. A plainly-gone sentence is never set aside, so “He thought of Zeena’s absence” still counts.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="215" rx="10"/><defs><marker id="xa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="xa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs><rect x="20" y="14" width="110" height="28" rx="4" class="node dash"/><text x="75" y="32" text-anchor="middle" font-size="11">habit</text><rect x="140" y="14" width="360" height="28" rx="4" class="node bad"/><text x="320" y="32" text-anchor="middle" font-size="11">“I always try to pick a day when Ethan’s off somewheres”</text><rect x="20" y="50" width="110" height="28" rx="4" class="node dash"/><text x="75" y="68" text-anchor="middle" font-size="11">the past</text><rect x="140" y="50" width="360" height="28" rx="4" class="node bad"/><text x="320" y="68" text-anchor="middle" font-size="11">“Zeena Frome had sent Mattie off in a hurry”</text><rect x="20" y="86" width="110" height="28" rx="4" class="node dash"/><text x="75" y="104" text-anchor="middle" font-size="11">a memory</text><rect x="140" y="86" width="360" height="28" rx="4" class="node bad"/><text x="320" y="104" text-anchor="middle" font-size="11">“He thought about Mattie—how she had laughed”</text><rect x="20" y="122" width="110" height="28" rx="4" class="node dash"/><text x="75" y="140" text-anchor="middle" font-size="11">a moment ago</text><rect x="140" y="122" width="360" height="28" rx="4" class="node bad"/><text x="320" y="140" text-anchor="middle" font-size="11">“…same place Mattie had sat just hours ago”</text><line x1="500" y1="80" x2="538" y2="80" class="edge" marker-end="url(#xa1)"/><rect x="540" y="40" width="180" height="80" rx="4" class="node code"/><text x="630" y="62" text-anchor="middle" font-size="11">another time → set aside</text><text x="630" y="76" text-anchor="middle" font-size="11">unless plainly gone:</text><text x="630" y="92" text-anchor="middle" font-size="11">“Zeena’s absence”,</text><text x="630" y="106" text-anchor="middle" font-size="11">“after Zeena left”</text><text x="20" y="172" font-size="11" class="m">set aside → the scene’s own “Zeena’s absence…” stands in, if it has one</text></svg>

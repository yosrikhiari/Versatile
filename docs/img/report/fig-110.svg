<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 232" width="772" height="232" role="img" aria-labelledby="t d"><title id="t">The first live run: a return counted as a move; the fix splits leaving and return</title><desc id="d">One question about “a move” let the model excuse the missing event with the very sentence that shows it. Leaving and return are now separate questions, and code checks that a quoted leaving says one.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="231" rx="10"/>
<defs><marker id="ub1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="ub2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
<text x="20" y="22" font-size="12" class="w">first live run: chapter VIII passed</text>
<rect x="20" y="34" width="330" height="44" rx="4" class="node"/><text x="185" y="52" text-anchor="middle" font-size="11">model, asked for “a move shown”:</text><text x="185" y="68" text-anchor="middle" font-size="11">“Zeena's return came late…”</text><line x1="350" y1="56" x2="388" y2="56" class="edge" marker-end="url(#ub1)"/><rect x="390" y="34" width="330" height="44" rx="4" class="node bad"/><text x="555" y="52" text-anchor="middle" font-size="11">a move is shown → no issue</text><text x="555" y="68" text-anchor="middle" font-size="11">but a return PROVES a leaving nobody saw</text>
<text x="20" y="104" font-size="12" class="a">now</text>
<rect x="20" y="116" width="220" height="44" rx="4" class="node hl"/><text x="130" y="134" text-anchor="middle" font-size="11">“shown leaving”</text><text x="130" y="150" text-anchor="middle" font-size="11">must contain a leaving word</text><rect x="260" y="116" width="220" height="44" rx="4" class="node hl"/><text x="370" y="134" text-anchor="middle" font-size="11">“shown return”</text><text x="370" y="150" text-anchor="middle" font-size="11">is evidence, not an excuse</text><rect x="500" y="116" width="220" height="44" rx="4" class="node hl"/><text x="610" y="134" text-anchor="middle" font-size="11">“Frome” is Ethan's too:</text><text x="610" y="150" text-anchor="middle" font-size="11">not a form of Zeena</text>
<text x="20" y="186" font-size="11" class="m">the model had also quoted “Zeena stood at the door” as a move; the leaving-word rule stops that</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 162" width="772" height="162" role="img" aria-labelledby="t d"><title id="t">Next steps in order: voice votes twice, continuity narrower questions, within-scene fix, show-tell and pacing stay warnings</title><desc id="d">The order set after 5l. (Section 5m later showed the voice flip came from changed input, so step ① became a counting fix instead.)</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="161" rx="10"/><defs><marker id="dc71_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node hl" x="20" y="30" width="160" height="60" rx="6"/><text x="100" y="56" font-size="12" text-anchor="middle">① Voice votes twice</text><text x="100" y="72" font-size="11" class="m" text-anchor="middle">fail only if both agree</text><line class="edge" x1="180" y1="60" x2="203" y2="60" marker-end="url(#dc71_k)"/><rect class="node" x="205" y="30" width="160" height="60" rx="6"/><text x="285" y="56" font-size="12" text-anchor="middle">② Continuity</text><text x="285" y="72" font-size="11" class="m" text-anchor="middle">narrower questions</text><line class="edge" x1="365" y1="60" x2="388" y2="60" marker-end="url(#dc71_k)"/><rect class="node" x="390" y="30" width="160" height="60" rx="6"/><text x="470" y="56" font-size="12" text-anchor="middle">③ Within-scene</text><text x="470" y="72" font-size="11" class="m" text-anchor="middle">fix the then/now error</text><line class="edge" x1="550" y1="60" x2="573" y2="60" marker-end="url(#dc71_k)"/><rect class="node" x="575" y="30" width="160" height="60" rx="6"/><text x="655" y="56" font-size="12" text-anchor="middle">④ Show-tell, pacing</text><text x="655" y="72" font-size="11" class="m" text-anchor="middle">stay warnings</text><text x="370" y="118" font-size="11" class="m" text-anchor="middle">cheapest first; false alarms measured on real clean scenes first</text></svg>

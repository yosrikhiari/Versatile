<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 192" width="772" height="192" role="img" aria-labelledby="t d"><title id="t">Compare by code, flag the later scene, rewrite it with a NEW WORDS rule; the cause is in the writer&#x27;s context</title><desc id="d">Flagging only the later scene of a pair means one rewrite fixes it. The check is a net; the fix is in what the writer is shown, which comes next.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="191" rx="10"/>
<defs><marker id="tc1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="220" height="58" rx="4" class="node code"/><text x="130" y="38" text-anchor="middle" font-size="11">each written scene vs</text><text x="130" y="53" text-anchor="middle" font-size="11">every scene before it</text><text x="130" y="68" text-anchor="middle" font-size="11">and the kept ones after</text><line x1="240" y1="49" x2="278" y2="49" class="edge" marker-end="url(#tc1)"/><rect x="280" y="20" width="200" height="58" rx="4" class="node code"/><text x="380" y="38" text-anchor="middle" font-size="11">shared run ≥ 25 words</text><text x="380" y="53" text-anchor="middle" font-size="11">or ≥ 5% of phrases</text><text x="380" y="68" text-anchor="middle" font-size="11">(never vs its own original)</text><line x1="480" y1="49" x2="518" y2="49" class="edge" marker-end="url(#tc1)"/><rect x="520" y="20" width="200" height="58" rx="4" class="node bad"/><text x="620" y="38" text-anchor="middle" font-size="11">the LATER scene: needs review</text><text x="620" y="53" text-anchor="middle" font-size="11">“Repeats 208 words of</text><text x="620" y="68" text-anchor="middle" font-size="11">The Morlocks: …”</text><line x1="620" y1="78" x2="620" y2="104" class="edge" marker-end="url(#tc1)"/><rect x="420" y="106" width="300" height="40" rx="4" class="node hl"/><text x="570" y="130" text-anchor="middle" font-size="11">Rewrite this scene: “NEW WORDS” rule names the passage</text><rect x="20" y="106" width="380" height="40" rx="4" class="node dash"/><text x="210" y="130" text-anchor="middle" font-size="11">the cause is upstream: the writer sees its recent text</text></svg>

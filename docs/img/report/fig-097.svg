<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 152" width="732" height="152" role="img" aria-labelledby="t d"><title id="t">Timeline of calls with and without the 30-second waits</title><desc id="d">Every call the reader made marked the GPU as busy with priority work for 30 seconds, and then the reader waited for that mark to clear. Background calls no longer set it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="151" rx="10"/>
<text x="20" y="34" font-size="11">before</text>
<rect x="90" y="22" width="60" height="16" class="barA"/><rect x="150" y="22" width="45" height="16" class="barB" opacity=".35"/><rect x="195" y="22" width="60" height="16" class="barA"/><rect x="255" y="22" width="45" height="16" class="barB" opacity=".35"/><rect x="300" y="22" width="60" height="16" class="barA"/><rect x="360" y="22" width="45" height="16" class="barB" opacity=".35"/><rect x="405" y="22" width="60" height="16" class="barA"/><rect x="465" y="22" width="45" height="16" class="barB" opacity=".35"/><rect x="510" y="22" width="60" height="16" class="barA"/><rect x="570" y="22" width="45" height="16" class="barB" opacity=".35"/>
<text x="400" y="56" text-anchor="middle" font-size="10" class="m">grey = 30 s waiting for its own previous call's "writer has priority" hold</text>
<text x="20" y="92" font-size="11" class="a">after</text>
<rect x="90" y="80" width="60" height="16" class="barA"/><rect x="152" y="80" width="60" height="16" class="barA"/><rect x="214" y="80" width="60" height="16" class="barA"/><rect x="276" y="80" width="60" height="16" class="barA"/><rect x="338" y="80" width="60" height="16" class="barA"/>
<text x="600" y="92" font-size="11" class="a">16 → 10.8 min</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 182" width="772" height="182" role="img" aria-labelledby="t d"><title id="t">Two live rewrites: The Morlocks 0 to 74, The Palace 0 to 76, both first person again</title><desc id="d">Two of branch 16&#x27;s drifted chapters, rewritten live with the rule in the brief: both back in the first person, and both pass the single-scene re-check. Two out of two is an example, not a rate.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="181" rx="10"/><text x="20" y="16" font-size="11" class="m">before (third)</text><text x="200" y="16" font-size="11" class="m">after “Rewrite this scene” with the rule (first)</text><text x="20" y="42" font-size="12">The Morlocks</text><text x="20" y="60" font-size="11" class="w">0 per 1,000</text><rect x="200" y="30" width="266" height="16" class="barA"/><text x="472" y="43" font-size="11">74 · 10.8 min</text><text x="200" y="64" font-size="11" class="m">“The cold bit through my boots as I stepped over the broken stones”</text><text x="20" y="100" font-size="12">The Palace of Green Porcelain</text><text x="20" y="118" font-size="11" class="w">0 per 1,000</text><rect x="200" y="88" width="274" height="16" class="barA"/><text x="480" y="101" font-size="11">76 · 11.2 min</text><text x="200" y="122" font-size="11" class="m">“rough under my fingers even through the wool of my coat”</text></svg>

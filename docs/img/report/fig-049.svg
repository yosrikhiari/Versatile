<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 197" width="752" height="197" role="img" aria-labelledby="t d"><title id="t">Collect quotes, drop those about pacing or voice, decide show-tell from the remaining quote</title><desc id="d">DimCheck&#x27;s fix for judges that bleed into each other: gather evidence first, delete anything about another dimension, then judge only from what&#x27;s left.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="196" rx="10"/><defs><marker id="dc37_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="55" width="110" height="50" rx="6"/><text x="75" y="84" font-size="12" text-anchor="middle">Scene</text><line class="edge" x1="130" y1="80" x2="168" y2="80" marker-end="url(#dc37_k)"/><rect class="node hl" x="170" y="40" width="150" height="80" rx="6"/><text x="245" y="68" font-size="12" text-anchor="middle">① Collect quotes</text><text x="245" y="84" font-size="11" class="m" text-anchor="middle">every piece of</text><text x="245" y="100" font-size="11" class="m" text-anchor="middle">evidence first</text><rect class="node" x="360" y="30" width="200" height="26" rx="6"/><text x="460" y="47" font-size="11" text-anchor="middle">"she was afraid" · telling</text><line class="edge" x1="320" y1="80" x2="358" y2="43" marker-end="url(#dc37_k)"/><rect class="node bad" x="360" y="64" width="200" height="26" rx="6"/><text x="460" y="81" font-size="11" text-anchor="middle">"¶15 drags" · pacing</text><line class="edge" x1="320" y1="80" x2="358" y2="77" marker-end="url(#dc37_k)"/><rect class="node bad" x="360" y="98" width="200" height="26" rx="6"/><text x="460" y="115" font-size="11" text-anchor="middle">"flat reply" · voice</text><line class="edge" x1="320" y1="80" x2="358" y2="111" marker-end="url(#dc37_k)"/><line class="edge" x1="560" y1="43" x2="613" y2="75" marker-end="url(#dc37_k)"/><rect class="node hl" x="615" y="55" width="95" height="50" rx="6"/><text x="662.5" y="76" font-size="12" text-anchor="middle">② Decide</text><text x="662.5" y="92" font-size="11" class="m" text-anchor="middle">from the rest</text><text x="460" y="150" font-size="11" class="w" text-anchor="middle">quotes about other dimensions are dropped before the verdict</text></svg>

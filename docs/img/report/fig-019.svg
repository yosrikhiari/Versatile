    <rect class="barA" x="200" y="58" width="384" height="16"/><text x="590" y="71" font-size="11" class="num a">0.81</text>

    <text x="188" y="106" font-size="13" text-anchor="end">show vs tell</text>
    <rect class="barB" x="200" y="90" width="620" height="16"/><text x="826" y="103" font-size="11" class="num">1.00</text>

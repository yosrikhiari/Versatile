<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 192" width="752" height="192" role="img" aria-labelledby="t d"><title id="t">Dialogue split one way scores 7 every time; after the merge fix it scores 5 every time</title><desc id="d">The judge wasn&#x27;t flipping. My dialogue fix changed how lines were split, so the two runs saw different input, and each input got the same score every time.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="191" rx="10"/><defs><marker id="dc63_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="180" height="44" rx="6"/><text x="110" y="46" font-size="12" text-anchor="middle">Dialogue split one way</text><line class="edge" x1="200" y1="42" x2="248" y2="42" marker-end="url(#dc63_k)"/><rect class="node" x="250" y="20" width="150" height="44" rx="6"/><text x="325" y="46" font-size="12" text-anchor="middle">Voice judge</text><line class="edge" x1="400" y1="42" x2="448" y2="42" marker-end="url(#dc63_k)"/><rect class="node" x="450" y="20" width="120" height="44" rx="6"/><text x="510" y="46" font-size="12" text-anchor="middle">7 · pass</text><text x="585" y="46" font-size="11" class="m">every time</text><text x="110" y="88" font-size="11" class="w" text-anchor="middle">different input</text><rect class="node bad" x="20" y="100" width="180" height="44" rx="6"/><text x="110" y="126" font-size="12" text-anchor="middle">After my merge fix</text><line class="edge" x1="200" y1="122" x2="248" y2="122" marker-end="url(#dc63_k)"/><rect class="node" x="250" y="100" width="150" height="44" rx="6"/><text x="325" y="126" font-size="12" text-anchor="middle">Voice judge</text><line class="edge" x1="400" y1="122" x2="448" y2="122" marker-end="url(#dc63_k)"/><rect class="node bad" x="450" y="100" width="120" height="44" rx="6"/><text x="510" y="126" font-size="12" text-anchor="middle">5 · fail</text><text x="585" y="126" font-size="11" class="m">every time</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">Reasoning first caught 5 of 9 with 2 false alarms in 8; answering directly caught 3 of 9 with none</title><desc id="d">Thinking first caught more, but flagged harmless lines such as &quot;Élodie walked the orchard one last time&quot;. A false alarm costs a rewrite, so the quieter version stayed.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/><text x="20" y="22" font-size="12" font-weight="600">Continuity confirmer: two ways to answer</text><text x="200" y="44" font-size="11" class="m">caught</text><text x="460" y="44" font-size="11" class="m">false alarms</text><text x="188" y="70" font-size="12" text-anchor="end">reasoning first</text><rect class="barB" x="200" y="58" width="100" height="16"/><text x="306" y="71" font-size="11">5 / 9</text><rect class="barB" x="460" y="58" width="40" height="16"/><text x="506" y="71" font-size="11" class="w">2 in 8</text><text x="188" y="104" font-size="12" text-anchor="end">answer directly (kept)</text><rect class="barA" x="200" y="92" width="60" height="16"/><text x="266" y="105" font-size="11" class="a">3 / 9</text><text x="462" y="105" font-size="11" class="g">0</text><text x="20" y="140" font-size="11" class="m">each false alarm costs a full rewrite of a good scene</text></svg>

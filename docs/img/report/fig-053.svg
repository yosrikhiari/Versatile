<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">Planted flaw confirmed by a human then judged; and real scenes labelled under a frozen rubric to measure false alarms</title><desc id="d">Planted flaws only show what the gate catches, and only once a human confirms each flaw really makes the text worse. A false-alarm rate needs real scenes labelled by a person, with the rubric fixed before labelling starts.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="221" rx="10"/><defs><marker id="dc41_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="20" font-size="12" font-weight="600">FBI-style planted test</text><rect class="node" x="20" y="32" width="130" height="44" rx="6"/><text x="85" y="58" font-size="12" text-anchor="middle">Plant a flaw</text><line class="edge" x1="150" y1="54" x2="186" y2="54" marker-end="url(#dc41_k)"/><rect class="node hl" x="188" y="32" width="200" height="44" rx="6"/><text x="288" y="58" font-size="12" text-anchor="middle">Human: really worse?</text><line class="edge" x1="388" y1="54" x2="424" y2="54" marker-end="url(#dc41_k)"/><rect class="node" x="426" y="32" width="120" height="44" rx="6"/><text x="486" y="58" font-size="12" text-anchor="middle">Gate judges</text><line class="edge" x1="546" y1="54" x2="582" y2="54" marker-end="url(#dc41_k)"/><rect class="node" x="584" y="32" width="130" height="44" rx="6"/><text x="649" y="58" font-size="12" text-anchor="middle">catch rate</text><text x="288" y="92" font-size="11" class="a" text-anchor="middle">the step we skipped</text><text x="20" y="122" font-size="12" font-weight="600">Honest false-alarm rate</text><rect class="node" x="20" y="134" width="160" height="44" rx="6"/><text x="100" y="160" font-size="12" text-anchor="middle">Freeze the rubric</text><line class="edge" x1="180" y1="156" x2="216" y2="156" marker-end="url(#dc41_k)"/><rect class="node hl" x="218" y="134" width="200" height="44" rx="6"/><text x="318" y="160" font-size="12" text-anchor="middle">Label ~80 real scenes</text><line class="edge" x1="418" y1="156" x2="454" y2="156" marker-end="url(#dc41_k)"/><rect class="node" x="456" y="134" width="120" height="44" rx="6"/><text x="516" y="160" font-size="12" text-anchor="middle">Gate judges</text><line class="edge" x1="576" y1="156" x2="612" y2="156" marker-end="url(#dc41_k)"/><rect class="node" x="614" y="134" width="110" height="44" rx="6"/><text x="669" y="160" font-size="12" text-anchor="middle">false alarms</text></svg>

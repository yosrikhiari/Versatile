" font-size="11">7 rewritten · 51 min</text><rect x="20" y="136" width="60" height="30" rx="4" class="node hl"/><text x="50" y="155" text-anchor="middle" font-size="11">T3</text><rect x="92" y="136" width="170" height="30" rx="4" class="node"/><text x="177" y="155" text-anchor="middle" font-size="11">Ethan Frome</text><rect x="274" y="136" width="250" height="30" rx="4" class="node"/><text x="399" y="155" text-anchor="middle" font-size="11">Zeena lets Mattie stay</text><rect x="536" y="136" width="184" height="30" rx="4" class="node code"/><text x="628" y="155" text-anchor="middle" font-size="11">5 rewritten · 34 min</text></svg>

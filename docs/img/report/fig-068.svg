<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 202" width="772" height="202" role="img" aria-labelledby="t d"><title id="t">Eleven failures, 8 on emotional goal and 3 on pacing; reviewers agreed with none</title><desc id="d">Every failure blamed a dimension the reviewers saw no problem on, and each one bought a repair or rewrite that nudged the prose toward the style the judge prefers.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="201" rx="10"/><defs><marker id="dc54_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="55" width="140" height="60" rx="6"/><text x="90" y="81" font-size="12" text-anchor="middle">11 of 48 failed</text><text x="90" y="97" font-size="11" class="m" text-anchor="middle">today's scenes</text><line class="edge" x1="160" y1="75" x2="208" y2="47" marker-end="url(#dc54_k)"/><line class="edge" x1="160" y1="95" x2="208" y2="123" marker-end="url(#dc54_k)"/><rect class="node bad" x="210" y="20" width="170" height="50" rx="6"/><text x="295" y="49" font-size="12" text-anchor="middle">8 · emotional goal</text><rect class="node bad" x="210" y="100" width="170" height="50" rx="6"/><text x="295" y="129" font-size="12" text-anchor="middle">3 · pacing</text><line class="edge" x1="380" y1="45" x2="428" y2="75" marker-end="url(#dc54_k)"/><line class="edge" x1="380" y1="125" x2="428" y2="95" marker-end="url(#dc54_k)"/><rect class="node" x="430" y="55" width="150" height="60" rx="6"/><text x="505" y="81" font-size="12" text-anchor="middle">Reviewers agree?</text><text x="505" y="97" font-size="11" class="w" text-anchor="middle">0 of 11</text><line class="edge" x1="580" y1="85" x2="608" y2="85" marker-end="url(#dc54_k)"/><rect class="node" x="610" y="55" width="120" height="60" rx="6"/><text x="670" y="81" font-size="12" text-anchor="middle">repair/rewrite</text><text x="670" y="97" font-size="11" class="w" text-anchor="middle">toward LLM style</text></svg>

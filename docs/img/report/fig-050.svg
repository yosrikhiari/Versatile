<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 202" width="772" height="202" role="img" aria-labelledby="t d"><title id="t">A taste question versus extract, code check, yes or no per quote, score</title><desc id="d">Small models are good at extraction and narrow yes/no questions, and poor at taste. So the show-tell judge becomes: quote, verify in code, then one narrow question per quote.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="201" rx="10"/><defs><marker id="dc38_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node bad" x="20" y="20" width="230" height="44" rx="6"/><text x="135" y="38" font-size="12" text-anchor="middle">"Is this dramatised?"</text><text x="135" y="54" font-size="11" class="w" text-anchor="middle">a taste judgment</text><text x="265" y="47" font-size="11" class="m">small models are poor at this; even big ones reach 0.46 precision</text><line class="grid" x1="20" y1="82" x2="720" y2="82"/><rect class="node hl" x="20" y="100" width="170" height="56" rx="6"/><text x="105" y="124" font-size="12" text-anchor="middle">① Extract</text><text x="105" y="140" font-size="11" class="m" text-anchor="middle">quote each named emotion</text><line class="edge" x1="190" y1="128" x2="218" y2="128" marker-end="url(#dc38_k)"/><rect class="node code" x="220" y="100" width="150" height="56" rx="6"/><text x="295" y="124" font-size="12" text-anchor="middle">② Code</text><text x="295" y="140" font-size="11" class="m" text-anchor="middle">quote really there?</text><line class="edge" x1="370" y1="128" x2="398" y2="128" marker-end="url(#dc38_k)"/><rect class="node hl" x="400" y="100" width="190" height="56" rx="6"/><text x="495" y="124" font-size="12" text-anchor="middle">③ Yes / no per quote</text><text x="495" y="140" font-size="11" class="m" text-anchor="middle">shown within 2 sentences?</text><line class="edge" x1="590" y1="128" x2="618" y2="128" marker-end="url(#dc38_k)"/><rect class="node" x="620" y="100" width="100" height="56" rx="6"/><text x="670" y="124" font-size="12" text-anchor="middle">score</text><text x="670" y="140" font-size="11" class="m" text-anchor="middle">share unshown</text></svg>

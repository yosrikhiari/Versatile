<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 202" width="772" height="202" role="img" aria-labelledby="t d"><title id="t">Planner kept a scene from its summary; the second look at the scene&#x27;s own sentences revises it</title><desc id="d">A one-line summary drops the people. A scene the planner wants to keep now gets a second look at its own sentences about the people the change names.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="201" rx="10"/>
<defs><marker id="ya1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="ya2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker><marker id="ya3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
<rect x="20" y="20" width="260" height="46" rx="4" class="node"/><text x="150" y="40" text-anchor="middle" font-size="11">planner sees the summary:</text><text x="150" y="54" text-anchor="middle" font-size="11">“The narrator explores the ruins”</text><line x1="280" y1="43" x2="318" y2="43" class="edge w" marker-end="url(#ya2)"/><rect x="320" y="20" width="180" height="46" rx="4" class="node bad"/><text x="410" y="40" text-anchor="middle" font-size="11">no conflict with</text><text x="410" y="54" text-anchor="middle" font-size="11">“Weena stays behind” → keep</text><rect x="20" y="96" width="260" height="46" rx="4" class="node hl"/><text x="150" y="116" text-anchor="middle" font-size="11">the text says: “Suddenly Weena</text><text x="150" y="130" text-anchor="middle" font-size="11">came very close to my side”</text><line x1="280" y1="119" x2="318" y2="119" class="edge a" marker-end="url(#ya3)"/><rect x="320" y="96" width="180" height="46" rx="4" class="node hl"/><text x="410" y="116" text-anchor="middle" font-size="11">second look with the quotes</text><text x="410" y="130" text-anchor="middle" font-size="11">→ the change reaches it</text><line x1="500" y1="119" x2="538" y2="119" class="edge a" marker-end="url(#ya3)"/><rect x="540" y="96" width="180" height="46" rx="4" class="node hl"/><text x="630" y="116" text-anchor="middle" font-size="11">revise</text><text x="630" y="130" text-anchor="middle" font-size="11">(never drop)</text></svg>

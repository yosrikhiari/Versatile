<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 172" width="772" height="172" role="img" aria-labelledby="t d"><title id="t">ConStory-Bench stories cut to scene size, checked, compared with labels, disagreements hand-checked</title><desc id="d">Step 5: a recall number on natural contradictions. The benchmark&#x27;s labels come from a model, so the disagreements are checked by hand. (Run in 5o: the within-scene checker found almost none.)</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="171" rx="10"/><defs><marker id="dc78_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="30" width="130" height="56" rx="6"/><text x="85" y="54" font-size="12" text-anchor="middle">ConStory-Bench</text><text x="85" y="70" font-size="11" class="m" text-anchor="middle">public, MIT</text><line class="edge" x1="150" y1="58" x2="168" y2="58" marker-end="url(#dc78_k)"/><rect class="node" x="170" y="30" width="110" height="56" rx="6"/><text x="225" y="54" font-size="12" text-anchor="middle">Cut to</text><text x="225" y="70" font-size="11" class="m" text-anchor="middle">scene size</text><line class="edge" x1="280" y1="58" x2="298" y2="58" marker-end="url(#dc78_k)"/><rect class="node hl" x="300" y="30" width="110" height="56" rx="6"/><text x="355" y="54" font-size="12" text-anchor="middle">Continuity</text><text x="355" y="70" font-size="11" class="m" text-anchor="middle">checker</text><line class="edge" x1="410" y1="58" x2="428" y2="58" marker-end="url(#dc78_k)"/><rect class="node" x="430" y="30" width="130" height="56" rx="6"/><text x="495" y="54" font-size="12" text-anchor="middle">Compare with</text><text x="495" y="70" font-size="11" class="m" text-anchor="middle">its labels</text><line class="edge" x1="560" y1="58" x2="578" y2="58" marker-end="url(#dc78_k)"/><rect class="node" x="580" y="30" width="140" height="56" rx="6"/><text x="650" y="54" font-size="12" text-anchor="middle">Hand-check ~50</text><text x="650" y="70" font-size="11" class="m" text-anchor="middle">disagreements</text><text x="370" y="118" font-size="11" class="m" text-anchor="middle">its labels come from a model, so disagreements get a human look</text></svg>

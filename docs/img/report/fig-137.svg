<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 212" width="772" height="212" role="img" aria-labelledby="t d"><title id="t">Stretch check: a rewrite with at least two more present-tense paragraphs than its original is flagged</title><desc id="d">The usual slip is a stretch, not the whole scene: the rewrite reads as past overall, so only a paragraph-by-paragraph count sees it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="211" rx="10"/><text x="20" y="18" font-size="11" class="m">each box a paragraph · shaded: told in the present (≥ 4 verbs, ≤ 20% past)</text><text x="20" y="56" font-size="12">original</text><rect x="100" y="34" width="42" height="34" rx="3" class="node"/><text x="121" y="55" font-size="10" text-anchor="middle" class="m">walked</text><rect x="150" y="34" width="42" height="34" rx="3" class="node"/><text x="171" y="55" font-size="10" text-anchor="middle" class="m">walked</text><rect x="200" y="34" width="42" height="34" rx="3" class="node"/><text x="221" y="55" font-size="10" text-anchor="middle" class="m">walked</text><rect x="250" y="34" width="42" height="34" rx="3" class="node"/><text x="271" y="55" font-size="10" text-anchor="middle" class="m">walked</text><rect x="300" y="34" width="42" height="34" rx="3" class="node"/><text x="321" y="55" font-size="10" text-anchor="middle" class="m">walked</text><rect x="350" y="34" width="42" height="34" rx="3" class="node"/><text x="371" y="55" font-size="10" text-anchor="middle" class="m">walked</text><rect x="400" y="34" width="42" height="34" rx="3" class="node"/><text x="421" y="55" font-size="10" text-anchor="middle" class="m">walked</text><rect x="450" y="34" width="42" height="34" rx="3" class="node"/><text x="471" y="55" font-size="10" text-anchor="middle" class="m">walked</text><text x="510" y="56" font-size="11" class="m">0 present paragraphs</text><text x="20" y="106" font-size="12">rewrite</text><rect x="100" y="84" width="42" height="34" rx="3" class="node"/><text x="121" y="105" font-size="10" text-anchor="middle" class="m">walked</text><rect x="150" y="84" width="42" height="34" rx="3" class="node"/><text x="171" y="105" font-size="10" text-anchor="middle" class="m">walked</text><rect x="200" y="84" width="42" height="34" rx="3" class="node"/><text x="221" y="105" font-size="10" text-anchor="middle" class="m">walked</text><rect x="250" y="84" width="42" height="34" rx="3" class="node bad"/><text x="271" y="105" font-size="10" text-anchor="middle" class="w">walks</text><rect x="300" y="84" width="42" height="34" rx="3" class="node bad"/><text x="321" y="105" font-size="10" text-anchor="middle" class="w">walks</text><rect x="350" y="84" width="42" height="34" rx="3" class="node"/><text x="371" y="105" font-size="10" text-anchor="middle" class="m">walked</text><rect x="400" y="84" width="42" height="34" rx="3" class="node"/><text x="421" y="105" font-size="10" text-anchor="middle" class="m">walked</text><rect x="450" y="84" width="42" height="34" rx="3" class="node"/><text x="471" y="105" font-size="10" text-anchor="middle" class="m">walked</text><text x="510" y="106" font-size="11" class="w">2 more than its original → needs review</text><text x="20" y="150" font-size="11" class="m">why “more than its original”: The Time Machine has 3 such paragraphs of its own (“It is a law of nature we overlook…”)</text><text x="20" y="168" font-size="11" class="m">the 117 past-tense corpus scenes have 0</text></svg>

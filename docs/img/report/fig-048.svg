<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 217" width="752" height="217" role="img" aria-labelledby="t d"><title id="t">With the repeat penalty, later paragraph labels flip from ADVANCES to FILLER; without it they stay ADVANCES</title><desc id="d">Schematic. A judge&#x27;s answer is repetition by design, so the &quot;don&#x27;t repeat yourself&quot; setting meant for prose pushed later labels toward FILLER. Judge calls now use a neutral setting.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="216" rx="10"/><text x="20" y="20" font-size="12" font-weight="600">Pacing judge's answer, one label per paragraph</text><text x="20" y="51" font-size="11" class="w">penalty 1.15</text><text x="20" y="127" font-size="11" class="a">penalty off</text><rect class="node" x="120" y="34" width="58" height="26" rx="3"/><text x="149" y="51" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="120" y="110" width="58" height="26" rx="3"/><text x="149" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="184" y="34" width="58" height="26" rx="3"/><text x="213" y="51" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="184" y="110" width="58" height="26" rx="3"/><text x="213" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="248" y="34" width="58" height="26" rx="3"/><text x="277" y="51" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="248" y="110" width="58" height="26" rx="3"/><text x="277" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="312" y="34" width="58" height="26" rx="3"/><text x="341" y="51" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="312" y="110" width="58" height="26" rx="3"/><text x="341" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="376" y="34" width="58" height="26" rx="3"/><text x="405" y="51" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="376" y="110" width="58" height="26" rx="3"/><text x="405" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="440" y="34" width="58" height="26" rx="3"/><text x="469" y="51" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="440" y="110" width="58" height="26" rx="3"/><text x="469" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="504" y="34" width="58" height="26" rx="3"/><text x="533" y="51" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node" x="504" y="110" width="58" height="26" rx="3"/><text x="533" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node bad" x="568" y="34" width="58" height="26" rx="3"/><text x="597" y="51" font-size="10" text-anchor="middle">FILLER</text><rect class="node" x="568" y="110" width="58" height="26" rx="3"/><text x="597" y="127" font-size="10" text-anchor="middle">ADVANCES</text><rect class="node bad" x="632" y="34" width="58" height="26" rx="3"/><text x="661" y="51" font-size="10" text-anchor="middle">FILLER</text><rect class="node" x="632" y="110" width="58" height="26" rx="3"/><text x="661" y="127" font-size="10" text-anchor="middle">ADVANCES</text><polygon class="barB" points="120,72 690,72 690,62"/><text x="405" y="92" font-size="11" class="m" text-anchor="middle">the penalty grows with every repeat of the same word</text><text x="20" y="172" font-size="11" class="m">clean scenes failing pacing: 7 / 30 → 1 / 30 (penalty off) → 0 / 30 (reversed re-check)</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 182" width="772" height="182" role="img" aria-labelledby="t d"><title id="t">Control branch: the writer drifted to the original plot and the check flagged all three real errors</title><desc id="d">The third branch was meant as a control where nobody leaves. The writer made Zeena leave on its own, and the check caught all three places.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="181" rx="10"/>
<defs><marker id="wc1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="wc2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs>
<rect x="20" y="20" width="210" height="46" rx="4" class="node hl"/><text x="125" y="40" text-anchor="middle" font-size="11">VII (rewritten)</text><text x="125" y="54" text-anchor="middle" font-size="11">“Zeena stood at the foot of the stairs”</text><line x1="230" y1="43" x2="268" y2="43" class="edge w" marker-end="url(#wc2)"/><rect x="270" y="20" width="220" height="46" rx="4" class="node bad"/><text x="380" y="40" text-anchor="middle" font-size="11">VIII: “Zeena’s not coming back</text><text x="380" y="54" text-anchor="middle" font-size="11">tonight… She stayed in Bettsbridge”</text><line x1="490" y1="43" x2="528" y2="43" class="edge w" marker-end="url(#wc2)"/><rect x="530" y="20" width="190" height="46" rx="4" class="node bad"/><text x="625" y="40" text-anchor="middle" font-size="11">IX: “Zeena’s gone, but</text><text x="625" y="54" text-anchor="middle" font-size="11">she’ll come back”</text>
<text x="20" y="100" font-size="11" class="m">the premise keeps Zeena home; the writer slid back to the original book, where she was in Bettsbridge</text>
<text x="20" y="124" font-size="12" class="a">3 flags, 3 real, 0 false alarms</text></svg>

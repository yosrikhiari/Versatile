<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 202" width="752" height="202" role="img" aria-labelledby="t d"><title id="t">Fake writer gave one paragraph so the repair had nothing to cut; an assertion on paragraph count exposed it</title><desc id="d">The first end-to-end repair test passed because its fake input never reached the repair. Asserting the precondition, not just the outcome, exposed it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="201" rx="10"/><defs><marker id="dc31_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="150" height="50" rx="6"/><text x="95" y="41" font-size="12" text-anchor="middle">Fake writer</text><text x="95" y="57" font-size="11" class="m" text-anchor="middle">one long paragraph</text><line class="edge" x1="170" y1="45" x2="208" y2="45" marker-end="url(#dc31_k)"/><rect class="node" x="210" y="20" width="160" height="50" rx="6"/><text x="290" y="41" font-size="12" text-anchor="middle">Repair</text><text x="290" y="57" font-size="11" class="w" text-anchor="middle">nothing to cut</text><line class="edge" x1="370" y1="45" x2="408" y2="45" marker-end="url(#dc31_k)"/><rect class="node bad" x="410" y="20" width="150" height="50" rx="6"/><text x="485" y="49" font-size="12" text-anchor="middle">Test passes</text><text x="575" y="50" font-size="11" class="w">tested nothing</text><line class="grid" x1="20" y1="88" x2="700" y2="88"/><rect class="node code" x="20" y="105" width="150" height="50" rx="6"/><text x="95" y="126" font-size="12" text-anchor="middle">New assertion</text><text x="95" y="142" font-size="11" class="m" text-anchor="middle">critic saw ≥ 3 ¶</text><line class="edge" x1="170" y1="130" x2="208" y2="130" marker-end="url(#dc31_k)"/><rect class="node hl" x="210" y="105" width="160" height="50" rx="6"/><text x="290" y="134" font-size="12" text-anchor="middle">fails at once</text><line class="edge" x1="370" y1="130" x2="408" y2="130" marker-end="url(#dc31_k)"/><rect class="node" x="410" y="105" width="150" height="50" rx="6"/><text x="485" y="126" font-size="12" text-anchor="middle">fixture fixed</text><text x="485" y="142" font-size="11" class="g" text-anchor="middle">a real test</text></svg>

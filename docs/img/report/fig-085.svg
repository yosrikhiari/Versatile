<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 672 262" width="672" height="262" role="img" aria-labelledby="t d"><title id="t">Quadtree: the query box touches 2 of 7 squares; the rest are skipped</title><desc id="d">A quadtree splits a crowded square into four, again and again. A search skips every square its box does not touch. The price is building the tree and rebuilding it whenever things move.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="671" height="261" rx="10"/>
<defs><marker id="qa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="190" height="190" class="node"/>
<line x1="115" y1="20" x2="115" y2="210" class="grid"/><line x1="20" y1="115" x2="210" y2="115" class="grid"/>
<line x1="162" y1="20" x2="162" y2="115" class="grid"/><line x1="115" y1="67" x2="210" y2="67" class="grid"/>
<circle cx="40" cy="40" r="3"/><circle cx="90" cy="60" r="3"/><circle cx="60" cy="150" r="3"/><circle cx="95" cy="190" r="3"/>
<circle cx="130" cy="35" r="3"/><circle cx="150" cy="50" r="3"/><circle cx="180" cy="90" r="3"/><circle cx="200" cy="40" r="3"/><circle cx="140" cy="160" r="3"/><circle cx="190" cy="185" r="3"/>
<rect x="125" y="28" width="60" height="50" fill="none" class="edge a" stroke-width="2"/>
<text x="115" y="226" text-anchor="middle" class="m" font-size="12">a crowded square splits into four</text>
<line x1="235" y1="115" x2="300" y2="115" class="edge" marker-end="url(#qa1)"/>
<text x="268" y="105" text-anchor="middle" font-size="11" class="m">query box</text>
<rect x="320" y="40" width="300" height="34" rx="4" class="node hl"/><text x="470" y="62" text-anchor="middle" font-size="12">look only in squares the box touches: 2 of 7</text>
<rect x="320" y="92" width="300" height="34" rx="4" class="node"/><text x="470" y="114" text-anchor="middle" font-size="12">skip the rest without looking at their points</text>
<rect x="320" y="144" width="300" height="34" rx="4" class="node bad"/><text x="470" y="166" text-anchor="middle" font-size="12">but: rebuild the tree whenever points move</text>
</svg>

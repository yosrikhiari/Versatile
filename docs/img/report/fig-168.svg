<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 197" width="772" height="197" role="img" aria-labelledby="t d"><title id="t">Thirty failed scenes fixed by repair and by rewrite, both judged; repair kept if it wins or ties at lower cost</title><desc id="d">Step 6&#x27;s fair test. Result in 5o: the repair ties on quality at about 1/70 of the time, so it stays first.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="196" rx="10"/><defs><marker id="dc79_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="60" width="150" height="50" rx="6"/><text x="95" y="89" font-size="12" text-anchor="middle">30 failed scenes</text><line class="edge" x1="170" y1="75" x2="218" y2="47" marker-end="url(#dc79_k)"/><line class="edge" x1="170" y1="95" x2="218" y2="123" marker-end="url(#dc79_k)"/><rect class="node hl" x="220" y="20" width="170" height="50" rx="6"/><text x="305" y="49" font-size="12" text-anchor="middle">Repair in place</text><rect class="node" x="220" y="100" width="170" height="50" rx="6"/><text x="305" y="129" font-size="12" text-anchor="middle">Fresh rewrite</text><text x="305" y="90" font-size="11" class="m" text-anchor="middle">equal compute</text><line class="edge" x1="390" y1="45" x2="438" y2="75" marker-end="url(#dc79_k)"/><line class="edge" x1="390" y1="125" x2="438" y2="95" marker-end="url(#dc79_k)"/><rect class="node" x="440" y="60" width="150" height="50" rx="6"/><text x="515" y="89" font-size="12" text-anchor="middle">Gate + labels</text><line class="edge" x1="590" y1="85" x2="618" y2="85" marker-end="url(#dc79_k)"/><rect class="node code" x="620" y="55" width="110" height="60" rx="6"/><text x="675" y="73" font-size="12" text-anchor="middle">keep repair if</text><text x="675" y="89" font-size="11" class="m" text-anchor="middle">it wins or ties</text><text x="675" y="105" font-size="11" class="m" text-anchor="middle">at lower cost</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">Chapter VIII: a missing event rather than a contradicted fact</title><desc id="d">Chapter VIII does not contradict any stated fact. It skips an event, Zeena leaving, that never happens. Catching that needs tracking who is where, scene by scene: built in 5u.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/>
<rect x="20" y="30" width="100" height="34" rx="4" class="node hl"/><text x="70" y="52" text-anchor="middle" font-size="11">IV: stays</text><rect x="130" y="30" width="100" height="34" rx="4" class="node hl"/><text x="180" y="52" text-anchor="middle" font-size="11">V: home</text><rect x="240" y="30" width="100" height="34" rx="4" class="node hl"/><text x="290" y="52" text-anchor="middle" font-size="11">VI: home</text><rect x="350" y="30" width="100" height="34" rx="4" class="node hl"/><text x="400" y="52" text-anchor="middle" font-size="11">VII: home</text><rect x="460" y="30" width="100" height="34" rx="4" class="node dash"/><text x="510" y="52" text-anchor="middle" font-size="11">??? leaves</text><rect x="570" y="30" width="100" height="34" rx="4" class="node bad"/><text x="620" y="52" text-anchor="middle" font-size="11">VIII: gone</text>
<text x="185" y="90" text-anchor="middle" font-size="11" class="a">the premise covers one night</text>
<text x="515" y="90" text-anchor="middle" font-size="11" class="w">nothing shows her leaving</text>
<text x="350" y="125" text-anchor="middle" font-size="11" class="m">no fact says "Zeena is still at home", so a fact check has nothing to hold VIII against</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 202" width="752" height="202" role="img" aria-labelledby="t d"><title id="t">Vague feedback leads to a whole-scene rewrite; quoted feedback leads to rewriting one sentence and keeping the rest</title><desc id="d">Self-Refine helps only when the feedback is specific and trustworthy. So rewrite only the quoted bad sentences: more precise, and much cheaper than redoing the scene.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="201" rx="10"/><defs><marker id="dc14_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="170" height="44" rx="6"/><text x="105" y="46" font-size="12" text-anchor="middle">Feedback: "voice 6"</text><line class="edge" x1="190" y1="42" x2="238" y2="42" marker-end="url(#dc14_k)"/><rect class="node bad" x="240" y="20" width="210" height="44" rx="6"/><text x="345" y="46" font-size="12" text-anchor="middle">Rewrite the whole scene</text><text x="465" y="46" font-size="11" class="w">vague: can get worse</text><line class="grid" x1="20" y1="84" x2="700" y2="84"/><rect class="node" x="20" y="104" width="170" height="56" rx="6"/><text x="105" y="128" font-size="12" text-anchor="middle">Feedback quotes</text><text x="105" y="144" font-size="11" class="m" text-anchor="middle">the bad sentence</text><line class="edge" x1="190" y1="132" x2="238" y2="132" marker-end="url(#dc14_k)"/><rect class="node hl" x="240" y="104" width="210" height="56" rx="6"/><text x="345" y="136" font-size="12" text-anchor="middle">Rewrite that sentence only</text><line class="edge" x1="450" y1="132" x2="488" y2="132" marker-end="url(#dc14_k)"/><rect class="node code" x="490" y="110" width="200" height="44" rx="6"/><text x="590" y="136" font-size="12" text-anchor="middle">rest of the scene kept</text></svg>

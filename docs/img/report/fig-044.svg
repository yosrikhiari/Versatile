<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 332" width="772" height="332" role="img" aria-labelledby="t d"><title id="t">Twenty paragraphs with 7 and 15 as filler; pacing 5, voice 8, continuity 3, repair cuts two paragraphs and passes</title><desc id="d">The worked example as a trace: what each judge reads and what it returns. Only two paragraphs and one sentence change. The other 18 paragraphs are saved untouched, with no 75-second rewrite.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="331" rx="10"/><text x="20" y="20" font-size="12" font-weight="600">The scene: 20 paragraphs</text><rect class="node" x="20" y="30" width="30" height="24" rx="3"/><text x="35" y="46" font-size="10" text-anchor="middle">1</text><rect class="node" x="54" y="30" width="30" height="24" rx="3"/><text x="69" y="46" font-size="10" text-anchor="middle">2</text><rect class="node" x="88" y="30" width="30" height="24" rx="3"/><text x="103" y="46" font-size="10" text-anchor="middle">3</text><rect class="node" x="122" y="30" width="30" height="24" rx="3"/><text x="137" y="46" font-size="10" text-anchor="middle">4</text><rect class="node" x="156" y="30" width="30" height="24" rx="3"/><text x="171" y="46" font-size="10" text-anchor="middle">5</text><rect class="node" x="190" y="30" width="30" height="24" rx="3"/><text x="205" y="46" font-size="10" text-anchor="middle">6</text><rect class="node bad" x="224" y="30" width="30" height="24" rx="3"/><text x="239" y="46" font-size="10" text-anchor="middle">7</text><rect class="node" x="258" y="30" width="30" height="24" rx="3"/><text x="273" y="46" font-size="10" text-anchor="middle">8</text><rect class="node" x="292" y="30" width="30" height="24" rx="3"/><text x="307" y="46" font-size="10" text-anchor="middle">9</text><rect class="node" x="326" y="30" width="30" height="24" rx="3"/><text x="341" y="46" font-size="10" text-anchor="middle">10</text><rect class="node" x="360" y="30" width="30" height="24" rx="3"/><text x="375" y="46" font-size="10" text-anchor="middle">11</text><rect class="node" x="394" y="30" width="30" height="24" rx="3"/><text x="409" y="46" font-size="10" text-anchor="middle">12</text><rect class="node" x="428" y="30" width="30" height="24" rx="3"/><text x="443" y="46" font-size="10" text-anchor="middle">13</text><rect class="node" x="462" y="30" width="30" height="24" rx="3"/><text x="477" y="46" font-size="10" text-anchor="middle">14</text><rect class="node bad" x="496" y="30" width="30" height="24" rx="3"/><text x="511" y="46" font-size="10" text-anchor="middle">15</text><rect class="node" x="530" y="30" width="30" height="24" rx="3"/><text x="545" y="46" font-size="10" text-anchor="middle">16</text><rect class="node" x="564" y="30" width="30" height="24" rx="3"/><text x="579" y="46" font-size="10" text-anchor="middle">17</text><rect class="node" x="598" y="30" width="30" height="24" rx="3"/><text x="613" y="46" font-size="10" text-anchor="middle">18</text><rect class="node" x="632" y="30" width="30" height="24" rx="3"/><text x="647" y="46" font-size="10" text-anchor="middle">19</text><rect class="node" x="666" y="30" width="30" height="24" rx="3"/><text x="681" y="46" font-size="10" text-anchor="middle">20</text><text x="20" y="72" font-size="11" class="w">plus one line: "Halim had been dead two years" (the bible says he's alive)</text><rect class="node hl" x="20" y="90" width="120" height="28" rx="6"/><text x="80" y="108" font-size="12" text-anchor="middle">Pacing</text><text x="150" y="109" font-size="11">flags ¶ 7 and 15 · reversed pass agrees</text><text x="720" y="109" font-size="11" class="w" text-anchor="end">5 · fails</text><rect class="node" x="20" y="124" width="120" height="28" rx="6"/><text x="80" y="142" font-size="12" text-anchor="middle">Show-tell</text><text x="150" y="143" font-size="11">reads 18 ¶: 7 and 15 hidden (blame once)</text><text x="720" y="143" font-size="11" class="m" text-anchor="end">no double blame</text><rect class="node hl" x="20" y="158" width="120" height="28" rx="6"/><text x="80" y="176" font-size="12" text-anchor="middle">Voice</text><text x="150" y="177" font-size="11">reads only the 14 dialogue lines</text><text x="720" y="177" font-size="11" class="g" text-anchor="end">8 · pass</text><rect class="node hl" x="20" y="192" width="120" height="28" rx="6"/><text x="80" y="210" font-size="12" text-anchor="middle">Continuity</text><text x="150" y="211" font-size="11">earlier facts + 6 sentences naming Halim or Nesrin</text><text x="720" y="211" font-size="11" class="w" text-anchor="end">3 · fails</text><rect class="node" x="20" y="226" width="120" height="28" rx="6"/><text x="80" y="244" font-size="12" text-anchor="middle">Verdict</text><text x="150" y="245" font-size="11">continuity 3, pacing 5: both named</text><rect class="node code" x="20" y="260" width="120" height="28" rx="6"/><text x="80" y="278" font-size="12" text-anchor="middle">Repair</text><text x="150" y="279" font-size="11">cut ¶ 7, 15 · rewrite 1 sentence · judged again</text><text x="720" y="279" font-size="11" class="g" text-anchor="end">pass · 18 of 20 ¶ kept</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 232" width="752" height="232" role="img" aria-labelledby="t d"><title id="t">Clean set contains scene 2 with distinct dialogue scoring 9 and scene 17 with interchangeable lines failing at 5 on all four runs</title><desc id="d">Scene 17 fails voice on every run, including a reversed one, so it isn&#x27;t noise. Reading its dialogue shows why: the lines are interchangeable. &quot;Not injected&quot; never meant &quot;good&quot;.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="231" rx="10"/><rect class="node" x="20" y="20" width="680" height="170" rx="8"/><text x="40" y="44" font-size="12" font-weight="600">30 "clean" scenes = not broken by me, not guaranteed good</text><rect class="node hl" x="40" y="60" width="300" height="80" rx="6"/><text x="190" y="88" font-size="12" text-anchor="middle">Scene 2: voice 9</text><text x="190" y="104" font-size="11" class="m" text-anchor="middle">"We deal in certainty, not faith."</text><text x="190" y="120" font-size="11" class="g" text-anchor="middle">a real person talking</text><rect class="node bad" x="380" y="60" width="300" height="80" rx="6"/><text x="530" y="88" font-size="12" text-anchor="middle">Scene 17: voice 5</text><text x="530" y="104" font-size="11" class="m" text-anchor="middle">"It does," / "I know."</text><text x="530" y="120" font-size="11" class="w" text-anchor="middle">any character could say it</text><text x="40" y="172" font-size="11" class="g">passes</text><text x="380" y="172" font-size="11" class="m">4 runs (3 + 1 reversed):</text><rect class="node bad" x="545" y="157" width="24" height="20" rx="3"/><text x="557" y="171" font-size="11" text-anchor="middle">5</text><rect class="node bad" x="577" y="157" width="24" height="20" rx="3"/><text x="589" y="171" font-size="11" text-anchor="middle">5</text><rect class="node bad" x="609" y="157" width="24" height="20" rx="3"/><text x="621" y="171" font-size="11" text-anchor="middle">5</text><rect class="node bad" x="641" y="157" width="24" height="20" rx="3"/><text x="653" y="171" font-size="11" text-anchor="middle">5</text></svg>

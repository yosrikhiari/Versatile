<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 242" width="772" height="242" role="img" aria-labelledby="t d"><title id="t">Old versus new planner on the same premise: contradicting kept chapters 2 to 0, flags 3 to 0</title><desc id="d">The same premise, “What if Weena stays behind?”, planned and written twice. With the new planner, nothing that contradicts the change is kept, and the check has nothing to flag. Zero flags here is correct: every Weena sentence is a memory, an absence or an echo.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="241" rx="10"/><text x="300" y="16" font-size="11" class="w">old planner (5x)</text><text x="520" y="16" font-size="11" class="a">new planner (5y)</text><text x="20" y="44" font-size="12">chapters kept that contradict the change</text><rect x="300" y="26" width="200" height="28" rx="4" class="node bad"/><text x="400" y="44" text-anchor="middle" font-size="11">2</text><rect x="520" y="26" width="200" height="28" rx="4" class="node hl"/><text x="620" y="44" text-anchor="middle" font-size="11">0</text><text x="20" y="80" font-size="12">chapters rewritten</text><rect x="300" y="62" width="200" height="28" rx="4" class="node"/><text x="400" y="80" text-anchor="middle" font-size="11">5</text><rect x="520" y="62" width="200" height="28" rx="4" class="node"/><text x="620" y="80" text-anchor="middle" font-size="11">8</text><text x="20" y="116" font-size="12">flags</text><rect x="300" y="98" width="200" height="28" rx="4" class="node bad"/><text x="400" y="116" text-anchor="middle" font-size="11">3 (wrong side)</text><rect x="520" y="98" width="200" height="28" rx="4" class="node hl"/><text x="620" y="116" text-anchor="middle" font-size="11">0</text><text x="20" y="152" font-size="12">Weena with the Traveller after the change</text><rect x="300" y="134" width="200" height="28" rx="4" class="node bad"/><text x="400" y="152" text-anchor="middle" font-size="11">yes, in kept chapters</text><rect x="520" y="134" width="200" height="28" rx="4" class="node hl"/><text x="620" y="152" text-anchor="middle" font-size="11">nowhere (28 sentences read)</text><text x="20" y="188" font-size="12">time</text><rect x="300" y="170" width="200" height="28" rx="4" class="node"/><text x="400" y="188" text-anchor="middle" font-size="11">59 min</text><rect x="520" y="170" width="200" height="28" rx="4" class="node"/><text x="620" y="188" text-anchor="middle" font-size="11">78.6 min</text></svg>

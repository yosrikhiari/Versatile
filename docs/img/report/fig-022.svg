<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 262" width="732" height="262" role="img" aria-labelledby="t d"><title id="t">Per-defect bars: padding 2 to 4 of 4, summary 4 to 4, voice 3 to 3, contradiction 0 to 0</title><desc id="d">Right problem named, per planted defect (4 scenes each). Isolation fixed padding and points at the exact paragraphs. Contradiction was never named, which is why continuity got its own checker.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="261" rx="10"/><rect class="barB" x="200" y="12" width="14" height="10"/><text x="220" y="21" font-size="11">focused, whole scene</text><rect class="barA" x="380" y="12" width="14" height="10"/><text x="400" y="21" font-size="11">focused, isolated (new)</text><text x="188" y="62" font-size="12" text-anchor="end">padding</text><rect class="barB" x="200" y="40" width="120" height="14"/><text x="326" y="52" font-size="11">2 / 4</text><rect class="barA" x="200" y="57" width="240" height="14"/><text x="446" y="69" font-size="11" class="a">4 / 4 · with ¶ numbers</text><text x="188" y="108" font-size="12" text-anchor="end">empty summary</text><rect class="barB" x="200" y="86" width="240" height="14"/><text x="446" y="98" font-size="11">4 / 4</text><rect class="barA" x="200" y="103" width="240" height="14"/><text x="446" y="115" font-size="11" class="a">4 / 4</text><text x="188" y="154" font-size="12" text-anchor="end">flattened voice</text><rect class="barB" x="200" y="132" width="180" height="14"/><text x="386" y="144" font-size="11">3 / 4</text><rect class="barA" x="200" y="149" width="180" height="14"/><text x="386" y="161" font-size="11" class="a">3 / 4 · 4th scene: too little dialogue</text><text x="188" y="200" font-size="12" text-anchor="end">contradiction</text><rect class="barB" x="200" y="178" width="2" height="14"/><text x="208" y="190" font-size="11">0 / 4</text><rect class="barA" x="200" y="195" width="2" height="14"/><text x="208" y="207" font-size="11" class="a">0 / 4 named</text></svg>

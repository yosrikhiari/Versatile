<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 182" width="772" height="182" role="img" aria-labelledby="t d"><title id="t">Alternating Versatile and Jester calls cause 18-second reloads; with Jester paused there are none</title><desc id="d">Two programs taking turns on one GPU forced Ollama to reload the model at every switch, about 18 seconds each. With Jester paused the same work ran without reloads, so the earlier &quot;59 minutes&quot; was not a real cost.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="181" rx="10"/><text x="20" y="22" font-size="12" font-weight="600">Jester running</text><rect class="node hl" x="20" y="34" width="90" height="26" rx="3"/><text x="65" y="51" font-size="10" text-anchor="middle">Versatile</text><rect class="node bad" x="110" y="34" width="40" height="26" rx="3"/><text x="130" y="51" font-size="10" text-anchor="middle">18 s</text><rect class="node" x="150" y="34" width="80" height="26" rx="3"/><text x="190" y="51" font-size="10" text-anchor="middle">Jester</text><rect class="node bad" x="230" y="34" width="40" height="26" rx="3"/><text x="250" y="51" font-size="10" text-anchor="middle">18 s</text><rect class="node hl" x="270" y="34" width="90" height="26" rx="3"/><text x="315" y="51" font-size="10" text-anchor="middle">Versatile</text><rect class="node bad" x="360" y="34" width="40" height="26" rx="3"/><text x="380" y="51" font-size="10" text-anchor="middle">18 s</text><rect class="node" x="400" y="34" width="80" height="26" rx="3"/><text x="440" y="51" font-size="10" text-anchor="middle">Jester</text><rect class="node bad" x="480" y="34" width="40" height="26" rx="3"/><text x="500" y="51" font-size="10" text-anchor="middle">18 s</text><rect class="node hl" x="520" y="34" width="90" height="26" rx="3"/><text x="565" y="51" font-size="10" text-anchor="middle">Versatile</text><text x="615" y="52" font-size="11" class="w">reload each switch</text><text x="20" y="100" font-size="12" font-weight="600">Jester paused</text><rect class="node hl" x="20" y="112" width="90" height="26" rx="3"/><text x="65" y="129" font-size="10" text-anchor="middle">Versatile</text><rect class="node hl" x="114" y="112" width="90" height="26" rx="3"/><text x="159" y="129" font-size="10" text-anchor="middle">Versatile</text><rect class="node hl" x="208" y="112" width="90" height="26" rx="3"/><text x="253" y="129" font-size="10" text-anchor="middle">Versatile</text><rect class="node hl" x="302" y="112" width="90" height="26" rx="3"/><text x="347" y="129" font-size="10" text-anchor="middle">Versatile</text><text x="400" y="130" font-size="11" class="a">no reloads: the clean timing</text></svg>

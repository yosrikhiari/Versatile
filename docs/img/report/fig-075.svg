<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 232" width="772" height="232" role="img" aria-labelledby="t d"><title id="t">In a planted scene clean sentences sit far from facts; in a real scene many sit close, and a harmless one gets flagged</title><desc id="d">Why the planted sets hid the false alarms. A planted flaw is blunt and the clean text around it rarely touches a story fact. Real scenes are full of sentences that brush against facts, which is where false alarms live.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="231" rx="10"/><defs><marker id="dc59_w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs><text x="20" y="20" font-size="12" font-weight="600">Planted scene</text><line class="edge a" x1="30" y1="150" x2="340" y2="150"/><text x="185" y="168" font-size="11" class="a" text-anchor="middle">a story fact</text><circle class="barB" cx="50" cy="50" r="5"/><circle class="barB" cx="90" cy="72" r="5"/><circle class="barB" cx="140" cy="45" r="5"/><circle class="barB" cx="200" cy="62" r="5"/><circle class="barB" cx="250" cy="40" r="5"/><circle class="barB" cx="300" cy="66" r="5"/><circle class="barB" cx="320" cy="92" r="5"/><circle class="barB" cx="70" cy="95" r="5"/><circle class="w" cx="185" cy="140" r="5"/><text x="200" y="132" font-size="11" class="w">blunt flaw</text><text x="185" y="192" font-size="11" class="m" text-anchor="middle">no clean sentence comes near a fact</text><text x="390" y="20" font-size="12" font-weight="600">Real scene</text><line class="edge a" x1="400" y1="150" x2="710" y2="150"/><text x="555" y="168" font-size="11" class="a" text-anchor="middle">a story fact</text><circle class="barB" cx="420" cy="130" r="5"/><circle class="barB" cx="460" cy="120" r="5"/><circle class="barB" cx="500" cy="136" r="5"/><circle class="barB" cx="540" cy="112" r="5"/><circle class="barB" cx="620" cy="138" r="5"/><circle class="barB" cx="660" cy="118" r="5"/><circle class="barB" cx="700" cy="132" r="5"/><circle class="barB" cx="440" cy="104" r="5"/><circle class="w" cx="580" cy="128" r="5"/><text x="560" y="90" font-size="11" class="w" text-anchor="middle">"Lucie finally lifted her gaze"</text><line class="edge w" x1="575" y1="96" x2="579" y2="120" marker-end="url(#dc59_w)"/><text x="555" y="192" font-size="11" class="m" text-anchor="middle">many harmless sentences brush against facts</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 246" width="772" height="246" role="img" aria-labelledby="t d"><title id="t">Sixteen updates: seven npm minors applied together, seven .NET minors applied one by one with one fixed by hand, two majors tested in the running app before merging</title><desc id="d">None of the sixteen was merged as it stood. The two majors had small, checkable breaking changes: Pinia 4 is ESM-only and needs a newer devtools package, VueUse 15 removed functions this app does not use.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="245" rx="10"/>
<defs><marker id="ha1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="200" height="46" rx="4" class="node"/><text x="120" y="40" text-anchor="middle" font-size="11">7 npm minor updates</text><text x="120" y="54" text-anchor="middle" font-size="11" class="m">all edit package-lock.json</text>
<line x1="220" y1="43" x2="258" y2="43" class="edge" marker-end="url(#ha1)"/>
<rect x="260" y="20" width="460" height="46" rx="4" class="node code"/><text x="490" y="40" text-anchor="middle" font-size="11">applied together, so the lockfile resolves once (merged one by one,</text><text x="490" y="54" text-anchor="middle" font-size="11">each would have conflicted with the next)</text>
<rect x="20" y="80" width="200" height="46" rx="4" class="node"/><text x="120" y="100" text-anchor="middle" font-size="11">7 .NET minor updates</text><text x="120" y="114" text-anchor="middle" font-size="11" class="m">one project file each, mostly</text>
<line x1="220" y1="103" x2="258" y2="103" class="edge" marker-end="url(#ha1)"/>
<rect x="260" y="80" width="460" height="46" rx="4" class="node code"/><text x="490" y="100" text-anchor="middle" font-size="11">applied one by one; OpenAI 2.14 clashed with its neighbours and was</text><text x="490" y="114" text-anchor="middle" font-size="11">applied by hand · backend: 988 tests pass</text>
<rect x="20" y="140" width="200" height="46" rx="4" class="node bad"/><text x="120" y="160" text-anchor="middle" font-size="11">2 major updates</text><text x="120" y="174" text-anchor="middle" font-size="11" class="m">Pinia 4 · VueUse 15</text>
<line x1="220" y1="163" x2="258" y2="163" class="edge" marker-end="url(#ha1)"/>
<rect x="260" y="140" width="460" height="46" rx="4" class="node hl"/><text x="490" y="160" text-anchor="middle" font-size="11">release notes read against the code, then the running app tested</text><text x="490" y="174" text-anchor="middle" font-size="11">before merging: stores, live counts, save, streak, sidebar widths</text>
<text x="20" y="206" font-size="11" class="m">every one: typecheck, lint, policy, build, Storybook build, all front-end tests · 0 open pull requests after</text>

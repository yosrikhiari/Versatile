<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 712 147" width="712" height="147" role="img" aria-labelledby="t d"><title id="t">Saved scenes re-graded by a better checker overturn the old finding</title><desc id="d">Keeping the evidence, not just the counts, made it cheap to overturn a week-old conclusion.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="711" height="146" rx="10"/><defs><marker id="dc97_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node code" x="20" y="30" width="150" height="50" rx="6"/><text x="95" y="51" font-size="12" text-anchor="middle">Saved raw scenes</text><text x="95" y="67" font-size="11" class="m" text-anchor="middle">24 of them</text><line class="edge" x1="170" y1="55" x2="218" y2="55" marker-end="url(#dc97_k)"/><rect class="node hl" x="220" y="30" width="150" height="50" rx="6"/><text x="295" y="59" font-size="12" text-anchor="middle">Better checker</text><line class="edge" x1="370" y1="55" x2="418" y2="55" marker-end="url(#dc97_k)"/><rect class="node" x="420" y="30" width="240" height="50" rx="6"/><text x="540" y="51" font-size="12" text-anchor="middle">old finding overturned</text><text x="540" y="67" font-size="11" class="m" text-anchor="middle">"facts list hurts": retracted</text></svg>

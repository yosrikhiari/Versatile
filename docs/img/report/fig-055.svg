c43_k)"/><line class="edge" x1="370" y1="160" x2="408" y2="152" marker-end="url(#dc43_k)"/><rect class="node" x="410" y="122" width="120" height="50" rx="6"/><text x="470" y="151" font-size="12" text-anchor="middle">Compare</text><line class="edge" x1="530" y1="147" x2="568" y2="147" marker-end="url(#dc43_k)"/><rect class="node bad" x="570" y="122" width="150" height="50" rx="6"/><text x="645" y="143" font-size="12" text-anchor="middle">caught?</text><text x="645" y="159" font-size="11" class="w" text-anchor="middle">nearly none</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 232" width="772" height="232" role="img" aria-labelledby="t d"><title id="t">Two blind reviewer groups label 78 scenes, agree at kappa 0.66 to 0.89; your 12 labels check them against you</title><desc id="d">All 78 scenes were labelled twice, by groups that never saw each other&#x27;s labels or the gate&#x27;s verdicts. Their agreement makes them a usable reference. Your 12 labels will show whether they stand in for you.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="231" rx="10"/><defs><marker id="dc44_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="70" width="130" height="56" rx="6"/><text x="85" y="94" font-size="12" text-anchor="middle">78 real scenes</text><text x="85" y="110" font-size="11" class="m" text-anchor="middle">4 stories</text><line class="edge" x1="150" y1="85" x2="198" y2="47" marker-end="url(#dc44_k)"/><line class="edge" x1="150" y1="110" x2="198" y2="148" marker-end="url(#dc44_k)"/><rect class="node hl" x="200" y="20" width="200" height="50" rx="6"/><text x="300" y="41" font-size="12" text-anchor="middle">Reviewer group A</text><text x="300" y="57" font-size="11" class="m" text-anchor="middle">frozen rubric, blind</text><rect class="node hl" x="200" y="125" width="200" height="50" rx="6"/><text x="300" y="146" font-size="12" text-anchor="middle">Reviewer group B</text><text x="300" y="162" font-size="11" class="m" text-anchor="middle">can't see group A</text><line class="edge" x1="400" y1="45" x2="448" y2="85" marker-end="url(#dc44_k)"/><line class="edge" x1="400" y1="150" x2="448" y2="110" marker-end="url(#dc44_k)"/><rect class="node" x="450" y="70" width="140" height="56" rx="6"/><text x="520" y="94" font-size="12" text-anchor="middle">Agreement</text><text x="520" y="110" font-size="11" class="a" text-anchor="middle">κ 0.66–0.89</text><line class="edge" x1="590" y1="98" x2="618" y2="98" marker-end="url(#dc44_k)"/><rect class="node" x="620" y="70" width="110" height="56" rx="6"/><text x="675" y="94" font-size="12" text-anchor="middle">Reference</text><text x="675" y="110" font-size="12" text-anchor="middle">labels</text><rect class="node" x="450" y="150" width="280" height="40" rx="6"/><text x="590" y="174" font-size="11" text-anchor="middle">Your 12 scenes: do they read like you?</text><line class="edge dash" x1="675" y1="150" x2="675" y2="128" marker-end="url(#dc44_k)"/><text x="300" y="196" font-size="11" class="m" text-anchor="middle">the gate's own verdicts are never shown to the reviewers</text></svg>

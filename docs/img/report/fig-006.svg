<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">Draft goes through code checks first, then the LLM judge, then the verdict</title><desc id="d">DeepSeek-R1&#x27;s rule applied here: whatever code can check is checked first, exactly and for free. The model is kept for what code can&#x27;t see. The repetition guard already caught a broken fixture that the LLM critic missed.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/><defs><marker id="dc3_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="45" width="100" height="50" rx="6"/><text x="70" y="74" font-size="12" text-anchor="middle">Draft</text><line class="edge" x1="120" y1="70" x2="158" y2="70" marker-end="url(#dc3_k)"/><rect class="node code" x="160" y="35" width="200" height="70" rx="6"/><text x="260" y="58" font-size="12" text-anchor="middle">Code checks</text><text x="260" y="74" font-size="11" class="m" text-anchor="middle">repetition, length, format</text><text x="260" y="90" font-size="11" class="g" text-anchor="middle">exact, free, can't be fooled</text><line class="edge" x1="360" y1="70" x2="398" y2="70" marker-end="url(#dc3_k)"/><text x="379" y="64" font-size="11" class="m" text-anchor="middle">passes</text><rect class="node" x="400" y="35" width="180" height="70" rx="6"/><text x="490" y="58" font-size="12" text-anchor="middle">LLM judge</text><text x="490" y="74" font-size="11" class="m" text-anchor="middle">only what code</text><text x="490" y="90" font-size="11" class="m" text-anchor="middle">can't see</text><line class="edge" x1="580" y1="70" x2="618" y2="70" marker-end="url(#dc3_k)"/><rect class="node" x="620" y="45" width="70" height="50" rx="6"/><text x="655" y="74" font-size="12" text-anchor="middle">Verdict</text><text x="260" y="135" font-size="11" class="g" text-anchor="middle">caught the broken test fixture</text><text x="490" y="135" font-size="11" class="w" text-anchor="middle">the LLM critic missed it</text></svg>

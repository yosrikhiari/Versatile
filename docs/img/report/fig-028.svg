    <rect class="node" x="20" y="95" width="120" height="60" rx="8"/><text x="80" y="122" font-size="13" text-anchor="middle">Scene</text><text x="80" y="140" font-size="11" class="m" text-anchor="middle">draft</text>
    <rect class="node code" x="180" y="20" width="200" height="34" rx="6"/><text x="280" y="42" font-size="11" text-anchor="middle">dialogue lines (≥ 6, else skip)</text>
    <rect class="node code" x="180" y="64" width="200" height="34" rx="6"/><text x="280" y="86" font-size="11" text-anchor="middle">numbered paragraphs</text>
    <rect class="node code" x="180" y="108" width="200" height="34" rx="6"/><text x="280" y="130" font-size="11" text-anchor="middle">bible facts + sentences naming them</text>
    <rect class="node" x="180" y="152" width="200" height="34" rx="6"/><text x="280" y="174" font-size="11" text-anchor="middle">whole scene</text>
    <rect class="node hl" x="420" y="20" width="220" height="34" rx="6"/><text x="530" y="42" font-size="12" text-anchor="middle">voice: 18 / 18 judgeable</text>
    <rect class="node hl" x="420" y="64" width="220" height="34" rx="6"/><text x="530" y="86" font-size="12" text-anchor="middle">pacing: ¶ numbers · 30 / 30</text>
    <rect class="node hl" x="420" y="108" width="220" height="34" rx="6"/><text x="530" y="130" font-size="12" text-anchor="middle">continuity: quotes · 30 / 30</text>
    <rect class="node" x="420" y="152" width="220" height="34" rx="6"/><text x="530" y="174" font-size="12" text-anchor="middle">show-tell, emotional goal</text>
    <rect class="node code" x="680" y="108" width="120" height="34" rx="6"/><text x="740" y="130" font-size="11" text-anchor="middle">code checks quotes</text>
    <rect class="node" x="820" y="80" width="100" height="90" rx="8"/><text x="870" y="112" font-size="12" text-anchor="middle">Verdict</text><text x="870" y="130" font-size="11" class="m" text-anchor="middle">lists every</text><text x="870" y="146" font-size="11" class="m" text-anchor="middle">failing dim</text>

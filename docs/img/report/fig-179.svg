<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">One letter gives keep at 100 percent; reasoning first gives right answers; earlier briefs get copied</title><desc id="d">Two ways a small model goes wrong: forced to answer instantly, and shown its own earlier answers. Reasoning first, and one scene at a time, fixed both.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/><defs><marker id="dc90_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="15" width="200" height="34" rx="6"/><text x="120" y="36" font-size="12" text-anchor="middle">Ask for one letter</text><line class="edge" x1="220" y1="32" x2="268" y2="32" marker-end="url(#dc90_k)"/><rect class="node bad" x="270" y="15" width="200" height="34" rx="6"/><text x="370" y="36" font-size="12" text-anchor="middle">"keep" at 100%</text><text x="485" y="37" font-size="11" class="w">even when it had to change</text><rect class="node" x="20" y="60" width="200" height="34" rx="6"/><text x="120" y="81" font-size="12" text-anchor="middle">Reasoning first</text><line class="edge" x1="220" y1="77" x2="268" y2="77" marker-end="url(#dc90_k)"/><rect class="node hl" x="270" y="60" width="200" height="34" rx="6"/><text x="370" y="81" font-size="12" text-anchor="middle">right answers</text><rect class="node" x="20" y="105" width="200" height="34" rx="6"/><text x="120" y="126" font-size="12" text-anchor="middle">Shown earlier briefs</text><line class="edge" x1="220" y1="122" x2="268" y2="122" marker-end="url(#dc90_k)"/><rect class="node bad" x="270" y="105" width="200" height="34" rx="6"/><text x="370" y="126" font-size="12" text-anchor="middle">copies the first</text><text x="485" y="127" font-size="11" class="a">fix: show only the one scene</text></svg>

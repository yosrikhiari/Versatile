<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 147" width="692" height="147" role="img" aria-labelledby="t d"><title id="t">A passing test gets a precondition assertion to prove the path was exercised</title><desc id="d">Assert that the path under test was reached, not just that the outcome looks right.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="146" rx="10"/><defs><marker id="dc96_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="35" width="150" height="44" rx="6"/><text x="95" y="61" font-size="12" text-anchor="middle">Test passes</text><line class="edge" x1="170" y1="57" x2="218" y2="57" marker-end="url(#dc96_k)"/><rect class="node code" x="220" y="30" width="210" height="54" rx="6"/><text x="325" y="53" font-size="12" text-anchor="middle">Assert preconditions</text><text x="325" y="69" font-size="11" class="m" text-anchor="middle">critic saw ≥ 3 ¶ ?</text><line class="edge" x1="430" y1="57" x2="478" y2="57" marker-end="url(#dc96_k)"/><rect class="node" x="480" y="35" width="160" height="44" rx="6"/><text x="560" y="61" font-size="12" text-anchor="middle">really tested?</text></svg>

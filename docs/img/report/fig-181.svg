<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 712 157" width="712" height="157" role="img" aria-labelledby="t d"><title id="t">phi4 grades its own answer 8 of 10; another model grades it 1 of 10</title><desc id="d">The same empty answer scored 8/10 from its own model and 1/10 from an independent one.</desc><style>

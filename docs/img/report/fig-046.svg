<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 232" width="732" height="232" role="img" aria-labelledby="t d"><title id="t">Five dimension scores against a pass mark of 7; the two below it are both listed in the verdict</title><desc id="d">Every dimension under 7 is listed, lowest first, and the rewrite is told about all of them, instead of one &quot;weakest&quot; picked by list order.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="231" rx="10"/><defs><marker id="dc34_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="20" font-size="12" font-weight="600">Example scores (illustrative)</text><text x="140" y="48" font-size="12" text-anchor="end">continuity</text><rect class="barB" x="150" y="34" width="240" height="18"/><text x="396" y="48" font-size="11">8</text><text x="140" y="76" font-size="12" text-anchor="end">voice</text><rect class="barB" x="150" y="62" width="240" height="18"/><text x="396" y="76" font-size="11">8</text><text x="140" y="104" font-size="12" text-anchor="end">pacing</text><rect class="barB" x="150" y="90" width="210" height="18"/><text x="366" y="104" font-size="11">7</text><text x="140" y="132" font-size="12" text-anchor="end">emotional goal</text><rect class="barA" x="150" y="118" width="180" height="18"/><text x="336" y="132" font-size="11" class="a">6</text><text x="140" y="160" font-size="12" text-anchor="end">show-tell</text><rect class="barA" x="150" y="146" width="150" height="18"/><text x="306" y="160" font-size="11" class="a">5</text><line class="edge w dash" x1="360" y1="28" x2="360" y2="176"/><text x="360" y="192" font-size="11" class="w" text-anchor="middle">pass mark 7</text><line class="edge" x1="440" y1="105" x2="518" y2="105" marker-end="url(#dc34_k)"/><rect class="node hl" x="520" y="70" width="170" height="70" rx="6"/><text x="605" y="93" font-size="12" text-anchor="middle">Verdict</text><text x="605" y="109" font-size="11" class="m" text-anchor="middle">show-tell 5</text><text x="605" y="125" font-size="11" class="m" text-anchor="middle">emotional goal 6</text></svg>

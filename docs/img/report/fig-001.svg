<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 972 392" width="972" height="392" role="img" aria-labelledby="t d"><title id="t">Book-level flow from outline to spines to anchor scenes to middle scenes to audit, and the per-scene loop: context, writer, code guards, one critic call scoring five dimensions, then commit or revise.</title><desc id="d">Green is plain code: exact, free, never wrong about what it checks. Orange is the critic, the one step every decision depends on, and the one that is broken.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="971" height="391" rx="10"/>
    <defs>
      <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
      <marker id="ar1w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker>
    </defs>
    <text x="20" y="22" class="m" font-size="12" font-weight="600" letter-spacing="1">WHOLE BOOK</text>
    <rect class="node" x="20" y="36" width="140" height="48" rx="8"/><text x="90" y="65" font-size="13" text-anchor="middle">Idea + outline</text>
    <rect class="node" x="200" y="36" width="140" height="48" rx="8"/><text x="270" y="65" font-size="13" text-anchor="middle">Chapter spines</text>
    <rect class="node" x="380" y="36" width="190" height="48" rx="8"/><text x="475" y="57" font-size="13" text-anchor="middle">Anchor scenes</text><text x="475" y="74" font-size="11" class="m" text-anchor="middle">first + last of every chapter</text>
    <rect class="node" x="610" y="36" width="140" height="48" rx="8"/><text x="680" y="65" font-size="13" text-anchor="middle">Middle scenes</text>
    <rect class="node" x="790" y="36" width="130" height="48" rx="8"/><text x="855" y="57" font-size="13" text-anchor="middle">Chapter audit</text><text x="855" y="74" font-size="11" class="m" text-anchor="middle">contradiction judge</text>
    <line class="edge" x1="160" y1="60" x2="198" y2="60" marker-end="url(#ar1)"/>
    <line class="edge" x1="340" y1="60" x2="378" y2="60" marker-end="url(#ar1)"/>
    <line class="edge" x1="570" y1="60" x2="608" y2="60" marker-end="url(#ar1)"/>
    <line class="edge" x1="750" y1="60" x2="788" y2="60" marker-end="url(#ar1)"/>

    <path class="edge dash" d="M475 84 V130 M680 84 V130"/>
    <text x="578" y="118" font-size="11" class="m" text-anchor="middle">every scene runs this loop ↓</text>

    <text x="20" y="152" class="m" font-size="12" font-weight="600" letter-spacing="1">ONE SCENE</text>
    <rect class="node" x="20" y="168" width="190" height="70" rx="8"/>
    <text x="115" y="192" font-size="13" text-anchor="middle">Context</text>
    <text x="115" y="210" font-size="11" class="m" text-anchor="middle">past scene summaries (3.8k tok)</text>
    <text x="115" y="226" font-size="11" class="m" text-anchor="middle">+ ESTABLISHED FACTS ledger</text>

    <rect class="node" x="250" y="168" width="130" height="70" rx="8"/>
    <text x="315" y="198" font-size="13" text-anchor="middle">Writer</text><text x="315" y="216" font-size="11" class="m" text-anchor="middle">qwen3:8b, GPU</text>

    <rect class="node code" x="420" y="168" width="150" height="70" rx="8"/>
    <text x="495" y="192" font-size="13" text-anchor="middle">Code guards</text>
    <text x="495" y="210" font-size="11" class="m" text-anchor="middle">repetition, refusal,</text><text x="495" y="226" font-size="11" class="m" text-anchor="middle">empty prose</text>

    <rect class="node bad" x="610" y="168" width="170" height="70" rx="8"/>
    <text x="695" y="192" font-size="13" text-anchor="middle" font-weight="600">Critic</text>
    <text x="695" y="210" font-size="11" text-anchor="middle">ONE call → 5 scores</text>
    <text x="695" y="226" font-size="11" class="w" text-anchor="middle">passes almost everything</text>

    <rect class="node" x="820" y="178" width="100" height="50" rx="8"/><text x="870" y="208" font-size="13" text-anchor="middle">Commit</text>

    <line class="edge" x1="210" y1="203" x2="248" y2="203" marker-end="url(#ar1)"/>
    <line class="edge" x1="380" y1="203" x2="418" y2="203" marker-end="url(#ar1)"/>
    <line class="edge" x1="570" y1="203" x2="608" y2="203" marker-end="url(#ar1)"/>
    <line class="edge" x1="780" y1="203" x2="818" y2="203" marker-end="url(#ar1)"/>
    <text x="799" y="195" font-size="11" class="m" text-anchor="middle">pass</text>
    <path class="edge w" d="M695 238 V290 H315 V240" marker-end="url(#ar1w)"/>
    <text x="505" y="310" font-size="12" class="w" text-anchor="middle">fail → rewrite the whole scene (max 2 attempts)</text>
    <text x="505" y="330" font-size="11" class="m" text-anchor="middle">a failed scene is still saved, marked "review"</text>
  </svg>

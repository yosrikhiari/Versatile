<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 202" width="772" height="202" role="img" aria-labelledby="t d"><title id="t">The critic crashed on continuation briefs and reported it as unparseable output; now it reads both shapes and judges the scene</title><desc id="d">Found while checking the copy fix: all 24 sections of the branch were “accepted unchecked”. The cause was not the model. Continuation scenes use a different brief shape, and the critic crashed on it before asking anything. So the quality gate, and the repair step behind it, had never run on a What If or “continue writing” scene.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="201" rx="10"/>
<defs><marker id="db1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="db2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs>
<rect x="20" y="20" width="190" height="50" rx="4" class="node"/><text x="115" y="42" text-anchor="middle" font-size="11">What If / continue writing</text><text x="115" y="56" text-anchor="middle" font-size="11">brief: goal, characters</text><line x1="210" y1="45" x2="248" y2="45" class="edge" marker-end="url(#db1)"/><rect x="250" y="20" width="200" height="50" rx="4" class="node bad"/><text x="350" y="42" text-anchor="middle" font-size="11">critic reads</text><text x="350" y="56" text-anchor="middle" font-size="11">charactersPresent.join() → throws</text><line x1="450" y1="45" x2="488" y2="45" class="edge w" marker-end="url(#db2)"/><rect x="490" y="20" width="230" height="50" rx="4" class="node bad"/><text x="605" y="42" text-anchor="middle" font-size="11">“output could not be parsed”</text><text x="605" y="56" text-anchor="middle" font-size="11">draft accepted unchecked</text><rect x="20" y="96" width="330" height="50" rx="4" class="node hl"/><text x="185" y="118" text-anchor="middle" font-size="11">now: the brief block reads both shapes</text><text x="185" y="132" text-anchor="middle" font-size="11">and the catch says what it caught</text><rect x="390" y="96" width="330" height="50" rx="4" class="node hl"/><text x="555" y="118" text-anchor="middle" font-size="11">the same chapter: judged in 123 s</text><text x="555" y="132" text-anchor="middle" font-size="11">(failed in 0.0 s before)</text></svg>

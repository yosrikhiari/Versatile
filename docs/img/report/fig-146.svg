<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">Judge plan: steps 3, 6, 8 changed the app, 5 and 7 gave findings, two items open; What If track steps 1 to 4 done plus live fixes</title><desc id="d">Where the plan stood on 27 September. The judge plan has a measured answer for every step, and the What If track has gone from importing a novel to branching it live.</desc><style>

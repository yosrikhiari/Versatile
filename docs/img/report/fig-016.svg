<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 197" width="752" height="197" role="img" aria-labelledby="t d"><title id="t">Plan, several drafts, rerank using criteria generated from the scene brief, keep the best</title><desc id="d">Re3, DOC, Agents&#x27; Room and WritingBench share this shape. Versatile already plans in detail. The missing piece is grading criteria written from each scene&#x27;s own brief instead of a fixed list.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="196" rx="10"/><defs><marker id="dc13_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="dc13_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs><rect class="node hl" x="400" y="15" width="180" height="50" rx="6"/><text x="490" y="36" font-size="12" text-anchor="middle">Criteria from this</text><text x="490" y="52" font-size="12" text-anchor="middle">scene's own brief</text><text x="590" y="45" font-size="11" class="a">missing</text><rect class="node" x="20" y="90" width="170" height="56" rx="6"/><text x="105" y="114" font-size="12" text-anchor="middle">Detailed plan</text><text x="105" y="130" font-size="11" class="g" text-anchor="middle">spine + anchors: have it</text><line class="edge" x1="190" y1="118" x2="228" y2="118" marker-end="url(#dc13_k)"/><rect class="node" x="230" y="90" width="150" height="56" rx="6"/><text x="305" y="114" font-size="12" text-anchor="middle">Several drafts</text><text x="305" y="130" font-size="11" class="m" text-anchor="middle">2–3 per scene</text><line class="edge" x1="380" y1="118" x2="418" y2="118" marker-end="url(#dc13_k)"/><rect class="node" x="420" y="90" width="140" height="56" rx="6"/><text x="490" y="114" font-size="12" text-anchor="middle">Rerank</text><text x="490" y="130" font-size="11" class="m" text-anchor="middle">pick the best</text><line class="edge a" x1="490" y1="65" x2="490" y2="88" marker-end="url(#dc13_a)"/><line class="edge" x1="560" y1="118" x2="598" y2="118" marker-end="url(#dc13_k)"/><rect class="node" x="600" y="95" width="100" height="46" rx="6"/><text x="650" y="122" font-size="12" text-anchor="middle">Keep</text></svg>

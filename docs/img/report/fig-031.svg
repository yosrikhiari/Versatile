<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 197" width="752" height="197" role="img" aria-labelledby="t d"><title id="t">Pacing flags paragraphs, code removes them, then show-tell reads the rest</title><desc id="d">Blame each flaw once. Pacing goes first. If it fails, the paragraphs it named are hidden from show-tell, so the same filler can&#x27;t be counted twice.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="196" rx="10"/><defs><marker id="dc23_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="50" width="100" height="50" rx="6"/><text x="70" y="79" font-size="12" text-anchor="middle">Scene</text><line class="edge" x1="120" y1="75" x2="158" y2="75" marker-end="url(#dc23_k)"/><rect class="node hl" x="160" y="45" width="150" height="60" rx="6"/><text x="235" y="71" font-size="12" text-anchor="middle">① Pacing</text><text x="235" y="87" font-size="11" class="m" text-anchor="middle">flags ¶ 2, 15, 26</text><line class="edge" x1="310" y1="75" x2="348" y2="75" marker-end="url(#dc23_k)"/><text x="329" y="69" font-size="11" class="m" text-anchor="middle">fails</text><rect class="node code" x="350" y="45" width="160" height="60" rx="6"/><text x="430" y="71" font-size="12" text-anchor="middle">remove ¶ 2, 15, 26</text><text x="430" y="87" font-size="11" class="g" text-anchor="middle">plain code</text><line class="edge" x1="510" y1="75" x2="548" y2="75" marker-end="url(#dc23_k)"/><rect class="node" x="550" y="45" width="150" height="60" rx="6"/><text x="625" y="71" font-size="12" text-anchor="middle">② Show-tell</text><text x="625" y="87" font-size="11" class="m" text-anchor="middle">reads the rest</text><text x="360" y="145" font-size="11" class="a" text-anchor="middle">padded scenes where show-tell also failed: 15 of 30 → 0 of 30</text></svg>

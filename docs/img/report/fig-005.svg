<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 932 282" width="932" height="282" role="img" aria-labelledby="t d"><title id="t">The judge sits at the center; four decisions depend on it: whether to rewrite a scene, which of several drafts to keep, whether a change helped, and whether a feature can become default.</title><desc id="d">Four decisions hang off one component. If the judge is blind, all four are guesses. That&#x27;s why the writer experiments came back empty.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="931" height="281" rx="10"/>
    <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
    <rect class="node bad" x="350" y="95" width="200" height="60" rx="10"/>
    <text x="450" y="121" font-size="15" text-anchor="middle" font-weight="600">The judge</text>
    <text x="450" y="141" font-size="11" class="w" text-anchor="middle">can't see most defects</text>
    <rect class="node" x="30" y="30" width="230" height="46" rx="8"/><text x="145" y="58" font-size="13" text-anchor="middle">Rewrite this scene or keep it?</text>
    <rect class="node" x="30" y="174" width="230" height="46" rx="8"/><text x="145" y="202" font-size="13" text-anchor="middle">Which of 3 drafts is best?</text>
    <rect class="node" x="640" y="30" width="230" height="46" rx="8"/><text x="755" y="58" font-size="13" text-anchor="middle">Did my change help? (A/B)</text>
    <rect class="node" x="640" y="174" width="230" height="46" rx="8"/><text x="755" y="202" font-size="13" text-anchor="middle">Safe to turn this on by default?</text>
    <path class="edge" d="M350 110 L262 60" marker-end="url(#ar2)"/>
    <path class="edge" d="M350 140 L262 192" marker-end="url(#ar2)"/>
    <path class="edge" d="M550 110 L638 60" marker-end="url(#ar2)"/>
    <path class="edge" d="M550 140 L638 192" marker-end="url(#ar2)"/>
    <text x="300" y="100" font-size="11" class="m" text-anchor="middle">decides</text>

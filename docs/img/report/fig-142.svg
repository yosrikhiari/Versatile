<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 252" width="772" height="252" role="img" aria-labelledby="t d"><title id="t">Original books at most 12 words shared, generated books mostly 12 or under, one at 190, this branch up to 208</title><desc id="d">A book’s own chapters never share more than 12 words in a row. The generated books mostly don’t either, but one of them has two chapters sharing a 190-word passage, so the main writer copies too, not only What If. The limit (25 words, or 5% of all phrases) flags none of the original pairs.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="251" rx="10"/><text x="20" y="16" font-size="11" class="m">longest shared passage (words); a dot per book or run (the highest pair), per pair on this branch</text><text x="20" y="44" font-size="11">Ethan Frome, 132 chapter pairs</text><circle cx="270" cy="36" r="4" class="barA"/><text x="20" y="74" font-size="11">The Time Machine, 272 pairs</text><circle cx="276" cy="66" r="4" class="barA"/><text x="20" y="104" font-size="11">generated books, 7 runs</text><circle cx="268" cy="96" r="4" class="barB"/><circle cx="272" cy="100" r="4" class="barB"/><circle cx="270" cy="104" r="4" class="barB"/><circle cx="274" cy="96" r="4" class="barB"/><circle cx="276" cy="100" r="4" class="barB"/><circle cx="270" cy="104" r="4" class="barB"/><circle cx="274" cy="96" r="4" class="barB"/><text x="20" y="134" font-size="11">one generated book</text><circle cx="668" cy="126" r="4" class="barB"/><circle cx="325" cy="130" r="4" class="barB"/><text x="20" y="164" font-size="11">this branch, 28 pairs</text><circle cx="703" cy="156" r="4" class="barB"/><circle cx="703" cy="160" r="4" class="barB"/><circle cx="708" cy="164" r="4" class="barB"/><circle cx="386" cy="156" r="4" class="barB"/><circle cx="554" cy="160" r="4" class="barB"/><circle cx="699" cy="164" r="4" class="barB"/><circle cx="422" cy="156" r="4" class="barB"/><circle cx="424" cy="160" r="4" class="barB"/><circle cx="499" cy="164" r="4" class="barB"/><circle cx="584" cy="156" r="4" class="barB"/><circle cx="382" cy="160" r="4" class="barB"/><circle cx="336" cy="164" r="4" class="barB"/><circle cx="340" cy="156" r="4" class="barB"/><circle cx="659" cy="160" r="4" class="barB"/><circle cx="624" cy="164" r="4" class="barB"/><circle cx="448" cy="156" r="4" class="barB"/><circle cx="292" cy="160" r="4" class="barB"/><circle cx="272" cy="164" r="4" class="barB"/><circle cx="272" cy="156" r="4" class="barB"/><circle cx="270" cy="160" r="4" class="barB"/><circle cx="265" cy="164" r="4" class="barB"/><circle cx="263" cy="156" r="4" class="barB"/><circle cx="265" cy="160" r="4" class="barB"/><circle cx="265" cy="164" r="4" class="barB"/><circle cx="265" cy="156" r="4" class="barB"/><circle cx="263" cy="160" r="4" class="barB"/><circle cx="272" cy="164" r="4" class="barB"/><circle cx="265" cy="156" r="4" class="barB"/><line x1="305" y1="26" x2="305" y2="182" class="edge dash"/><text x="309" y="196" font-size="10" class="m">≥ 25 words: flagged</text><text x="250" y="212" font-size="10" class="m" text-anchor="middle">0</text><text x="360" y="212" font-size="10" class="m" text-anchor="middle">50</text><text x="470" y="212" font-size="10" class="m" text-anchor="middle">100</text><text x="580" y="212" font-size="10" class="m" text-anchor="middle">150</text><text x="690" y="212" font-size="10" class="m" text-anchor="middle">200</text></svg>

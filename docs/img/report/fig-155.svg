<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 282" width="772" height="282" role="img" aria-labelledby="t d"><title id="t">Differences between Tailwind 3 and 4 before and after the fixes: cursor 1951 to 0, margins 89 to 0, elements moved by more than 1.5 pixels 402 to 0; border colours 3122 to 16, all equivalent</title><desc id="d">The fixes restored two Tailwind 3 defaults (the grey border, the button cursor) and kept space-y on its Tailwind 3 rule. Tailwind 4 puts the gap on the earlier child and lets a child&#x27;s own margin replace it, which shifted three screens by 3–4 px.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="281" rx="10"/>
<text x="20" y="18" font-size="11" class="m">element-property differences, 12 screens, bars to scale · grey: straight from the upgrade tool · blue: after the fixes</text>
<text x="20" y="52" font-size="11">buttons lost the pointer cursor</text><rect x="300" y="40" width="250" height="13" class="barB"/><text x="556" y="51" font-size="10">1,951</text><text x="300" y="68" font-size="10" class="a">0</text>
<text x="20" y="96" font-size="11">default border colour changed</text><rect x="300" y="84" width="400" height="13" class="barB"/><text x="706" y="95" font-size="10">3,122</text><rect x="300" y="101" width="3" height="13" class="barA"/><text x="308" y="112" font-size="10" class="a">16, all the same colour in a new notation</text>
<text x="20" y="140" font-size="11">space-y margins moved</text><rect x="300" y="128" width="11" height="13" class="barB"/><text x="317" y="139" font-size="10">89</text><text x="300" y="156" font-size="10" class="a">0</text>
<text x="20" y="184" font-size="11">elements moved or resized &gt; 1.5 px</text><rect x="300" y="172" width="52" height="13" class="barB"/><text x="358" y="183" font-size="10">402 (Generator, New project, Story Bible)</text><text x="300" y="200" font-size="10" class="a">0</text>
<line x1="20" y1="214" x2="720" y2="214" class="grid"/>
<text x="20" y="232" font-size="11" class="m">left by design: colours written as oklab (same values) · divider lines drawn from the other side of the gap (same place) · one 150 ms hover curve</text>
</svg>

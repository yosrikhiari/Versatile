<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 192" width="752" height="192" role="img" aria-labelledby="t d"><title id="t">Model-internal features that cannot be copied, versus the wider writer memory that already exists</title><desc id="d">DeepSeek&#x27;s long-context tricks live inside their model, so they can&#x27;t be copied here. The idea behind them, that reading is cheap so read a lot, is already in the writer&#x27;s 3.5× wider memory, which the probe showed costs no extra time.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="191" rx="10"/><rect class="node" x="20" y="20" width="260" height="120" rx="6"/><text x="150" y="52" font-size="12" text-anchor="middle">Inside DeepSeek's model</text><text x="150" y="68" font-size="11" class="m" text-anchor="middle">sparse attention</text><text x="150" y="84" font-size="11" class="m" text-anchor="middle">compressed memory cache</text><text x="150" y="100" font-size="11" class="m" text-anchor="middle">1M-token context</text><text x="150" y="116" font-size="11" class="w" text-anchor="middle">can't be copied to an 8 GB GPU</text><text x="320" y="35" font-size="12" font-weight="600">What we can take: read more</text><text x="380" y="72" font-size="11" text-anchor="end">before</text><rect class="barB" x="390" y="60" width="60" height="16"/><text x="456" y="73" font-size="11">1×</text><text x="380" y="102" font-size="11" text-anchor="end">now</text><rect class="barA" x="390" y="90" width="200" height="16"/><text x="596" y="103" font-size="11" class="a">3.5× (3.8k tokens)</text><text x="320" y="135" font-size="11" class="m">writer's memory of earlier scenes · no extra run time</text></svg>

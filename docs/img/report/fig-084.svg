<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 197" width="752" height="197" role="img" aria-labelledby="t d"><title id="t">Free-form fields gave 7 of 24 legal answers; choosing from a list gave 24 of 24</title><desc id="d">Given free fields, the 3B Editor invented combinations the pipeline can&#x27;t run. Given the list of legal plans to choose from, it was legal every time.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="196" rx="10"/><defs><marker id="dc68_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="200" height="50" rx="6"/><text x="120" y="41" font-size="12" text-anchor="middle">Editor, before</text><text x="120" y="57" font-size="11" class="m" text-anchor="middle">two free-form fields</text><line class="edge" x1="220" y1="45" x2="268" y2="45" marker-end="url(#dc68_k)"/><rect class="node bad" x="270" y="20" width="220" height="50" rx="6"/><text x="380" y="49" font-size="12" text-anchor="middle">gpu: ???   cpu: ???</text><line class="edge" x1="490" y1="45" x2="538" y2="45" marker-end="url(#dc68_k)"/><rect class="node" x="540" y="20" width="160" height="50" rx="6"/><text x="620" y="41" font-size="12" text-anchor="middle">legal answers</text><text x="620" y="57" font-size="11" class="w" text-anchor="middle">7 of 24</text><rect class="node hl" x="20" y="100" width="200" height="50" rx="6"/><text x="120" y="121" font-size="12" text-anchor="middle">Editor, now</text><text x="120" y="137" font-size="11" class="m" text-anchor="middle">given the legal plans</text><line class="edge" x1="220" y1="125" x2="268" y2="125" marker-end="url(#dc68_k)"/><rect class="node" x="270" y="100" width="220" height="50" rx="6"/><text x="380" y="121" font-size="12" text-anchor="middle">picks one plan</text><text x="380" y="137" font-size="10" class="m" text-anchor="middle">"gpu: revise #1 / cpu: critique #2"</text><line class="edge" x1="490" y1="125" x2="538" y2="125" marker-end="url(#dc68_k)"/><rect class="node hl" x="540" y="100" width="160" height="50" rx="6"/><text x="620" y="121" font-size="12" text-anchor="middle">legal answers</text><text x="620" y="137" font-size="11" class="a" text-anchor="middle">24 of 24</text></svg>

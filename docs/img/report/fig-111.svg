<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 270" width="772" height="270" role="img" aria-labelledby="t d"><title id="t">Five failures of the second live run, each paired with the code check that now prevents it</title><desc id="d">The second live run failed in five different ways. Each is now a check in code and a unit test that fails without it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="269" rx="10"/><defs><marker id="uc1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="22" font-size="12" class="w">what went wrong in run 2</text><text x="400" y="22" font-size="12" class="a">code check now</text><rect x="20" y="34" width="340" height="30" rx="4" class="node bad"/><text x="190" y="53" text-anchor="middle" font-size="11">asked about Ethan, quoted “Zeena's absence…”</text><line x1="360" y1="49" x2="398" y2="49" class="edge" marker-end="url(#uc1)"/><rect x="400" y="34" width="320" height="30" rx="4" class="node hl"/><text x="560" y="53" text-anchor="middle" font-size="11">the quote must name the person</text><rect x="20" y="74" width="340" height="30" rx="4" class="node bad"/><text x="190" y="93" text-anchor="middle" font-size="11">“Mattie appeared behind them” = a return</text><line x1="360" y1="89" x2="398" y2="89" class="edge" marker-end="url(#uc1)"/><rect x="400" y="74" width="320" height="30" rx="4" class="node hl"/><text x="560" y="93" text-anchor="middle" font-size="11">a return must say one (returned, came back)</text><rect x="20" y="114" width="340" height="30" rx="4" class="node bad"/><text x="190" y="133" text-anchor="middle" font-size="11">“Zeena waited until he had gone” = Zeena left</text><line x1="360" y1="129" x2="398" y2="129" class="edge" marker-end="url(#uc1)"/><rect x="400" y="114" width="320" height="30" rx="4" class="node hl"/><text x="560" y="133" text-anchor="middle" font-size="11">leaving verb within 3 words of her name</text><rect x="20" y="154" width="340" height="30" rx="4" class="node bad"/><text x="190" y="173" text-anchor="middle" font-size="11">“Zeena's absence left the house” = a leaving</text><line x1="360" y1="169" x2="398" y2="169" class="edge" marker-end="url(#uc1)"/><rect x="400" y="154" width="320" height="30" rx="4" class="node hl"/><text x="560" y="173" text-anchor="middle" font-size="11">an absence or “had left” is not a leaving</text><rect x="20" y="194" width="340" height="30" rx="4" class="node bad"/><text x="190" y="213" text-anchor="middle" font-size="11">one sentence rewritten six times</text><line x1="360" y1="209" x2="398" y2="209" class="edge" marker-end="url(#uc1)"/><rect x="400" y="194" width="320" height="30" rx="4" class="node hl"/><text x="560" y="213" text-anchor="middle" font-size="11">flagged again after repair → needs review</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 202" width="732" height="202" role="img" aria-labelledby="t d"><title id="t">Before: one filler paragraph fails pacing and show-tell; after: only pacing</title><desc id="d">Filler really is flat telling, so one flaw was counted by two judges. Hiding the paragraphs pacing named from show-tell leaves one flaw with one blame.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="201" rx="10"/><defs><marker id="dc35_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="22" font-size="11" class="m" font-weight="600">BEFORE</text><rect class="node" x="20" y="40" width="130" height="44" rx="6"/><text x="85" y="66" font-size="12" text-anchor="middle">filler ¶ 15</text><line class="edge" x1="150" y1="55" x2="208" y2="44" marker-end="url(#dc35_k)"/><line class="edge" x1="150" y1="70" x2="208" y2="78" marker-end="url(#dc35_k)"/><rect class="node" x="210" y="30" width="150" height="28" rx="6"/><text x="285" y="48" font-size="12" text-anchor="middle">pacing fails</text><rect class="node bad" x="210" y="64" width="150" height="28" rx="6"/><text x="285" y="82" font-size="12" text-anchor="middle">show-tell fails</text><text x="375" y="70" font-size="11" class="w">2 blames · 15 of 30 padded scenes</text><text x="20" y="110" font-size="11" class="a" font-weight="600">AFTER</text><rect class="node" x="20" y="118" width="130" height="44" rx="6"/><text x="85" y="144" font-size="12" text-anchor="middle">filler ¶ 15</text><line class="edge" x1="150" y1="140" x2="208" y2="140" marker-end="url(#dc35_k)"/><rect class="node hl" x="210" y="126" width="150" height="28" rx="6"/><text x="285" y="144" font-size="12" text-anchor="middle">pacing fails</text><text x="375" y="145" font-size="11" class="a">1 blame · 0 of 30</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 192" width="732" height="192" role="img" aria-labelledby="t d"><title id="t">Thirty scenes split into odd for choosing thresholds and even for testing them unchanged</title><desc id="d">Tuning and testing never share scenes. A threshold picked on the odd half is frozen, and only its score on the even half is reported, so the number isn&#x27;t graded on its own homework.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="191" rx="10"/><defs><marker id="dc18_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="dc18_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs><rect class="node" x="20" y="55" width="100" height="50" rx="6"/><text x="70" y="84" font-size="12" text-anchor="middle">30 scenes</text><line class="edge" x1="120" y1="70" x2="158" y2="44" marker-end="url(#dc18_k)"/><line class="edge" x1="120" y1="90" x2="158" y2="116" marker-end="url(#dc18_k)"/><rect class="node" x="160" y="22" width="150" height="40" rx="6"/><text x="235" y="46" font-size="12" text-anchor="middle">odd: 1, 3 … 29</text><rect class="node" x="160" y="98" width="150" height="40" rx="6"/><text x="235" y="122" font-size="12" text-anchor="middle">even: 2, 4 … 30</text><line class="edge" x1="310" y1="42" x2="348" y2="42" marker-end="url(#dc18_k)"/><rect class="node" x="350" y="22" width="160" height="40" rx="6"/><text x="430" y="46" font-size="12" text-anchor="middle">choose thresholds</text><line class="edge a" x1="430" y1="62" x2="430" y2="96" marker-end="url(#dc18_a)"/><text x="438" y="84" font-size="11" class="a">frozen</text><line class="edge" x1="310" y1="118" x2="348" y2="118" marker-end="url(#dc18_k)"/><rect class="node hl" x="350" y="98" width="160" height="40" rx="6"/><text x="430" y="122" font-size="12" text-anchor="middle">test, unchanged</text><line class="edge" x1="510" y1="118" x2="548" y2="118" marker-end="url(#dc18_k)"/><rect class="node" x="550" y="98" width="130" height="40" rx="6"/><text x="615" y="122" font-size="12" text-anchor="middle">number reported</text></svg>

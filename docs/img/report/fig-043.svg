<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 502" width="992" height="502" role="img" aria-labelledby="t d"><title id="t">The gate, in order: code checks; pacing labels every paragraph, re-asked in reverse if it would fail; paragraphs pacing failed are hidden from show-tell; show-tell and emotional goal read the scene; voice reads only dialogue; continuity reads facts and the sentences naming bible characters, quotes checked by code and a can-both-be-true question; the verdict lists every failing dimension; if only pacing or continuity failed, repair in place and judge again, else rewrite; finally save.</title><desc id="d">About 5 to 7 short model calls per judgement (the book runs measured 38–40 judge calls for 6 scenes, retries included), each asking one narrow question. Clean scenes skip the confirming passes and the repair entirely. The same steps run in both writing paths (legacy and LangGraph).</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="991" height="501" rx="10"/>
    <defs><marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
    
    <rect class="node" x="20" y="20" width="160" height="50" rx="8"/><text x="100" y="42" font-size="13" text-anchor="middle">Writer's draft</text><text x="100" y="59" font-size="11" class="m" text-anchor="middle">one scene</text>
    <rect class="node code" x="20" y="96" width="160" height="50" rx="8"/><text x="100" y="118" font-size="12" text-anchor="middle">① Code checks</text><text x="100" y="135" font-size="11" class="m" text-anchor="middle">repetition, length, junk</text>
    <line class="edge" x1="100" y1="70" x2="100" y2="94" marker-end="url(#ar9)"/>

    
    <rect class="node hl" x="230" y="20" width="320" height="56" rx="8"/>
    <text x="390" y="40" font-size="12" text-anchor="middle" font-weight="600">② Pacing: label every paragraph</text>
    <text x="390" y="58" font-size="11" class="m" text-anchor="middle">≥ 2 "filler"? re-ask in reverse · fail if confirmed</text>
    <rect class="node code" x="230" y="92" width="320" height="40" rx="8"/>
    <text x="390" y="116" font-size="11" text-anchor="middle">③ hide confirmed filler from show-tell (blame once)</text>
    <rect class="node" x="230" y="148" width="320" height="44" rx="8"/>
    <text x="390" y="168" font-size="12" text-anchor="middle" font-weight="600">④ Show-tell · Emotional goal</text>
    <text x="390" y="184" font-size="11" class="m" text-anchor="middle">still read the (remaining) whole scene</text>
    <rect class="node hl" x="230" y="208" width="320" height="44" rx="8"/>
    <text x="390" y="228" font-size="12" text-anchor="middle" font-weight="600">⑤ Voice: the dialogue lines only</text>
    <text x="390" y="244" font-size="11" class="m" text-anchor="middle">fewer than 6 lines → not judged · repeated lines → fail, no model</text>
    <rect class="node hl" x="230" y="268" width="320" height="56" rx="8"/>
    <text x="390" y="288" font-size="12" text-anchor="middle" font-weight="600">⑥ Continuity: earlier facts + sentences naming them</text>
    <text x="390" y="306" font-size="11" class="m" text-anchor="middle">quote sentence AND fact · code checks both · "can both be true?"</text>
    <path class="edge" d="M180 121 H205 V48 H228" marker-end="url(#ar9)"/>
    <line class="edge" x1="390" y1="76" x2="390" y2="90" marker-end="url(#ar9)"/>
    <line class="edge" x1="390" y1="132" x2="390" y2="146" marker-end="url(#ar9)"/>
    <path class="edge" d="M205 121 V230 H228" marker-end="url(#ar9)"/>
    <path class="edge" d="M205 230 V296 H228" marker-end="url(#ar9)"/>

    
    <rect class="node" x="610" y="130" width="160" height="70" rx="8"/>
    <text x="690" y="154" font-size="12" text-anchor="middle" font-weight="600">⑦ Verdict</text>
    <text x="690" y="172" font-size="11" class="m" text-anchor="middle">lists EVERY dimension</text>
    <text x="690" y="188" font-size="11" class="m" text-anchor="middle">under 7, lowest first</text>
    <path class="edge" d="M550 48 H585 V160 H608" marker-end="url(#ar9)"/>
    <path class="edge" d="M550 170 H608" marker-end="url(#ar9)"/>
    <path class="edge" d="M550 230 H585 V180 H608" marker-end="url(#ar9)"/>
    <path class="edge" d="M550 296 H592 V190 H608" marker-end="url(#ar9)"/>

    
    <rect class="node" x="820" y="40" width="120" height="44" rx="8"/><text x="880" y="67" font-size="12" text-anchor="middle">pass → save</text>
    <rect class="node code" x="610" y="250" width="330" height="56" rx="8"/>
    <text x="775" y="272" font-size="12" text-anchor="middle" font-weight="600">⑧ Only pacing / continuity failed?</text>
    <text x="775" y="290" font-size="11" class="m" text-anchor="middle">cut those ¶ · rewrite that sentence · judge again (②–⑦)</text>
    <rect class="node" x="610" y="340" width="330" height="44" rx="8"/>
    <text x="775" y="367" font-size="12" text-anchor="middle">anything else, or the repair fails → rewrite the scene</text>
    <rect class="node" x="610" y="404" width="330" height="44" rx="8"/>
    <text x="775" y="431" font-size="12" text-anchor="middle">out of tries → keep the best, marked "review"</text>
    <path class="edge" d="M770 150 H800 V62 H818" marker-end="url(#ar9)"/>
    <line class="edge" x1="690" y1="200" x2="690" y2="248" marker-end="url(#ar9)"/>
    <line class="edge" x1="775" y1="306" x2="775" y2="338" marker-end="url(#ar9)"/>
    <line class="edge" x1="775" y1="384" x2="775" y2="402" marker-end="url(#ar9)"/>
    <text x="100" y="330" font-size="11" class="m" text-anchor="middle">green = plain code</text>
    <text x="100" y="346" font-size="11" class="a" text-anchor="middle">blue = judge sees only</text>
    <text x="100" y="362" font-size="11" class="a" text-anchor="middle">its own evidence</text>
  </svg>

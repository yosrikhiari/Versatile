<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">Three real contradictions flagged by reviewers, each scored 8 of 10 by the gate</title><desc id="d">Three real contradictions, all quoted, all flagged by both reviewer groups. The gate scored each one 8/10 for continuity.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="221" rx="10"/><text x="500" y="16" font-size="11" text-anchor="middle" font-weight="600">Reviewers</text><text x="650" y="16" font-size="11" text-anchor="middle" font-weight="600">Gate continuity</text><rect class="node" x="20" y="28" width="400" height="44" rx="6"/><text x="220" y="46" font-size="12" text-anchor="middle">"since the day Halim died"</text><text x="220" y="62" font-size="11" class="m" text-anchor="middle">facts: Halim is alive</text><text x="500" y="55" font-size="11" class="w" text-anchor="middle">contradiction</text><text x="650" y="55" font-size="11" class="m" text-anchor="middle">8 / 10 · pass</text><rect class="node" x="20" y="82" width="400" height="44" rx="6"/><text x="220" y="100" font-size="12" text-anchor="middle">"lying lifeless… the silence of death"</text><text x="220" y="116" font-size="11" class="m" text-anchor="middle">then coughs two paragraphs later</text><text x="500" y="109" font-size="11" class="w" text-anchor="middle">contradiction</text><text x="650" y="109" font-size="11" class="m" text-anchor="middle">8 / 10 · pass</text><rect class="node" x="20" y="136" width="400" height="44" rx="6"/><text x="220" y="154" font-size="12" text-anchor="middle">"closed the laptop"</text><text x="220" y="170" font-size="11" class="m" text-anchor="middle">"…the faint glow of the screen"</text><text x="500" y="163" font-size="11" class="w" text-anchor="middle">contradiction</text><text x="650" y="163" font-size="11" class="m" text-anchor="middle">8 / 10 · pass</text></svg>

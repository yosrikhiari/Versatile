<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 712 182" width="712" height="182" role="img" aria-labelledby="t d"><title id="t">Voice score 7 on one run and 5 on another, on either side of the pass mark</title><desc id="d">What it looked like in 5l: the same dialogue scored on both sides of the pass mark. (Section 5m later found the input wasn&#x27;t really identical: a fix of mine had changed how the lines were split.)</desc><style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 192" width="732" height="192" role="img" aria-labelledby="t d"><title id="t">Clean scene at 7.1 and planted death at 6.9 on a continuity score line</title><desc id="d">Planting &quot;X has been dead two years&quot; moved continuity&#x27;s expected score by about 0.2. That&#x27;s enough to rank the broken scene below the clean one, but no pass mark could sit safely in a gap that small.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="191" rx="10"/><text x="20" y="24" font-size="12" font-weight="600">Continuity, expected score</text><line class="edge" x1="60" y1="90" x2="640" y2="90"/><line class="edge" x1="60" y1="85" x2="60" y2="95"/><text x="60" y="110" font-size="10" class="m" text-anchor="middle">6.0</text><line class="edge" x1="205" y1="85" x2="205" y2="95"/><text x="205" y="110" font-size="10" class="m" text-anchor="middle">6.5</text><line class="edge" x1="350" y1="85" x2="350" y2="95"/><text x="350" y="110" font-size="10" class="m" text-anchor="middle">7.0</text><line class="edge" x1="495" y1="85" x2="495" y2="95"/><text x="495" y="110" font-size="10" class="m" text-anchor="middle">7.5</text><line class="edge" x1="640" y1="85" x2="640" y2="95"/><text x="640" y="110" font-size="10" class="m" text-anchor="middle">8.0</text><circle class="w" cx="321" cy="90" r="6"/><circle class="barB" cx="379" cy="90" r="6"/><text x="300" y="70" font-size="11" class="w" text-anchor="middle">planted death 6.9</text><text x="400" y="50" font-size="11" class="m" text-anchor="middle">clean 7.1</text><line class="edge" x1="321" y1="128" x2="379" y2="128"/><text x="350" y="148" font-size="11" class="m" text-anchor="middle">0.2 apart: enough to rank, too close for a pass mark</text></svg>

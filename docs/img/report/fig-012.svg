<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 197" width="732" height="197" role="img" aria-labelledby="t d"><title id="t">Two drafts asked in both orders; the winner is kept only if both orders agree</title><desc id="d">Pairwise judging is more sensitive than scoring one draft alone, but the position of each draft biases it. Asking in both orders and trusting only agreement removes that bias. Used only to pick between drafts.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="196" rx="10"/><defs><marker id="dc9_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="55" width="120" height="50" rx="6"/><text x="80" y="84" font-size="12" text-anchor="middle">Drafts A, B</text><line class="edge" x1="140" y1="70" x2="188" y2="42" marker-end="url(#dc9_k)"/><line class="edge" x1="140" y1="90" x2="188" y2="118" marker-end="url(#dc9_k)"/><rect class="node" x="190" y="20" width="170" height="40" rx="6"/><text x="275" y="44" font-size="12" text-anchor="middle">Ask: A, then B</text><rect class="node" x="190" y="100" width="170" height="40" rx="6"/><text x="275" y="124" font-size="12" text-anchor="middle">Ask: B, then A</text><line class="edge" x1="360" y1="40" x2="408" y2="70" marker-end="url(#dc9_k)"/><line class="edge" x1="360" y1="120" x2="408" y2="90" marker-end="url(#dc9_k)"/><rect class="node code" x="410" y="55" width="140" height="50" rx="6"/><text x="480" y="76" font-size="12" text-anchor="middle">Same winner?</text><text x="480" y="92" font-size="11" class="g" text-anchor="middle">code compares</text><line class="edge" x1="550" y1="70" x2="588" y2="42" marker-end="url(#dc9_k)"/><text x="560" y="48" font-size="11" class="m" text-anchor="middle">yes</text><rect class="node hl" x="590" y="20" width="100" height="40" rx="6"/><text x="640" y="44" font-size="12" text-anchor="middle">keep it</text><line class="edge" x1="550" y1="90" x2="588" y2="118" marker-end="url(#dc9_k)"/><text x="560" y="122" font-size="11" class="m" text-anchor="middle">no</text><rect class="node" x="590" y="100" width="100" height="40" rx="6"/><text x="640" y="124" font-size="12" text-anchor="middle">tie</text><text x="350" y="158" font-size="11" class="m" text-anchor="middle">the order you show them in biases the answer; both orders cancel it</text></svg>

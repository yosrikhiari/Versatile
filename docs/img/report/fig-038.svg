<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 212" width="752" height="212" role="img" aria-labelledby="t d"><title id="t">A chapter 3 scene is checked only against chapter 1 and 2 facts; flagged pairs then face a can-both-be-true question</title><desc id="d">Two fixes to the chapter audit. Each scene is checked only against facts from earlier chapters, so a later death can&#x27;t make earlier scenes look wrong. Every flagged pair then faces one &quot;can both be true?&quot; question, which removed the last false alarm.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="211" rx="10"/><defs><marker id="dc28_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node hl" x="20" y="20" width="54" height="32" rx="6"/><text x="47" y="40" font-size="12" text-anchor="middle">Ch1</text><rect class="node hl" x="82" y="20" width="54" height="32" rx="6"/><text x="109" y="40" font-size="12" text-anchor="middle">Ch2</text><rect class="node" x="144" y="20" width="54" height="32" rx="6"/><text x="171" y="40" font-size="12" text-anchor="middle">Ch3</text><rect class="node" x="206" y="20" width="54" height="32" rx="6"/><text x="233" y="40" font-size="12" text-anchor="middle">Ch4</text><rect class="node" x="268" y="20" width="54" height="32" rx="6"/><text x="295" y="40" font-size="12" text-anchor="middle">Ch5</text><rect class="node" x="330" y="20" width="54" height="32" rx="6"/><text x="357" y="40" font-size="12" text-anchor="middle">Ch6</text><rect class="node" x="392" y="20" width="54" height="32" rx="6"/><text x="419" y="40" font-size="12" text-anchor="middle">Ch7</text><rect class="node" x="454" y="20" width="54" height="32" rx="6"/><text x="481" y="40" font-size="12" text-anchor="middle">Ch8</text><rect class="node" x="516" y="20" width="54" height="32" rx="6"/><text x="543" y="40" font-size="12" text-anchor="middle">Ch9</text><text x="78" y="68" font-size="11" class="a" text-anchor="middle">facts used</text><text x="171" y="68" font-size="11" text-anchor="middle">being checked</text><text x="543" y="68" font-size="11" class="m" text-anchor="middle">"Halim dies": not used</text><rect class="node" x="20" y="100" width="170" height="56" rx="6"/><text x="105" y="124" font-size="12" text-anchor="middle">Flagged pair</text><text x="105" y="140" font-size="11" class="m" text-anchor="middle">sentence + fact, quoted</text><line class="edge" x1="190" y1="128" x2="228" y2="128" marker-end="url(#dc28_k)"/><rect class="node hl" x="230" y="100" width="200" height="56" rx="6"/><text x="330" y="124" font-size="12" text-anchor="middle">"Can both be true?"</text><text x="330" y="140" font-size="11" class="m" text-anchor="middle">one yes/no question</text><line class="edge" x1="430" y1="118" x2="478" y2="106" marker-end="url(#dc28_k)"/><rect class="node" x="480" y="90" width="220" height="30" rx="6"/><text x="590" y="109" font-size="12" text-anchor="middle">yes → drop the flag</text><line class="edge" x1="430" y1="138" x2="478" y2="150" marker-end="url(#dc28_k)"/><rect class="node bad" x="480" y="136" width="220" height="30" rx="6"/><text x="590" y="155" font-size="12" text-anchor="middle">no → rewrite that scene</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 252" width="752" height="252" role="img" aria-labelledby="t d"><title id="t">JUDGE_MODEL is checked against the contestants; a run exits 1 when nothing completed, a score is a placeholder, or no provider exists</title><desc id="d">Two guards around the benchmark. One flags a judge that is also a contestant. The other turns a run with nothing real in it into a failure, so CI can no longer read &quot;0 of 28&quot; as success.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="251" rx="10"/><defs><marker id="dc2_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node code" x="20" y="20" width="150" height="50" rx="6"/><text x="95" y="41" font-size="12" text-anchor="middle">JUDGE_MODEL</text><text x="95" y="57" font-size="11" class="m" text-anchor="middle">providers.js</text><line class="edge" x1="170" y1="45" x2="208" y2="45" marker-end="url(#dc2_k)"/><rect class="node" x="210" y="20" width="230" height="50" rx="6"/><text x="325" y="41" font-size="12" text-anchor="middle">Judge also under test?</text><text x="325" y="57" font-size="11" class="m" text-anchor="middle">checked against the list</text><line class="edge" x1="440" y1="45" x2="498" y2="45" marker-end="url(#dc2_k)"/><text x="469" y="40" font-size="11" class="m" text-anchor="middle">yes</text><rect class="node bad" x="500" y="20" width="200" height="50" rx="6"/><text x="600" y="41" font-size="12" text-anchor="middle">selfJudged: true</text><text x="600" y="57" font-size="11" class="w" text-anchor="middle">printed warning</text><rect class="node" x="20" y="125" width="150" height="50" rx="6"/><text x="95" y="146" font-size="12" text-anchor="middle">Benchmark run</text><text x="95" y="162" font-size="11" class="m" text-anchor="middle">28 cases</text><line class="edge" x1="170" y1="150" x2="208" y2="150" marker-end="url(#dc2_k)"/><rect class="node code" x="210" y="110" width="230" height="80" rx="6"/><text x="325" y="130" font-size="12" text-anchor="middle">Exit 1 if any of:</text><text x="325" y="146" font-size="11" class="m" text-anchor="middle">0 cases completed</text><text x="325" y="162" font-size="11" class="m" text-anchor="middle">a placeholder score</text><text x="325" y="178" font-size="11" class="m" text-anchor="middle">no provider available</text><line class="edge" x1="440" y1="150" x2="498" y2="150" marker-end="url(#dc2_k)"/><text x="469" y="145" font-size="11" class="m" text-anchor="middle">yes</text><rect class="node hl" x="500" y="125" width="200" height="50" rx="6"/><text x="600" y="146" font-size="12" text-anchor="middle">Run fails loudly</text><text x="600" y="162" font-size="11" class="a" text-anchor="middle">reason printed</text><text x="360" y="212" font-size="11" class="m" text-anchor="middle">placeholder scores are marked judged: false, never counted as 5/10</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 172" width="772" height="172" role="img" aria-labelledby="t d"><title id="t">Generate scenes, freeze rubric, label, re-label 20 a week later, measure consistency</title><desc id="d">The labelling recipe. Freezing the rubric first stops the criteria drifting. Re-labelling 20 scenes later stands in for a second human.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="171" rx="10"/><defs><marker id="dc74_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="30" width="130" height="56" rx="6"/><text x="85" y="54" font-size="12" text-anchor="middle">Generate</text><text x="85" y="70" font-size="11" class="m" text-anchor="middle">~80 scenes</text><line class="edge" x1="150" y1="58" x2="163" y2="58" marker-end="url(#dc74_k)"/><rect class="node hl" x="165" y="30" width="130" height="56" rx="6"/><text x="230" y="54" font-size="12" text-anchor="middle">Freeze</text><text x="230" y="70" font-size="11" class="m" text-anchor="middle">the rubric first</text><line class="edge" x1="295" y1="58" x2="308" y2="58" marker-end="url(#dc74_k)"/><rect class="node" x="310" y="30" width="130" height="56" rx="6"/><text x="375" y="54" font-size="12" text-anchor="middle">Label each</text><text x="375" y="70" font-size="11" class="m" text-anchor="middle">per dimension</text><line class="edge" x1="440" y1="58" x2="453" y2="58" marker-end="url(#dc74_k)"/><rect class="node" x="455" y="30" width="130" height="56" rx="6"/><text x="520" y="54" font-size="12" text-anchor="middle">Re-label 20</text><text x="520" y="70" font-size="11" class="m" text-anchor="middle">a week later</text><line class="edge" x1="585" y1="58" x2="598" y2="58" marker-end="url(#dc74_k)"/><rect class="node hl" x="600" y="30" width="130" height="56" rx="6"/><text x="665" y="54" font-size="12" text-anchor="middle">Consistency</text><text x="665" y="70" font-size="11" class="m" text-anchor="middle">you vs you</text><text x="370" y="120" font-size="11" class="m" text-anchor="middle">the rubric is fixed before labelling, because criteria drift as you grade</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">Dot strip: original chapters between 78 and 100 percent past, present-tense corpus scenes between 0 and 30 percent, nothing between</title><desc id="d">The original chapters of both books are 78% to 100% past; the lowest, “The Sunset of Mankind”, muses in the timeless present. The corpus scenes told in the present are 0% to 30% past; the higher ones remember things (“She had known this moment would come”). Nothing falls between 30% and 78%. Of the 117 other corpus scenes, all read as past.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="221" rx="10"/><text x="20" y="18" font-size="11" class="m">share of past-tense verb forms in the narration, one dot per scene</text><text x="20" y="54" font-size="12">Ethan Frome, all chapters</text><circle cx="685" cy="45" r="4.5" class="barA"/><circle cx="685" cy="50" r="4.5" class="barA"/><circle cx="695" cy="45" r="4.5" class="barA"/><circle cx="700" cy="45" r="4.5" class="barA"/><circle cx="695" cy="50" r="4.5" class="barA"/><circle cx="700" cy="50" r="4.5" class="barA"/><circle cx="700" cy="55" r="4.5" class="barA"/><circle cx="700" cy="45" r="4.5" class="barA"/><circle cx="700" cy="50" r="4.5" class="barA"/><circle cx="695" cy="55" r="4.5" class="barA"/><circle cx="685" cy="55" r="4.5" class="barA"/><circle cx="700" cy="55" r="4.5" class="barA"/><text x="20" y="94" font-size="12">The Time Machine</text><circle cx="690" cy="85" r="4.5" class="barA"/><circle cx="680" cy="85" r="4.5" class="barA"/><circle cx="675" cy="85" r="4.5" class="barA"/><circle cx="660" cy="85" r="4.5" class="barA"/><circle cx="690" cy="90" r="4.5" class="barA"/><circle cx="590" cy="85" r="4.5" class="barA"/><circle cx="675" cy="90" r="4.5" class="barA"/><circle cx="650" cy="85" r="4.5" class="barA"/><circle cx="680" cy="90" r="4.5" class="barA"/><circle cx="680" cy="95" r="4.5" class="barA"/><circle cx="690" cy="95" r="4.5" class="barA"/><circle cx="685" cy="85" r="4.5" class="barA"/><circle cx="640" cy="85" r="4.5" class="barA"/><circle cx="680" cy="85" r="4.5" class="barA"/><circle cx="665" cy="85" r="4.5" class="barA"/><circle cx="685" cy="90" r="4.5" class="barA"/><text x="20" y="134" font-size="12">present-tense corpus scenes</text><circle cx="325" cy="125" r="4.5" class="barB"/><circle cx="260" cy="125" r="4.5" class="barB"/><circle cx="310" cy="125" r="4.5" class="barB"/><circle cx="250" cy="125" r="4.5" class="barB"/><circle cx="315" cy="125" r="4.5" class="barB"/><circle cx="240" cy="125" r="4.5" class="barB"/><circle cx="230" cy="125" r="4.5" class="barB"/><circle cx="200" cy="125" r="4.5" class="barB"/><circle cx="260" cy="130" r="4.5" class="barB"/><circle cx="320" cy="125" r="4.5" class="barB"/><circle cx="240" cy="130" r="4.5" class="barB"/><circle cx="285" cy="125" r="4.5" class="barB"/><circle cx="330" cy="125" r="4.5" class="barB"/><circle cx="350" cy="125" r="4.5" class="barB"/><circle cx="280" cy="125" r="4.5" class="barB"/><circle cx="495" cy="90" r="4.5" class="node dash"/><text x="495" y="76" font-size="10" class="m" text-anchor="middle">Epilogue, 17 verbs: unclear</text><line x1="375" y1="30" x2="375" y2="146" class="edge dash"/><text x="371" y="162" font-size="10" class="m" text-anchor="end">≤ 35% present</text><line x1="575" y1="30" x2="575" y2="146" class="edge dash"/><text x="579" y="162" font-size="10" class="m" text-anchor="start">≥ 75% past</text><text x="200" y="180" font-size="10" class="m" text-anchor="middle">0%</text><text x="325" y="180" font-size="10" class="m" text-anchor="middle">25%</text><text x="450" y="180" font-size="10" class="m" text-anchor="middle">50%</text><text x="575" y="180" font-size="10" class="m" text-anchor="middle">75%</text><text x="700" y="180" font-size="10" class="m" text-anchor="middle">100%</text></svg>

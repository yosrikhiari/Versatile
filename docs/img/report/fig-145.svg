<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 236" width="772" height="236" role="img" aria-labelledby="t d"><title id="t">Repetition flags 7 to 1; longest shared passage 208 to 26 words (13 without the flagged pair); 2,511 copied words removed</title><desc id="d">With the fix, the chapters no longer repeat each other, apart from one 26-word passage that the repetition check flags. But the guard did the work, not the new wording: it removed about as much as the old branch had copied. The model copies what it is shown, however it is labelled.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="235" rx="10"/><text x="20" y="16" font-size="11" class="m">branch 3 (before) against branch 4 (after), same premise, same book</text><text x="20" y="48" font-size="11">repetition flags (of 8 chapters)</text><rect x="330" y="36" width="262" height="14" class="barB"/><text x="598" y="48" font-size="10">7</text><rect x="330" y="53" width="38" height="14" class="barA"/><text x="374" y="65" font-size="10">1</text><text x="20" y="92" font-size="11">longest passage shared by two chapters (words)</text><rect x="330" y="80" width="297" height="14" class="barB"/><text x="633" y="92" font-size="10">208</text><rect x="330" y="97" width="37" height="14" class="barA"/><text x="373" y="109" font-size="10">26</text><text x="20" y="136" font-size="11">… leaving out that one pair</text><rect x="330" y="124" width="297" height="14" class="barB"/><text x="633" y="136" font-size="10">208</text><rect x="330" y="141" width="19" height="14" class="barA"/><text x="355" y="153" font-size="10">13</text><text x="20" y="176" font-size="11" class="m">grey: branch 3 · blue: branch 4 · the original book’s chapters share at most 12 words</text><text x="20" y="194" font-size="11" class="m">the guard removed 158 copied sentences (2,511 words) in 12 of branch 4’s 24 sections; on the books: 0</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 672 182" width="672" height="182" role="img" aria-labelledby="t d"><title id="t">Old fork rewrote all scenes; new fork keeps everything before the chosen scene</title><desc id="d">Old: the whole book was rewritten, whatever scene you chose. New: everything before the chosen scene is kept exactly.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="671" height="181" rx="10"/>
<text x="20" y="30" font-size="12">old branch</text>
<rect x="120" y="15" width="40" height="26" rx="3" class="node bad"/><text x="140" y="33" text-anchor="middle" font-size="10">1</text><rect x="168" y="15" width="40" height="26" rx="3" class="node bad"/><text x="188" y="33" text-anchor="middle" font-size="10">2</text><rect x="216" y="15" width="40" height="26" rx="3" class="node bad"/><text x="236" y="33" text-anchor="middle" font-size="10">3</text><rect x="264" y="15" width="40" height="26" rx="3" class="node bad"/><text x="284" y="33" text-anchor="middle" font-size="10">4</text><rect x="312" y="15" width="40" height="26" rx="3" class="node bad"/><text x="332" y="33" text-anchor="middle" font-size="10">5</text><rect x="360" y="15" width="40" height="26" rx="3" class="node bad"/><text x="380" y="33" text-anchor="middle" font-size="10">6</text><rect x="408" y="15" width="40" height="26" rx="3" class="node bad"/><text x="428" y="33" text-anchor="middle" font-size="10">7</text><rect x="456" y="15" width="40" height="26" rx="3" class="node bad"/><text x="476" y="33" text-anchor="middle" font-size="10">8</text><rect x="504" y="15" width="40" height="26" rx="3" class="node bad"/><text x="524" y="33" text-anchor="middle" font-size="10">9</text><rect x="552" y="15" width="40" height="26" rx="3" class="node bad"/><text x="572" y="33" text-anchor="middle" font-size="10">10</text>

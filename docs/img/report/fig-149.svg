<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 212" width="772" height="212" role="img" aria-labelledby="t d"><title id="t">Labelled real scenes feed the catch rate, false-alarm rate, writer A/B tests and judge training</title><desc id="d">Every later number is measured against step 1&#x27;s labels. If they&#x27;re wrong, everything built on them is wrong too, which is why they come first.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="211" rx="10"/><defs><marker id="dc73_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node hl" x="20" y="60" width="170" height="60" rx="6"/><text x="105" y="86" font-size="12" text-anchor="middle">Step 1: labelled</text><text x="105" y="102" font-size="12" text-anchor="middle">real scenes</text><rect class="node" x="260" y="8" width="220" height="34" rx="6"/><text x="370" y="29" font-size="12" text-anchor="middle">gate catch rate</text><line class="edge" x1="190" y1="90" x2="258" y2="25" marker-end="url(#dc73_k)"/><rect class="node" x="260" y="50" width="220" height="34" rx="6"/><text x="370" y="71" font-size="12" text-anchor="middle">false-alarm rate</text><line class="edge" x1="190" y1="90" x2="258" y2="67" marker-end="url(#dc73_k)"/><rect class="node" x="260" y="92" width="220" height="34" rx="6"/><text x="370" y="113" font-size="12" text-anchor="middle">did a writer change help?</text><line class="edge" x1="190" y1="90" x2="258" y2="109" marker-end="url(#dc73_k)"/><rect class="node" x="260" y="134" width="220" height="34" rx="6"/><text x="370" y="155" font-size="12" text-anchor="middle">data to train a judge</text><line class="edge" x1="190" y1="90" x2="258" y2="151" marker-end="url(#dc73_k)"/><text x="610" y="86" font-size="11" class="m" text-anchor="middle">each is only as good</text><text x="610" y="102" font-size="11" class="m" text-anchor="middle">as the labels</text></svg>

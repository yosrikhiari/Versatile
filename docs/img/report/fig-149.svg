<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">Each draft&#x27;s opening is compared with the 8 nearest written scenes; a match is recorded in the run&#x27;s health ledger and the prose is left alone</title><desc id="d">The check is a warning, like every gate here: it never rewrites. On its first live run it caught both repeats the writer produced, and named them by scene title (an early version said &quot;scene 1&quot;, which in a continued book meant the wrong scene; fixed).</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="221" rx="10"/>
<defs><marker id="ea1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="40" width="130" height="50" rx="4" class="node"/><text x="85" y="62" text-anchor="middle" font-size="11">new draft</text><text x="85" y="78" text-anchor="middle" font-size="11" class="m">its first sentence</text>
<line x1="150" y1="65" x2="188" y2="65" class="edge" marker-end="url(#ea1)"/>
<rect x="190" y="30" width="220" height="70" rx="4" class="node code"/><text x="300" y="54" text-anchor="middle" font-size="11">compare with the openings of</text><text x="300" y="70" text-anchor="middle" font-size="11">the 8 nearest written scenes</text><text x="300" y="86" text-anchor="middle" font-size="11" class="m">either side: middles are written last</text>
<line x1="410" y1="65" x2="448" y2="65" class="edge" marker-end="url(#ea1)"/>
<rect x="450" y="30" width="270" height="70" rx="4" class="node hl"/><text x="585" y="54" text-anchor="middle" font-size="11">match → “opening_reuse” in the run's</text><text x="585" y="70" text-anchor="middle" font-size="11">health ledger, scene and picture named</text><text x="585" y="86" text-anchor="middle" font-size="11" class="a">the prose is not touched</text>
<text x="20" y="130" font-size="11">replayed on the same books, as a run sees them:</text><text x="320" y="130" font-size="11">28 / 70 generated openings flagged</text><text x="560" y="130" font-size="11" class="m">12 / 114 published</text>
<text x="20" y="156" font-size="11">on the first watched run (#68, 2 Oct):</text><text x="320" y="156" font-size="11" class="a">2 flags, both real repeats; the clean scene left alone</text>
<text x="20" y="178" font-size="11" class="m">“Ilse's boots clicked … each step” vs “Ilse's boots crunched … each step” · “Ilse's heel caught …” vs “Ilse's heel caught …”</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">Before: cold LangGraph load inside the first test timer; after: preloaded before the timer starts</title><desc id="d">Schematic. The flaky test wasn&#x27;t slow code: the first group test also paid for loading LangGraph cold, inside its 15-second limit. Loading the module before the tests start moved that cost outside the timer.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/><text x="20" y="50" font-size="11" class="m" font-weight="600">BEFORE</text><rect class="node bad" x="100" y="32" width="330" height="26" rx="6"/><text x="265" y="49" font-size="11" text-anchor="middle">cold-load LangGraph</text><rect class="node" x="430" y="32" width="90" height="26" rx="6"/><text x="475" y="49" font-size="11" text-anchor="middle">test</text><line class="edge w" x1="100" y1="70" x2="460" y2="70"/><line class="edge w dash" x1="460" y1="26" x2="460" y2="76"/><text x="280" y="86" font-size="11" class="w" text-anchor="middle">15 s timer runs out</text><text x="20" y="118" font-size="11" class="a" font-weight="600">AFTER</text><rect class="node code" x="100" y="100" width="190" height="26" rx="6"/><text x="195" y="117" font-size="11" text-anchor="middle">preload LangGraph</text><rect class="node hl" x="300" y="100" width="90" height="26" rx="6"/><text x="345" y="117" font-size="11" text-anchor="middle">test</text><line class="edge a" x1="300" y1="138" x2="660" y2="138"/><text x="480" y="132" font-size="11" class="a" text-anchor="middle">15 s timer: plenty left</text></svg>

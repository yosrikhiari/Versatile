<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 258" width="732" height="258" role="img" aria-labelledby="t d"><title id="t">Loop versus quadtree timings on a log scale</title><desc id="d">Log scale. At a big story&#x27;s size (150 nodes) the plain loop wins, because building the tree costs more than the searches it saves. The tree only pulls ahead in the thousands.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="257" rx="10"/><defs></defs><text x="60" y="24" font-size="12">150 nodes, screen box</text><rect x="60" y="30" width="33" height="12" class="barB"/><text x="99" y="40" font-size="11" class="m">loop 2.4 µs</text><rect x="60" y="46" width="169" height="12" class="barA"/><text x="235" y="56" font-size="11" class="a">tree incl. build 89 µs</text><text x="60" y="86" font-size="12">150 nodes, close pairs</text><rect x="60" y="92" width="164" height="12" class="barB"/><text x="230" y="102" font-size="11" class="m">loop 78 µs</text><rect x="60" y="108" width="209" height="12" class="barA"/><text x="275" y="118" font-size="11" class="a">tree incl. build 259 µs</text><text x="60" y="148" font-size="12">5,000 nodes, close pairs</text><rect x="60" y="154" width="423" height="12" class="barB"/><text x="489" y="164" font-size="11" class="m">loop 76,328 µs</text><rect x="60" y="170" width="375" height="12" class="barA"/><text x="441" y="180" font-size="11" class="a">tree incl. build 21,441 µs</text><line x1="60" y1="14" x2="60" y2="204" class="grid"/><text x="60" y="216" text-anchor="middle" font-size="10" class="m">1 µs</text><line x1="233" y1="14" x2="233" y2="204" class="grid"/><text x="233" y="216" text-anchor="middle" font-size="10" class="m">100 µs</text><line x1="407" y1="14" x2="407" y2="204" class="grid"/><text x="407" y="216" text-anchor="middle" font-size="10" class="m">10 ms</text><line x1="580" y1="14" x2="580" y2="204" class="grid"/><text x="580" y="216" text-anchor="middle" font-size="10" class="m">1 s</text></svg>

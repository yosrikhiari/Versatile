<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 192" width="752" height="192" role="img" aria-labelledby="t d"><title id="t">Alive then and dead now are read by the model as a contradiction, though time has passed</title><desc id="d">A real contradiction needs both statements to hold at the same time. The model ignores the &quot;then&quot; and &quot;now&quot; in Joyce however the question is asked, so the within-scene checker stays unshipped.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="191" rx="10"/><defs><marker id="dc65_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="dc65_w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs><rect class="node" x="20" y="20" width="250" height="44" rx="6"/><text x="145" y="38" font-size="12" text-anchor="middle">"her mother was alive"</text><text x="145" y="54" font-size="11" class="m" text-anchor="middle">then: years ago</text><rect class="node" x="20" y="90" width="250" height="44" rx="6"/><text x="145" y="108" font-size="12" text-anchor="middle">"her mother was dead"</text><text x="145" y="124" font-size="11" class="m" text-anchor="middle">now</text><line class="edge" x1="270" y1="42" x2="338" y2="70" marker-end="url(#dc65_k)"/><line class="edge" x1="270" y1="112" x2="338" y2="90" marker-end="url(#dc65_k)"/><rect class="node" x="340" y="55" width="150" height="50" rx="6"/><text x="415" y="84" font-size="12" text-anchor="middle">Small model</text><line class="edge w" x1="490" y1="70" x2="538" y2="44" marker-end="url(#dc65_w)"/><text x="505" y="48" font-size="11" class="w" text-anchor="end">says</text><rect class="node bad" x="540" y="20" width="170" height="44" rx="6"/><text x="625" y="46" font-size="12" text-anchor="middle">"contradiction"</text><line class="edge dash" x1="490" y1="90" x2="538" y2="112" marker-end="url(#dc65_k)"/><text x="505" y="118" font-size="11" class="m" text-anchor="end">should</text><rect class="node hl" x="540" y="90" width="170" height="44" rx="6"/><text x="625" y="108" font-size="12" text-anchor="middle">time passed</text><text x="625" y="124" font-size="11" class="g" text-anchor="middle">no clash</text></svg>

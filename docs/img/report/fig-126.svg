<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 166" width="772" height="166" role="img" aria-labelledby="t d"><title id="t">Quotes in the single question cause 7 drops; as a one-way second look, 4 correct flips and no drops</title><desc id="d">Shown the quotes in its only question, the 8B model found the same four scenes, but it also turned seven scenes it meant to revise into drops, and a drop deletes a scene. So the quotes are a second look, and it can only move keep to revise.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="165" rx="10"/><text x="330" y="16" font-size="11" class="a">keep → revise</text><text x="520" y="16" font-size="11" class="w">scenes turned into drops</text><text x="20" y="44" font-size="12">quotes in the one question</text><rect x="330" y="26" width="28" height="26" rx="3" class="node hl"/><rect x="364" y="26" width="28" height="26" rx="3" class="node hl"/><rect x="398" y="26" width="28" height="26" rx="3" class="node hl"/><rect x="432" y="26" width="28" height="26" rx="3" class="node hl"/><rect x="520" y="26" width="22" height="26" rx="3" class="node bad"/><rect x="548" y="26" width="22" height="26" rx="3" class="node bad"/><rect x="576" y="26" width="22" height="26" rx="3" class="node bad"/><rect x="604" y="26" width="22" height="26" rx="3" class="node bad"/><rect x="632" y="26" width="22" height="26" rx="3" class="node bad"/><rect x="660" y="26" width="22" height="26" rx="3" class="node bad"/><rect x="688" y="26" width="22" height="26" rx="3" class="node bad"/><text x="20" y="84" font-size="12">quotes as a second look at kept scenes</text><rect x="330" y="66" width="28" height="26" rx="3" class="node hl"/><rect x="364" y="66" width="28" height="26" rx="3" class="node hl"/><rect x="398" y="66" width="28" height="26" rx="3" class="node hl"/><rect x="432" y="66" width="28" height="26" rx="3" class="node hl"/><text x="520" y="84" font-size="11" class="a">none</text><text x="20" y="122" font-size="11" class="m">five trial branches, original text, 32 later scenes, the same scenes asked both ways · all 4 flips right on reading</text></svg>

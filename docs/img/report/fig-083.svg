<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 197" width="732" height="197" role="img" aria-labelledby="t d"><title id="t">Good dialogue scores 7 or 9, flattened dialogue 2, 3, 5 or 7, overlapping around the pass mark</title><desc id="d">Voice scores come in coarse steps, and 5 and 7 are used for both good and flattened dialogue. No margin can separate them, so one borderline scene stays a known small error (2 in 145).</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="196" rx="10"/><line class="edge" x1="60" y1="110" x2="640" y2="110"/><line class="edge" x1="60" y1="106" x2="60" y2="114"/><text x="60" y="128" font-size="10" class="m" text-anchor="middle">1</text><line class="edge" x1="124" y1="106" x2="124" y2="114"/><text x="124" y="128" font-size="10" class="m" text-anchor="middle">2</text><line class="edge" x1="188" y1="106" x2="188" y2="114"/><text x="188" y="128" font-size="10" class="m" text-anchor="middle">3</text><line class="edge" x1="252" y1="106" x2="252" y2="114"/><text x="252" y="128" font-size="10" class="m" text-anchor="middle">4</text><line class="edge" x1="316" y1="106" x2="316" y2="114"/><text x="316" y="128" font-size="10" class="m" text-anchor="middle">5</text><line class="edge" x1="380" y1="106" x2="380" y2="114"/><text x="380" y="128" font-size="10" class="m" text-anchor="middle">6</text><line class="edge" x1="444" y1="106" x2="444" y2="114"/><text x="444" y="128" font-size="10" class="m" text-anchor="middle">7</text><line class="edge" x1="508" y1="106" x2="508" y2="114"/><text x="508" y="128" font-size="10" class="m" text-anchor="middle">8</text><line class="edge" x1="572" y1="106" x2="572" y2="114"/><text x="572" y="128" font-size="10" class="m" text-anchor="middle">9</text><line class="edge" x1="636" y1="106" x2="636" y2="114"/><text x="636" y="128" font-size="10" class="m" text-anchor="middle">10</text><line class="edge w dash" x1="444" y1="30" x2="444" y2="118"/><text x="444" y="24" font-size="11" class="w" text-anchor="middle">pass mark 7</text><circle class="barA" cx="444" cy="62" r="5"/><circle class="barA" cx="572" cy="62" r="5"/><text x="525" y="50" font-size="11" class="a" text-anchor="middle">good dialogue: 7 or 9</text><circle class="w" cx="124" cy="90" r="5"/><circle class="w" cx="188" cy="90" r="5"/><circle class="w" cx="316" cy="90" r="5"/><circle class="w" cx="444" cy="90" r="5"/><text x="250" y="80" font-size="11" class="w" text-anchor="middle">flattened: 2, 3, 5 or 7</text><text x="380" y="155" font-size="11" class="m" text-anchor="middle">the borderline scene: 7 on one run, 5 on another</text></svg>

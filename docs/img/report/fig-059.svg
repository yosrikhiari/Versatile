<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">A sentence states one thing and assumes Halim died; only the stated part was checked</title><desc id="d">The checker tested what a sentence says, not what it takes for granted. &quot;Since the day Halim died&quot; states nothing false; the error is in what it assumes.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="221" rx="10"/><defs><marker id="dc46_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="dc46_w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs><rect class="node" x="20" y="60" width="200" height="60" rx="6"/><text x="120" y="86" font-size="12" text-anchor="middle">"It hadn't been warm</text><text x="120" y="102" font-size="12" text-anchor="middle">since the day Halim died"</text><line class="edge" x1="220" y1="80" x2="268" y2="47" marker-end="url(#dc46_k)"/><line class="edge" x1="220" y1="100" x2="268" y2="133" marker-end="url(#dc46_k)"/><rect class="node" x="270" y="20" width="220" height="50" rx="6"/><text x="380" y="41" font-size="12" text-anchor="middle">States:</text><text x="380" y="57" font-size="11" class="m" text-anchor="middle">"it hadn't been warm"</text><line class="edge" x1="490" y1="45" x2="538" y2="45" marker-end="url(#dc46_k)"/><rect class="node" x="540" y="20" width="180" height="50" rx="6"/><text x="630" y="49" font-size="12" text-anchor="middle">checked: no clash</text><rect class="node bad" x="270" y="110" width="220" height="50" rx="6"/><text x="380" y="131" font-size="12" text-anchor="middle">Assumes:</text><text x="380" y="147" font-size="11" class="w" text-anchor="middle">"Halim died"</text><line class="edge w dash" x1="490" y1="135" x2="538" y2="135" marker-end="url(#dc46_w)"/><rect class="node bad" x="540" y="110" width="180" height="50" rx="6"/><text x="630" y="131" font-size="12" text-anchor="middle">vs fact: Halim is alive</text><text x="630" y="147" font-size="11" class="w" text-anchor="middle">never checked</text><text x="380" y="184" font-size="11" class="a" text-anchor="middle">fix: extract what each sentence states or assumes, then check both</text></svg>

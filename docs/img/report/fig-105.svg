<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 202" width="732" height="202" role="img" aria-labelledby="t d"><title id="t">Daily words as a difference of totals, starting from the imported size</title><desc id="d">The statistics subtract yesterday&#x27;s total from today&#x27;s. For an imported book, &quot;yesterday&quot; is now the size it arrived with, not zero.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="201" rx="10"/>
<defs><marker id="tb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<text x="20" y="24" font-size="12">stored per day: the project's total</text>
<rect x="20" y="36" width="130" height="30" rx="4" class="node"/><text x="85" y="56" text-anchor="middle" font-size="11">import day: 35,000</text>
<rect x="170" y="36" width="130" height="30" rx="4" class="node"/><text x="235" y="56" text-anchor="middle" font-size="11">next day: 35,400</text>
<text x="330" y="56" font-size="11" class="m">words written = total − previous total</text>
<text x="20" y="100" font-size="11" class="w">before</text>
<text x="90" y="100" font-size="11">35,000 − 0 = <tspan class="w">35,000 "written" on import day</tspan>, then 400</text>
<text x="20" y="130" font-size="11" class="a">now</text>
<text x="90" y="130" font-size="11">35,000 − <tspan class="a">35,000 arrived with</tspan> = 0, then 400</text>
<text x="20" y="160" font-size="11" class="m">streak, best day and "this week" all follow from the same subtraction</text></svg>

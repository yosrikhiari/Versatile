<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 228" width="772" height="228" role="img" aria-labelledby="t d"><title id="t">Strings the upgrade tool rewrote as if they were classes, and what each would have broken</title><desc id="d">A test file&#x27;s data changed too (&quot;the ring-3 of power&quot;). None of these would fail a build, and some would pass the tests. They were found by grouping every change the tool made by old and new value, and reading the odd ones in context.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="227" rx="10"/>
<text x="20" y="18" font-size="11" class="m">rewritten by the tool</text><text x="400" y="18" font-size="11" class="m">what it would have broken</text>
<rect x="20" y="28" width="360" height="26" rx="3" class="node bad"/><text x="30" y="45" font-size="11">Spark store type 'outline' → 'outline-solid'</text><text x="400" y="45" font-size="11">outline generation</text>
<rect x="20" y="60" width="360" height="26" rx="3" class="node bad"/><text x="30" y="77" font-size="11">status shape 'ring' → 'ring-3'</text><text x="400" y="77" font-size="11">the status dot's ring shape</text>
<rect x="20" y="92" width="360" height="26" rx="3" class="node bad"/><text x="30" y="109" font-size="11">panel id and button variant 'outline'</text><text x="400" y="109" font-size="11">the Outline panel, a button style</text>
<rect x="20" y="124" width="360" height="26" rx="3" class="node bad"/><text x="30" y="141" font-size="11">word lists: 'shadow' → 'shadow-sm'</text><text x="400" y="141" font-size="11">the heuristic analyser's matching</text>
<rect x="20" y="156" width="360" height="26" rx="3" class="node bad"/><text x="30" y="173" font-size="11">copy: "the model returned no outline-solid"</text><text x="400" y="173" font-size="11">what the writer reads</text>
</svg>

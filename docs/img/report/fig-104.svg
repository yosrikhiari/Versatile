<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 182" width="732" height="182" role="img" aria-labelledby="t d"><title id="t">Check pass with a growing list of facts</title><desc id="d">Before, only kept scenes were checked, and only against the change. Now every scene after the change is checked, in order, against the change plus the facts the rewritten scenes before it established.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="181" rx="10"/>
<defs><marker id="sb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="100" height="32" rx="4" class="node hl"/><text x="70" y="40" text-anchor="middle" font-size="11">IV (change)</text><rect x="132" y="20" width="100" height="32" rx="4" class="node hl"/><text x="182" y="40" text-anchor="middle" font-size="11">V</text><rect x="244" y="20" width="100" height="32" rx="4" class="node hl"/><text x="294" y="40" text-anchor="middle" font-size="11">VI</text><rect x="356" y="20" width="100" height="32" rx="4" class="node hl"/><text x="406" y="40" text-anchor="middle" font-size="11">VIII</text><rect x="468" y="20" width="100" height="32" rx="4" class="node "/><text x="518" y="40" text-anchor="middle" font-size="11">IX·3 kept</text>
<line x1="120" y1="36" x2="130" y2="36" class="edge" marker-end="url(#sb4)"/><line x1="232" y1="36" x2="242" y2="36" class="edge" marker-end="url(#sb4)"/><line x1="344" y1="36" x2="354" y2="36" class="edge" marker-end="url(#sb4)"/><line x1="456" y1="36" x2="466" y2="36" class="edge" marker-end="url(#sb4)"/>
<rect x="20" y="80" width="100" height="24" rx="3" class="node code"/><text x="70" y="96" text-anchor="middle" font-size="10">the change</text>
<rect x="132" y="80" width="212" height="24" rx="3" class="node code"/><text x="238" y="96" text-anchor="middle" font-size="10">+ facts of IV, V</text>
<rect x="356" y="80" width="324" height="24" rx="3" class="node code"/><text x="518" y="96" text-anchor="middle" font-size="10">+ facts of VI, VIII … (grows along the book)</text>
<text x="20" y="135" font-size="11" class="m">each scene is checked against everything the new version has already said, then contradicting sentences are repaired</text></svg>

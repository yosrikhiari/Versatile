<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 222" width="752" height="222" role="img" aria-labelledby="t d"><title id="t">Scene split into about 40 facts, each checked alone by MiniCheck, which finds the one wrong fact</title><desc id="d">FActScore and MiniCheck: split text into single facts and check each one alone. One wrong fact among 40 is easy to spot on its own and easy to miss in one big question.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="221" rx="10"/><defs><marker id="dc12_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="55" width="120" height="60" rx="6"/><text x="80" y="81" font-size="12" text-anchor="middle">Scene text</text><text x="80" y="97" font-size="11" class="m" text-anchor="middle">~40 facts</text><rect class="node" x="180" y="20" width="180" height="26" rx="6"/><text x="270" y="37" font-size="12" text-anchor="middle">fact 1  ✓</text><line class="edge" x1="140" y1="85" x2="178" y2="33" marker-end="url(#dc12_k)"/><line class="edge" x1="360" y1="33" x2="418" y2="70" marker-end="url(#dc12_k)"/><rect class="node" x="180" y="52" width="180" height="26" rx="6"/><text x="270" y="69" font-size="12" text-anchor="middle">fact 2  ✓</text><line class="edge" x1="140" y1="85" x2="178" y2="65" marker-end="url(#dc12_k)"/><line class="edge" x1="360" y1="65" x2="418" y2="80" marker-end="url(#dc12_k)"/><rect class="node bad" x="180" y="84" width="180" height="26" rx="6"/><text x="270" y="101" font-size="12" text-anchor="middle">fact 17  ✗</text><line class="edge" x1="140" y1="85" x2="178" y2="97" marker-end="url(#dc12_k)"/><line class="edge" x1="360" y1="97" x2="418" y2="90" marker-end="url(#dc12_k)"/><rect class="node" x="180" y="116" width="180" height="26" rx="6"/><text x="270" y="133" font-size="12" text-anchor="middle">… fact 40</text><line class="edge" x1="140" y1="85" x2="178" y2="129" marker-end="url(#dc12_k)"/><line class="edge" x1="360" y1="129" x2="418" y2="100" marker-end="url(#dc12_k)"/><rect class="node hl" x="420" y="50" width="160" height="70" rx="6"/><text x="500" y="73" font-size="12" text-anchor="middle">MiniCheck 7B</text><text x="500" y="89" font-size="11" class="m" text-anchor="middle">checks one fact</text><text x="500" y="105" font-size="11" class="m" text-anchor="middle">against the evidence</text><line class="edge" x1="580" y1="85" x2="618" y2="85" marker-end="url(#dc12_k)"/><rect class="node bad" x="620" y="60" width="90" height="50" rx="6"/><text x="665" y="81" font-size="12" text-anchor="middle">fact 17</text><text x="665" y="97" font-size="11" class="w" text-anchor="middle">is wrong</text><text x="360" y="175" font-size="11" class="w" text-anchor="middle">one big call over all 40 facts tends to miss the single wrong one</text></svg>

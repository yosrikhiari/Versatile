<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">Fresh branch: kept chapters contradict the change; flags now point at the kept scene</title><desc id="d">A fresh branch, never seen by the rule: no habit or memory false alarms. Its three flags found a real conflict, but in the planner’s kept chapters, not the rewritten ones. The flag now names the kept chapter as the one to fix.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="221" rx="10"/>
<defs><marker id="xb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="xb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs>
<rect x="20" y="20" width="150" height="46" rx="4" class="node hl"/><text x="95" y="40" text-anchor="middle" font-size="11">Explanation</text><text x="95" y="54" text-anchor="middle" font-size="11">rewritten: Weena stays</text><rect x="190" y="20" width="160" height="46" rx="4" class="node bad"/><text x="270" y="40" text-anchor="middle" font-size="11">The Morlocks · KEPT</text><text x="270" y="54" text-anchor="middle" font-size="11">“Little Weena ran with me”</text><rect x="370" y="20" width="170" height="46" rx="4" class="node bad"/><text x="455" y="40" text-anchor="middle" font-size="11">Palace · KEPT</text><text x="455" y="54" text-anchor="middle" font-size="11">“Weena came close to my side”</text><rect x="560" y="20" width="160" height="46" rx="4" class="node hl"/><text x="640" y="40" text-anchor="middle" font-size="11">In the Darkness</text><text x="640" y="54" text-anchor="middle" font-size="11">rewritten: “Weena’s absence…”</text><line x1="540" y1="43" x2="558" y2="43" class="edge w" marker-end="url(#xb2)"/>
<text x="20" y="96" font-size="11" class="w">before: flag on In the Darkness, the side that follows the change; a rewrite would force Weena back in</text>
<rect x="20" y="112" width="700" height="46" rx="4" class="node code"/><text x="370" y="132" text-anchor="middle" font-size="11">now: the sighting came from a KEPT scene → the flag says “the Palace of Green Porcelain is the scene to rewrite</text><text x="370" y="146" text-anchor="middle" font-size="11">if the change means Weena is gone”, and it is never a rule for rewriting In the Darkness</text>
<text x="20" y="180" font-size="11" class="m">on every flag so far: 5 real flags → last seen in rewritten scenes (unchanged) · this branch’s 3 → last seen in kept ones</text></svg>

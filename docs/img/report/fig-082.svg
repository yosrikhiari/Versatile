<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 207" width="772" height="207" role="img" aria-labelledby="t d"><title id="t">A wrong drop on continuity or voice rewrites the scene; on a warning dimension it only misleads</title><desc id="d">Wrong blame costs different amounts depending on where it lands. On a gate dimension it triggers a needless rewrite. On a warning-only one it only misleads.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="206" rx="10"/><defs><marker id="dc66_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="dc66_w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs><rect class="node" x="20" y="65" width="140" height="50" rx="6"/><text x="90" y="86" font-size="12" text-anchor="middle">Planted flaw</text><text x="90" y="102" font-size="11" class="m" text-anchor="middle">drops a score</text><line class="edge" x1="160" y1="80" x2="218" y2="47" marker-end="url(#dc66_k)"/><line class="edge" x1="160" y1="100" x2="218" y2="133" marker-end="url(#dc66_k)"/><rect class="node" x="220" y="20" width="200" height="50" rx="6"/><text x="320" y="41" font-size="12" text-anchor="middle">Continuity or voice</text><text x="320" y="57" font-size="11" class="m" text-anchor="middle">can fail a scene</text><rect class="node" x="220" y="110" width="200" height="50" rx="6"/><text x="320" y="131" font-size="12" text-anchor="middle">Show-tell, pacing,</text><text x="320" y="147" font-size="11" class="m" text-anchor="middle">emotional goal: warn</text><line class="edge w" x1="420" y1="45" x2="468" y2="45" marker-end="url(#dc66_w)"/><rect class="node bad" x="470" y="20" width="250" height="50" rx="6"/><text x="595" y="41" font-size="12" text-anchor="middle">wrong fail</text><text x="595" y="57" font-size="11" class="w" text-anchor="middle">scene rewritten for no reason</text><line class="edge" x1="420" y1="135" x2="468" y2="135" marker-end="url(#dc66_k)"/><rect class="node" x="470" y="110" width="250" height="50" rx="6"/><text x="595" y="131" font-size="12" text-anchor="middle">wrong warning</text><text x="595" y="147" font-size="11" class="m" text-anchor="middle">author misled, nothing rewritten</text></svg>

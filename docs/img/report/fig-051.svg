<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 202" width="772" height="202" role="img" aria-labelledby="t d"><title id="t">Delete emotion-naming sentences, ask a multiple-choice question about what the reader feels</title><desc id="d">Emotional goal as a reader&#x27;s question. With the sentences that name feelings removed, if the model can still pick the intended feeling, the scene delivers it. If not, only the named emotions carried it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="201" rx="10"/><defs><marker id="dc39_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="60" width="100" height="50" rx="6"/><text x="70" y="89" font-size="12" text-anchor="middle">Scene</text><line class="edge" x1="120" y1="85" x2="158" y2="85" marker-end="url(#dc39_k)"/><rect class="node code" x="160" y="55" width="170" height="60" rx="6"/><text x="245" y="81" font-size="12" text-anchor="middle">Delete sentences</text><text x="245" y="97" font-size="11" class="m" text-anchor="middle">that name emotions</text><line class="edge" x1="330" y1="85" x2="368" y2="85" marker-end="url(#dc39_k)"/><rect class="node hl" x="370" y="40" width="190" height="90" rx="6"/><text x="465" y="65" font-size="12" text-anchor="middle">"What does the reader</text><text x="465" y="81" font-size="12" text-anchor="middle">feel at the end?"</text><text x="465" y="97" font-size="11" class="m" text-anchor="middle">A · B · C · D</text><text x="465" y="113" font-size="11" class="m" text-anchor="middle">(goal + 3 others)</text><line class="edge" x1="560" y1="70" x2="598" y2="47" marker-end="url(#dc39_k)"/><rect class="node" x="600" y="20" width="125" height="50" rx="6"/><text x="662.5" y="41" font-size="12" text-anchor="middle">picks the goal</text><text x="662.5" y="57" font-size="11" class="g" text-anchor="middle">delivered</text><line class="edge" x1="560" y1="100" x2="598" y2="123" marker-end="url(#dc39_k)"/><rect class="node bad" x="600" y="100" width="125" height="50" rx="6"/><text x="662.5" y="121" font-size="12" text-anchor="middle">misses it</text><text x="662.5" y="137" font-size="11" class="w" text-anchor="middle">it only told</text></svg>

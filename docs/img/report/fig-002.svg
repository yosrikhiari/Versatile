<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 952 282" width="952" height="282" role="img" aria-labelledby="t d"><title id="t">Before: phi4-mini writes the answer and phi4-mini grades it. After: phi4-mini writes, qwen3:8b grades, and the run fails loudly if nothing completed or a grade is a placeholder.</title><desc id="d">The grading fallback read the same setting as the model under test, so without cloud keys a model always graded itself. The exit code ignored errors completely.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="951" height="281" rx="10"/>
    <defs><marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
    <text x="20" y="24" class="m" font-size="12" font-weight="600" letter-spacing="1">BEFORE</text>
    <rect class="node" x="20" y="38" width="160" height="50" rx="8"/><text x="100" y="68" font-size="13" text-anchor="middle">Task prompt</text>
    <rect class="node bad" x="240" y="38" width="190" height="50" rx="8"/><text x="335" y="60" font-size="13" text-anchor="middle">phi4-mini answers</text><text x="335" y="77" font-size="11" class="m" text-anchor="middle">OLLAMA_MODEL</text>
    <rect class="node bad" x="490" y="38" width="190" height="50" rx="8"/><text x="585" y="60" font-size="13" text-anchor="middle">phi4-mini grades it</text><text x="585" y="77" font-size="11" class="w" text-anchor="middle">same env var, same model</text>
    <rect class="node" x="740" y="38" width="160" height="50" rx="8"/><text x="820" y="60" font-size="13" text-anchor="middle">exit 0</text><text x="820" y="77" font-size="11" class="w" text-anchor="middle">even at 0 / 28</text>
    <line class="edge" x1="180" y1="63" x2="238" y2="63" marker-end="url(#ar4)"/>
    <line class="edge" x1="430" y1="63" x2="488" y2="63" marker-end="url(#ar4)"/>
    <line class="edge" x1="680" y1="63" x2="738" y2="63" marker-end="url(#ar4)"/>

    <line class="grid" x1="20" y1="118" x2="900" y2="118"/>

    <text x="20" y="146" class="a" font-size="12" font-weight="600" letter-spacing="1">AFTER</text>
    <rect class="node" x="20" y="160" width="160" height="50" rx="8"/><text x="100" y="190" font-size="13" text-anchor="middle">Task prompt</text>
    <rect class="node" x="240" y="160" width="190" height="50" rx="8"/><text x="335" y="182" font-size="13" text-anchor="middle">phi4-mini answers</text><text x="335" y="199" font-size="11" class="m" text-anchor="middle">OLLAMA_MODEL</text>
    <rect class="node hl" x="490" y="160" width="190" height="50" rx="8"/><text x="585" y="182" font-size="13" text-anchor="middle">qwen3:8b grades it</text><text x="585" y="199" font-size="11" class="a" text-anchor="middle">JUDGE_MODEL · warns if a contestant</text>
    <rect class="node hl" x="740" y="160" width="160" height="50" rx="8"/><text x="820" y="182" font-size="13" text-anchor="middle">exit 1 if</text><text x="820" y="199" font-size="11" class="a" text-anchor="middle">0 done or fake grades</text>
    <line class="edge" x1="180" y1="185" x2="238" y2="185" marker-end="url(#ar4)"/>
    <line class="edge" x1="430" y1="185" x2="488" y2="185" marker-end="url(#ar4)"/>
    <line class="edge" x1="680" y1="185" x2="738" y2="185" marker-end="url(#ar4)"/>
    <text x="460" y="238" font-size="11" class="m" text-anchor="middle">the answering side is unchanged: only who grades, and what "success" means, moved</text>
  </svg>

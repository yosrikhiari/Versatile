<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 282" width="772" height="282" role="img" aria-labelledby="t d"><title id="t">Rewrite flow: flagged scene, brief with a MUST HOLD rule, the writer, a single-scene check, and undo</title><desc id="d">One click writes the scene again, knowing the missing event never happened, then checks only that scene. Nothing else in the branch is touched, and the old text can be put back.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="281" rx="10"/>
<defs><marker id="va1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="va2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
<rect x="20" y="20" width="150" height="46" rx="4" class="node bad"/><text x="95" y="40" text-anchor="middle" font-size="11">flagged scene</text><text x="95" y="54" text-anchor="middle" font-size="11">(VIII: Zeena “gone”)</text><line x1="170" y1="43" x2="208" y2="43" class="edge" marker-end="url(#va1)"/><rect x="210" y="14" width="250" height="58" rx="4" class="node hl"/><text x="335" y="32" text-anchor="middle" font-size="11">brief = what the scene is for</text><text x="335" y="47" text-anchor="middle" font-size="11">+ MUST HOLD: Zeena is still at</text><text x="335" y="62" text-anchor="middle" font-size="11">the kitchen door, never left</text><line x1="460" y1="43" x2="498" y2="43" class="edge" marker-end="url(#va1)"/><rect x="500" y="20" width="220" height="46" rx="4" class="node"/><text x="610" y="40" text-anchor="middle" font-size="11">the branch’s writer</text><text x="610" y="54" text-anchor="middle" font-size="11">same canon, same length</text><line x1="610" y1="66" x2="610" y2="104" class="edge" marker-end="url(#va1)"/><rect x="420" y="106" width="300" height="58" rx="4" class="node code"/><text x="570" y="124" text-anchor="middle" font-size="11">check THIS scene only:</text><text x="570" y="139" text-anchor="middle" font-size="11">facts before it from their digests,</text><text x="570" y="154" text-anchor="middle" font-size="11">each person from where last seen</text><line x1="420" y1="135" x2="352" y2="135" class="edge a" marker-end="url(#va2)"/><rect x="150" y="112" width="200" height="46" rx="4" class="node hl"/><text x="250" y="132" text-anchor="middle" font-size="11">passes → “rewritten”</text><text x="250" y="146" text-anchor="middle" font-size="11">still flagged → review</text><rect x="20" y="190" width="330" height="40" rx="4" class="node dash"/><text x="185" y="214" text-anchor="middle" font-size="11">old text kept → “Undo rewrite”</text><rect x="390" y="190" width="330" height="40" rx="4" class="node dash"/><text x="555" y="214" text-anchor="middle" font-size="11">writer returns nothing → old text back</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 232" width="692" height="232" role="img" aria-labelledby="t d"><title id="t">Quality of the kept draft rises with more drafts for a strong checker but flattens at a ceiling for a weak one</title><desc id="d">Schematic of the Inference Scaling fLaws result. If the checker sometimes approves bad drafts, writing more drafts stops helping at a ceiling set by the checker. That&#x27;s why N stays at 2–3 until the judge is fixed.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="231" rx="10"/><line class="edge" x1="60" y1="30" x2="60" y2="170"/><line class="edge" x1="60" y1="170" x2="620" y2="170"/><line class="grid" x1="180" y1="30" x2="180" y2="170"/><path class="edge a" d="M60 160 C 200 100, 400 55, 610 42"/><path class="edge w" d="M60 160 C 150 118, 250 104, 610 100"/><line class="edge w dash" x1="60" y1="98" x2="610" y2="98"/><text x="66" y="22" font-size="11" class="m">quality of the draft kept</text><text x="610" y="34" font-size="11" class="a" text-anchor="end">checker that never approves bad drafts</text><text x="610" y="120" font-size="11" class="w" text-anchor="end">weak checker: stuck at its ceiling</text><text x="180" y="186" font-size="11" class="m" text-anchor="middle">N = 2–3</text><text x="620" y="186" font-size="11" class="m" text-anchor="end">more drafts →</text></svg>

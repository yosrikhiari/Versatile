<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 262" width="772" height="262" role="img" aria-labelledby="t d"><title id="t">Proposed steps mapped to what was built, plus input isolation which was not planned</title><desc id="d">The day-one plan against what was built. Most pieces landed. The surprise was that controlling what each judge reads mattered more than reading its probabilities.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="261" rx="10"/><defs><marker id="dc69_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="130" y="20" font-size="12" text-anchor="middle" font-weight="600">Proposed (day one)</text><text x="570" y="20" font-size="12" text-anchor="middle" font-weight="600">What happened</text><rect class="node" x="20" y="32" width="220" height="30" rx="6"/><text x="130" y="51" font-size="12" text-anchor="middle">① Code checks</text><line class="edge" x1="240" y1="47" x2="418" y2="47" marker-end="url(#dc69_k)"/><rect class="node code" x="420" y="32" width="300" height="30" rx="6"/><text x="570" y="51" font-size="12" text-anchor="middle">built, and grew</text><rect class="node" x="20" y="70" width="220" height="30" rx="6"/><text x="130" y="89" font-size="12" text-anchor="middle">② Read the probabilities</text><line class="edge" x1="240" y1="85" x2="418" y2="85" marker-end="url(#dc69_k)"/><rect class="node" x="420" y="70" width="300" height="30" rx="6"/><text x="570" y="89" font-size="12" text-anchor="middle">used for yes/no confirmers</text><rect class="node" x="20" y="108" width="220" height="30" rx="6"/><text x="130" y="127" font-size="12" text-anchor="middle">③ Quote check</text><line class="edge" x1="240" y1="123" x2="418" y2="123" marker-end="url(#dc69_k)"/><rect class="node hl" x="420" y="108" width="300" height="30" rx="6"/><text x="570" y="127" font-size="12" text-anchor="middle">built: code verifies quotes</text><rect class="node" x="20" y="146" width="220" height="30" rx="6"/><text x="130" y="165" font-size="12" text-anchor="middle">④ Claim check</text><line class="edge" x1="240" y1="161" x2="418" y2="161" marker-end="url(#dc69_k)"/><rect class="node hl" x="420" y="146" width="300" height="30" rx="6"/><text x="570" y="165" font-size="12" text-anchor="middle">built: states and assumptions</text><rect class="node" x="20" y="184" width="220" height="30" rx="6"/><text x="130" y="203" font-size="12" class="m" text-anchor="middle">(not planned)</text><line class="edge" x1="240" y1="199" x2="418" y2="199" marker-end="url(#dc69_k)"/><rect class="node hl" x="420" y="184" width="300" height="30" rx="6"/><text x="570" y="203" font-size="12" text-anchor="middle">input isolation: the biggest win</text></svg>

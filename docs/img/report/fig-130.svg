<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 222" width="772" height="222" role="img" aria-labelledby="t d"><title id="t">Narrative person measured by code: speech removed, first-person pronouns per 1,000 words, compared with the scene&#x27;s own original</title><desc id="d">Plain code, no model call. The rewrite of a scene is compared with that scene&#x27;s original, never with the book as a whole.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="221" rx="10"/>
<defs><marker id="pa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="220" height="58" rx="4" class="node"/><text x="130" y="38" text-anchor="middle" font-size="11">a scene</text><text x="130" y="53" text-anchor="middle" font-size="11">narration + “quoted speech”</text><text x="130" y="68" text-anchor="middle" font-size="11">(“I am here,” she said)</text><line x1="240" y1="49" x2="278" y2="49" class="edge" marker-end="url(#pa1)"/><rect x="280" y="20" width="180" height="58" rx="4" class="node code"/><text x="370" y="38" text-anchor="middle" font-size="11">remove quoted speech</text><text x="370" y="53" text-anchor="middle" font-size="11">(a third-person scene is</text><text x="370" y="68" text-anchor="middle" font-size="11">full of “I” in dialogue)</text><line x1="460" y1="49" x2="498" y2="49" class="edge" marker-end="url(#pa1)"/><rect x="500" y="20" width="220" height="58" rx="4" class="node code"/><text x="610" y="46" text-anchor="middle" font-size="11">count I · me · my · we · us · our</text><text x="610" y="60" text-anchor="middle" font-size="11">per 1,000 words of narration</text><rect x="20" y="110" width="220" height="46" rx="4" class="node hl"/><text x="130" y="137" text-anchor="middle" font-size="11">≥ 10 → first person</text><rect x="260" y="110" width="220" height="46" rx="4" class="node hl"/><text x="370" y="137" text-anchor="middle" font-size="11">≤ 2 → third person</text><rect x="500" y="110" width="220" height="46" rx="4" class="node dash"/><text x="610" y="130" text-anchor="middle" font-size="11">between, or < 150 words</text><text x="610" y="144" text-anchor="middle" font-size="11">→ unclear, never flagged</text>
<text x="20" y="182" font-size="11" class="m">compared with the scene's OWN original: Ethan Frome has a first-person frame around third-person chapters</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 182" width="772" height="182" role="img" aria-labelledby="t d"><title id="t">Fixed pass mark 7 replaced by per-dimension pass marks chosen on half the labels and tested on the rest</title><desc id="d">Step 4 also replaces the fixed 7 with a pass mark per dimension, chosen on half of the labelled scenes and checked on the other half.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="181" rx="10"/><defs><marker id="dc77_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node bad" x="20" y="20" width="200" height="44" rx="6"/><text x="120" y="46" font-size="12" text-anchor="middle">Today: fixed pass mark 7</text><text x="235" y="46" font-size="11" class="w">the same bar for every dimension</text><rect class="node hl" x="20" y="90" width="160" height="44" rx="6"/><text x="100" y="116" font-size="12" text-anchor="middle">Step-1 labels</text><line class="edge" x1="180" y1="112" x2="208" y2="112" marker-end="url(#dc77_k)"/><rect class="node" x="210" y="90" width="170" height="44" rx="6"/><text x="295" y="116" font-size="12" text-anchor="middle">choose on one half</text><line class="edge" x1="380" y1="112" x2="408" y2="112" marker-end="url(#dc77_k)"/><rect class="node" x="410" y="90" width="160" height="44" rx="6"/><text x="490" y="116" font-size="12" text-anchor="middle">test on the other</text><line class="edge" x1="570" y1="112" x2="598" y2="112" marker-end="url(#dc77_k)"/><rect class="node hl" x="600" y="90" width="130" height="44" rx="6"/><text x="665" y="108" font-size="12" text-anchor="middle">per-dimension</text><text x="665" y="124" font-size="12" text-anchor="middle">pass mark</text></svg>

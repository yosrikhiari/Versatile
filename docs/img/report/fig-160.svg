<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 182" width="772" height="182" role="img" aria-labelledby="t d"><title id="t">Extract named emotions, check quotes in code, ask whether each is shown, fail relative to clean scenes</title><desc id="d">Step 2&#x27;s judge: extract, verify in code, ask one narrow question per quote, and fail on the share of named-but-never-shown emotions compared with what clean scenes normally have.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="181" rx="10"/><defs><marker id="dc75_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node hl" x="20" y="36" width="160" height="56" rx="6"/><text x="100" y="60" font-size="12" text-anchor="middle">(a) Extract</text><text x="100" y="76" font-size="11" class="m" text-anchor="middle">quote named emotions</text><line class="edge" x1="180" y1="64" x2="208" y2="64" marker-end="url(#dc75_k)"/><rect class="node code" x="210" y="36" width="130" height="56" rx="6"/><text x="275" y="60" font-size="12" text-anchor="middle">Code</text><text x="275" y="76" font-size="11" class="m" text-anchor="middle">quote exists?</text><line class="edge" x1="340" y1="64" x2="368" y2="64" marker-end="url(#dc75_k)"/><rect class="node hl" x="370" y="36" width="190" height="56" rx="6"/><text x="465" y="60" font-size="12" text-anchor="middle">(b) Yes / no</text><text x="465" y="76" font-size="11" class="m" text-anchor="middle">shown within 2 sentences?</text><line class="edge" x1="560" y1="64" x2="588" y2="64" marker-end="url(#dc75_k)"/><rect class="node" x="590" y="36" width="140" height="56" rx="6"/><text x="660" y="60" font-size="12" text-anchor="middle">(c) Fail if</text><text x="660" y="76" font-size="11" class="m" text-anchor="middle">far above clean norm</text><text x="370" y="128" font-size="11" class="m" text-anchor="middle">tested on a new "named emotion" defect and on human-tagged spans</text></svg>

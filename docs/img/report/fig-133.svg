<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 192" width="772" height="192" role="img" aria-labelledby="t d"><title id="t">Prevent with a brief rule, detect by code after writing, flag for review, and fix with Rewrite this scene</title><desc id="d">Branch 16&#x27;s seven drifts came from the first write, so the rule now goes into every first write too, not only into a repair.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="191" rx="10"/>
<defs><marker id="pb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="210" height="58" rx="4" class="node hl"/><text x="125" y="38" text-anchor="middle" font-size="11">prevent: each rewrite's brief</text><text x="125" y="53" text-anchor="middle" font-size="11">says the original's person</text><text x="125" y="68" text-anchor="middle" font-size="11">(“NARRATION: first person”)</text><line x1="230" y1="49" x2="268" y2="49" class="edge" marker-end="url(#pb1)"/><rect x="270" y="20" width="200" height="58" rx="4" class="node code"/><text x="370" y="38" text-anchor="middle" font-size="11">detect: after writing,</text><text x="370" y="53" text-anchor="middle" font-size="11">rewrite vs its original</text><text x="370" y="68" text-anchor="middle" font-size="11">(code, no model call)</text><line x1="470" y1="49" x2="508" y2="49" class="edge" marker-end="url(#pb1)"/><rect x="510" y="20" width="210" height="58" rx="4" class="node bad"/><text x="615" y="38" text-anchor="middle" font-size="11">drift → needs review</text><text x="615" y="53" text-anchor="middle" font-size="11">“Told in the third person;</text><text x="615" y="68" text-anchor="middle" font-size="11">the original is in the first”</text><line x1="615" y1="78" x2="615" y2="104" class="edge" marker-end="url(#pb1)"/><rect x="420" y="106" width="300" height="40" rx="4" class="node hl"/><text x="570" y="130" text-anchor="middle" font-size="11">Rewrite this scene carries the rule; the re-check clears it</text><rect x="20" y="106" width="380" height="40" rx="4" class="node dash"/><text x="210" y="130" text-anchor="middle" font-size="11">tests fail without the detection and without the brief rule</text></svg>

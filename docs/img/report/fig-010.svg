<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 202" width="692" height="202" role="img" aria-labelledby="t d"><title id="t">Probabilities of 70 percent on 7 and 30 percent on 5 give a weighted score of 6.4 instead of a printed 7</title><desc id="d">G-Eval in one picture. The printed number throws the doubt away. Weighting every possible score by its probability keeps it, so a 70/30 split between 7 and 5 becomes 6.4.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="201" rx="10"/><defs><marker id="dc7_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="40" y="20" font-size="12" font-weight="600">Judge's probabilities for one score</text><line class="grid" x1="40" y1="130" x2="300" y2="130"/><text x="100" y="146" font-size="11" text-anchor="middle">5</text><text x="160" y="146" font-size="11" text-anchor="middle">6</text><text x="220" y="146" font-size="11" text-anchor="middle">7</text><rect class="barA" x="82" y="103" width="36" height="27"/><text x="100" y="97" font-size="11" text-anchor="middle">30%</text><rect class="barA" x="202" y="67" width="36" height="63"/><text x="220" y="61" font-size="11" text-anchor="middle">70%</text><text x="170" y="164" font-size="11" class="m" text-anchor="middle">possible scores</text><rect class="node" x="350" y="40" width="290" height="40" rx="6"/><text x="495" y="64" font-size="12" text-anchor="middle">Printed: 7</text><rect class="node hl" x="350" y="95" width="290" height="50" rx="6"/><text x="495" y="116" font-size="12" text-anchor="middle">Weighted: 0.7×7 + 0.3×5 = 6.4</text><text x="495" y="132" font-size="11" class="a" text-anchor="middle">the doubt is kept</text><line class="edge" x1="300" y1="60" x2="348" y2="60" marker-end="url(#dc7_k)"/><line class="edge" x1="300" y1="115" x2="348" y2="118" marker-end="url(#dc7_k)"/></svg>

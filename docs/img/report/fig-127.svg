<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 192" width="772" height="192" role="img" aria-labelledby="t d"><title id="t">The four keep-to-revise flips and the sentence that justified each</title><desc id="d">The four scenes the second look moved from keep to revise. The first is the chapter the who-is-where check could only miss, because it implies the loss without stating it. It is now caught one step earlier, when planning.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="191" rx="10"/><text x="20" y="30" font-size="11" class="m">The Time Machine · Weena never lost</text><rect x="270" y="12" width="200" height="28" rx="4" class="node hl"/><text x="370" y="30" text-anchor="middle" font-size="11">Trap of the White Sphinx</text><rect x="480" y="12" width="240" height="28" rx="4" class="node"/><text x="600" y="30" text-anchor="middle" font-size="11">“a keen stab of pain” — last round’s miss</text><text x="20" y="66" font-size="11" class="m">The Time Machine · Weena stays behind</text><rect x="270" y="48" width="200" height="28" rx="4" class="node hl"/><text x="370" y="66" text-anchor="middle" font-size="11">The Morlocks</text><rect x="480" y="48" width="240" height="28" rx="4" class="node"/><text x="600" y="66" text-anchor="middle" font-size="11">“Little Weena ran with me”</text><rect x="270" y="84" width="200" height="28" rx="4" class="node hl"/><text x="370" y="102" text-anchor="middle" font-size="11">The Palace of Green Porcelain</text><rect x="480" y="84" width="240" height="28" rx="4" class="node"/><text x="600" y="102" text-anchor="middle" font-size="11">“Weena came very close to my side”</text><rect x="270" y="120" width="200" height="28" rx="4" class="node hl"/><text x="370" y="138" text-anchor="middle" font-size="11">Trap of the White Sphinx</text><rect x="480" y="120" width="240" height="28" rx="4" class="node"/><text x="600" y="138" text-anchor="middle" font-size="11">grief for a Weena who is alive</text></svg>

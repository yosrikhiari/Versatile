<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 162" width="732" height="162" role="img" aria-labelledby="t d"><title id="t">Name filter: 257 sentences in, 18 checked</title><desc id="d">The checker only reads sentences that name a character the way the bible spells it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="161" rx="10"/>
<defs><marker id="sb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="160" height="34" rx="4" class="node"/><text x="100" y="42" text-anchor="middle" font-size="11">257 sentences</text>
<line x1="180" y1="37" x2="238" y2="37" class="edge" marker-end="url(#sb5)"/>
<rect x="240" y="14" width="200" height="46" rx="4" class="node bad"/><text x="340" y="34" text-anchor="middle" font-size="11">keep sentences naming</text><text x="340" y="50" text-anchor="middle" font-size="11">"Ethan Frome", "Mattie Silver"…</text>
<line x1="440" y1="37" x2="498" y2="37" class="edge" marker-end="url(#sb5)"/>
<rect x="500" y="20" width="180" height="34" rx="4" class="node"/><text x="590" y="42" text-anchor="middle" font-size="11">18 checked</text>
<text x="340" y="90" text-anchor="middle" font-size="11" class="m">the prose says "Ethan" and "Mattie": most sentences never reach the checker</text>
<text x="340" y="112" text-anchor="middle" font-size="11" class="m">(measured before changing it: see 5t)</text></svg>

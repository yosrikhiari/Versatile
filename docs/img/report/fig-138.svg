<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 194" width="772" height="194" role="img" aria-labelledby="t d"><title id="t">Planted slips: 28 of 29 whole-chapter switches and 23 of 26 three-paragraph stretches caught, 0 of 29 unchanged chapters flagged</title><desc id="d">Planted, not real: the trial branches of 5w–5aa lived in the in-app browser&#x27;s storage, which was reset, so there were no stored rewrites left to count. How often the writer really slips tense is the next number to take.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="193" rx="10"/><text x="20" y="16" font-size="11" class="m">slips planted into the 29 original chapters of both books (verbs swapped: was → is, walked → walks)</text><text x="20" y="46" font-size="12">whole chapter put in the present</text><rect x="330" y="33" width="300" height="18" class="grid" fill="none"/><rect x="330" y="33" width="290" height="18" class="barA"/><text x="640" y="46" font-size="11">28 / 29 caught</text><text x="20" y="82" font-size="12">3 middle paragraphs put in the present</text><rect x="330" y="69" width="300" height="18" class="grid" fill="none"/><rect x="330" y="69" width="265" height="18" class="barA"/><text x="640" y="82" font-size="11">23 / 26 caught</text><text x="20" y="118" font-size="12">unchanged copy of each chapter</text><rect x="330" y="105" width="300" height="18" class="grid" fill="none"/><text x="640" y="118" font-size="11">0 / 29 flagged</text><text x="20" y="150" font-size="11" class="m">missed: the Epilogue (too short to judge) and 3 stretches whose paragraphs are mostly speech (0–3 verbs of narration each)</text></svg>

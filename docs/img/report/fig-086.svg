<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 232" width="692" height="232" role="img" aria-labelledby="t d"><title id="t">Hit-testing, culling and the overlap pass, and who does each</title><desc id="d">Three places a quadtree could help. The browser already does hit-testing, Vue Flow&#x27;s loop is microseconds, and the one pair-by-pair loop we own runs once per click.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="691" height="231" rx="10"/>
<defs><marker id="qa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="130" height="40" rx="4" class="node"/><text x="85" y="45" text-anchor="middle" font-size="12">click / drag</text>
<rect x="20" y="80" width="130" height="40" rx="4" class="node"/><text x="85" y="105" text-anchor="middle" font-size="12">scroll the canvas</text>
<rect x="20" y="140" width="130" height="40" rx="4" class="node"/><text x="85" y="165" text-anchor="middle" font-size="12">"Arrange" button</text>
<line x1="150" y1="40" x2="258" y2="40" class="edge" marker-end="url(#qa2)"/>
<line x1="150" y1="100" x2="258" y2="100" class="edge" marker-end="url(#qa2)"/>
<line x1="150" y1="160" x2="258" y2="160" class="edge" marker-end="url(#qa2)"/>
<rect x="260" y="20" width="200" height="40" rx="4" class="node"/><text x="360" y="45" text-anchor="middle" font-size="12">browser hit-testing (DOM)</text>
<rect x="260" y="80" width="200" height="40" rx="4" class="node"/><text x="360" y="105" text-anchor="middle" font-size="12">Vue Flow: visible-node loop</text>
<rect x="260" y="140" width="200" height="40" rx="4" class="node hl"/><text x="360" y="165" text-anchor="middle" font-size="12">our overlap pass: every pair</text>
<text x="480" y="45" font-size="12" class="m">not ours to replace</text>
<text x="480" y="105" font-size="12" class="m">≈ 5 µs at 500 nodes</text>
<text x="480" y="165" font-size="12" class="a">once per click, ≈ 0.4 ms</text>
</svg>

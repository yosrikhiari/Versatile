<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 197" width="752" height="197" role="img" aria-labelledby="t d"><title id="t">A gate change ships only if it catches reviewer problems and passes the masterpieces</title><desc id="d">The two-set rule. A judge that fails Chekhov is disqualified however well it does on planted defects.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="751" height="196" rx="10"/><defs><marker id="dc53_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="60" width="130" height="50" rx="6"/><text x="85" y="89" font-size="12" text-anchor="middle">Gate change</text><line class="edge" x1="150" y1="75" x2="198" y2="47" marker-end="url(#dc53_k)"/><line class="edge" x1="150" y1="95" x2="198" y2="123" marker-end="url(#dc53_k)"/><rect class="node hl" x="200" y="20" width="240" height="50" rx="6"/><text x="320" y="41" font-size="12" text-anchor="middle">Catches reviewer problems</text><text x="320" y="57" font-size="11" class="m" text-anchor="middle">78 generated scenes</text><rect class="node hl" x="200" y="100" width="240" height="50" rx="6"/><text x="320" y="121" font-size="12" text-anchor="middle">Passes the masterpieces</text><text x="320" y="137" font-size="11" class="m" text-anchor="middle">12 classic passages</text><line class="edge" x1="440" y1="45" x2="498" y2="75" marker-end="url(#dc53_k)"/><line class="edge" x1="440" y1="125" x2="498" y2="95" marker-end="url(#dc53_k)"/><rect class="node code" x="500" y="60" width="100" height="50" rx="6"/><text x="550" y="89" font-size="12" text-anchor="middle">both?</text><line class="edge" x1="600" y1="75" x2="628" y2="42" marker-end="url(#dc53_k)"/><rect class="node hl" x="630" y="20" width="80" height="40" rx="6"/><text x="670" y="44" font-size="12" text-anchor="middle">ship</text><line class="edge" x1="600" y1="95" x2="628" y2="123" marker-end="url(#dc53_k)"/><rect class="node bad" x="630" y="105" width="80" height="40" rx="6"/><text x="670" y="129" font-size="12" text-anchor="middle">rejected</text></svg>

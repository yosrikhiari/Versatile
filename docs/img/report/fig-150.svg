<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 242" width="772" height="242" role="img" aria-labelledby="t d"><title id="t">Removing the repeated anchor removed the picture from the opening, 12 to 3 of 24, but reuse of earlier openings went from 14 to 16 of 24</title><desc id="d">The fix does what it aims at: the repeated picture leaves the opening. It does not reduce reuse. With the anchor gone, the writer falls back on its own stock openings, and one scene still opened on &quot;the scent of damp earth&quot;, picked up from the earlier prose in its context.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="241" rx="10"/>
<text x="20" y="18" font-size="11" class="m">6 scenes whose anchor repeats an earlier one × 4 tries · grey: planned anchor · blue: anchor removed</text>
<text x="20" y="52" font-size="11">opening carries the repeated picture</text><rect x="320" y="40" width="150" height="14" class="barB"/><text x="476" y="52" font-size="10">12 / 24</text><rect x="320" y="57" width="38" height="14" class="barA"/><text x="364" y="69" font-size="10" class="a">3 / 24</text>
<text x="20" y="102" font-size="11">opening reuses an earlier opening</text><rect x="320" y="90" width="175" height="14" class="barB"/><text x="501" y="102" font-size="10">14 / 24</text><rect x="320" y="107" width="200" height="14" class="barA"/><text x="526" y="119" font-size="10" class="a">16 / 24</text>
<text x="20" y="150" font-size="11">what it reached for instead</text><text x="320" y="150" font-size="11">“stepped over the threshold” 6 → 8 · “sound cutting through” 4 → 4</text>
<text x="320" y="168" font-size="11">“fingers brushing” 3 → 3 · “damp earth” still opens one scene with no anchor</text>
<text x="20" y="198" font-size="11" class="m">no scene better, 2 worse · p = 0.5 · GPU to itself, 48 drafts, 0 errors</text>
</svg>

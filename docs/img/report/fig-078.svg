<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 752 192" width="752" height="192" role="img" aria-labelledby="t d"><title id="t">The probability of contradicts is 0.0001, yet the JSON answer says contradicts</title><desc id="d">Same model, same question. Forced to fill a JSON field, it wrote the answer it gives almost no probability to. The app now reads the probability, as the bench did.</desc><style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 160" width="772" height="160" role="img" aria-labelledby="t d"><title id="t">Recorded answers re-scored: five real flags kept, four false alarms removed</title><desc id="d">Before changing any code I recorded every answer the model gave on the four trial branches, then scored those same answers with the new code. All five real flags stay and all four false alarms go. The rule was written from those four sentences, though, so this proves it works on them, not beyond them.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="159" rx="10"/><text x="20" y="38" font-size="12">before (§41 rules)</text><rect x="180" y="20" width="28" height="26" rx="3" class="node hl"/><rect x="214" y="20" width="28" height="26" rx="3" class="node hl"/><rect x="248" y="20" width="28" height="26" rx="3" class="node hl"/><rect x="282" y="20" width="28" height="26" rx="3" class="node hl"/><rect x="316" y="20" width="28" height="26" rx="3" class="node hl"/><rect x="370" y="20" width="28" height="26" rx="3" class="node bad"/><rect x="404" y="20" width="28" height="26" rx="3" class="node bad"/><rect x="438" y="20" width="28" height="26" rx="3" class="node bad"/><rect x="472" y="20" width="28" height="26" rx="3" class="node bad"/><text x="20" y="78" font-size="12">after</text><rect x="180" y="60" width="28" height="26" rx="3" class="node hl"/><rect x="214" y="60" width="28" height="26" rx="3" class="node hl"/><rect x="248" y="60" width="28" height="26" rx="3" class="node hl"/><rect x="282" y="60" width="28" height="26" rx="3" class="node hl"/><rect x="316" y="60" width="28" height="26" rx="3" class="node hl"/><text x="370" y="78" font-size="11" class="a">none</text><text x="180" y="14" font-size="11" class="a">real</text><text x="370" y="14" font-size="11" class="w">false</text><text x="20" y="116" font-size="11" class="m">74 answers recorded before the fix (four branches, incl. text before each rewrite), re-scored after it · in-sample</text></svg>

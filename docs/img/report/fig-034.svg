<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 232" width="732" height="232" role="img" aria-labelledby="t d"><title id="t">Judge calls 6 versus 38, writer calls 10 versus 9, wall time 13.4 versus 10.8 minutes</title><desc id="d">Judge calls went up six-fold, but each takes a few seconds. The writer&#x27;s long calls set the wall time. The gate-on book finishing sooner is noise: the two runs wrote different books.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="231" rx="10"/><rect class="barB" x="200" y="12" width="14" height="10"/><text x="220" y="21" font-size="11">gate off (old critic)</text><rect class="barA" x="390" y="12" width="14" height="10"/><text x="410" y="21" font-size="11">gate on (focused)</text><text x="188" y="62" font-size="12" text-anchor="end">judge calls</text><rect class="barB" x="200" y="40" width="47.4" height="15"/><text x="253.4" y="52" font-size="11">6</text><rect class="barA" x="200" y="58" width="300" height="15"/><text x="506" y="70" font-size="11" class="a">38</text><text x="188" y="114" font-size="12" text-anchor="end">writer calls</text><rect class="barB" x="200" y="92" width="78.9" height="15"/><text x="284.9" y="104" font-size="11">10</text><rect class="barA" x="200" y="110" width="71.1" height="15"/><text x="277.1" y="122" font-size="11" class="a">9</text><text x="188" y="166" font-size="12" text-anchor="end">wall time, min</text><rect class="barB" x="200" y="144" width="268" height="15"/><text x="474" y="156" font-size="11">13.4</text><rect class="barA" x="200" y="162" width="216" height="15"/><text x="422" y="174" font-size="11" class="a">10.8 (noise)</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 202" width="732" height="202" role="img" aria-labelledby="t d"><title id="t">Choosing between the model&#x27;s stated change and the author&#x27;s premise</title><desc id="d">The planner&#x27;s one-line version of the change is used only if it keeps your premise&#x27;s key words. Otherwise your own sentence, turned into a statement, is used.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="201" rx="10"/>
<defs><marker id="tb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="300" height="46" rx="4" class="node"/><text x="170" y="40" text-anchor="middle" font-size="11">you: what if Zeena never goes to Bettsbridge,</text><text x="170" y="56" text-anchor="middle" font-size="11">and stays home <tspan class="a">the night E. and M. were to be alone</tspan>?</text>
<rect x="380" y="20" width="300" height="46" rx="4" class="node bad"/><text x="530" y="40" text-anchor="middle" font-size="11">model: Zeena decides to stay home</text><text x="530" y="56" text-anchor="middle" font-size="11">instead of going to Bettsbridge.</text>
<line x1="530" y1="66" x2="530" y2="98" class="edge" marker-end="url(#tb2)"/>
<rect x="380" y="100" width="300" height="30" rx="4" class="node code"/><text x="530" y="120" text-anchor="middle" font-size="11">keeps ≥ 70% of your words? no (dropped "night", "alone")</text>
<line x1="380" y1="115" x2="322" y2="115" class="edge a" marker-end="url(#tb2)"/>
<rect x="20" y="100" width="300" height="30" rx="4" class="node hl"/><text x="170" y="120" text-anchor="middle" font-size="11">use your premise, as a statement</text>
<text x="350" y="160" text-anchor="middle" font-size="11" class="m">the writer and the checker now hold exactly what you asked for</text></svg>

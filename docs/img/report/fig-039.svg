<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 972 282" width="972" height="282" role="img" aria-labelledby="t d"><title id="t">Before: gate fails, the whole scene is rewritten. After: if only pacing or continuity failed, cut the named paragraphs and rewrite the named sentences, judge again; if that passes keep it, otherwise fall back to the full rewrite.</title><desc id="d">The gate&#x27;s evidence (paragraph numbers, quoted sentences) becomes the repair plan. Voice or emotion failures still go back to the writer, because there&#x27;s nothing precise to cut.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="971" height="281" rx="10"/>
    <defs>
      <marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    </defs>
    <text x="20" y="22" class="m" font-size="12" font-weight="600" letter-spacing="1">BEFORE</text>
    <rect class="node" x="20" y="36" width="130" height="44" rx="8"/><text x="85" y="63" font-size="12" text-anchor="middle">Gate fails</text>
    <rect class="node bad" x="200" y="36" width="260" height="44" rx="8"/><text x="330" y="56" font-size="12" text-anchor="middle">Write the WHOLE scene again</text><text x="330" y="72" font-size="11" class="w" text-anchor="middle">~75 s · good paragraphs lost</text>
    <line class="edge" x1="150" y1="58" x2="198" y2="58" marker-end="url(#ar8)"/>

    <line class="grid" x1="20" y1="100" x2="920" y2="100"/>
    <text x="20" y="124" class="a" font-size="12" font-weight="600" letter-spacing="1">NOW</text>
    <rect class="node" x="20" y="140" width="130" height="56" rx="8"/><text x="85" y="164" font-size="12" text-anchor="middle">Gate fails</text><text x="85" y="182" font-size="11" class="m" text-anchor="middle">with evidence</text>
    <rect class="node code" x="190" y="134" width="210" height="68" rx="8"/><text x="295" y="156" font-size="12" text-anchor="middle">Cut filler ¶ 2, 15, 26</text><text x="295" y="173" font-size="11" class="m" text-anchor="middle">no model call</text><text x="295" y="190" font-size="11" class="m" text-anchor="middle">+ rewrite 1 bad sentence</text>
    <rect class="node hl" x="440" y="140" width="130" height="56" rx="8"/><text x="505" y="172" font-size="12" text-anchor="middle">Judge again</text>
    <rect class="node" x="620" y="126" width="140" height="36" rx="8"/><text x="690" y="149" font-size="12" text-anchor="middle">passes → keep</text>
    <rect class="node" x="620" y="176" width="300" height="36" rx="8"/><text x="770" y="199" font-size="12" text-anchor="middle">still fails → full rewrite, as before</text>
    <line class="edge" x1="150" y1="168" x2="188" y2="168" marker-end="url(#ar8)"/>
    <line class="edge" x1="400" y1="168" x2="438" y2="168" marker-end="url(#ar8)"/>
    <line class="edge" x1="570" y1="160" x2="618" y2="146" marker-end="url(#ar8)"/>
    <line class="edge" x1="570" y1="176" x2="618" y2="192" marker-end="url(#ar8)"/>
    <text x="470" y="236" font-size="11" class="m" text-anchor="middle">only when pacing and/or continuity are the ONLY failures · a repair can save work, never lose a scene</text>
  </svg>

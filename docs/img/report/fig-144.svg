<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 252" width="772" height="252" role="img" aria-labelledby="t d"><title id="t">The writer is shown the last 1,200 characters of the three chapters before it and copies them into the new chapter</title><desc id="d">The writer was told to “continue from” three chapter endings, and it did so literally: it wrote them out again. Book drafting shows the same kind of excerpt (“Ending of Preceding Scene”), which is where a generated book’s 190-word copy came from.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="251" rx="10"/>
<defs><marker id="da1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="da2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker></defs>
<text x="20" y="18" font-size="11" class="m">what the writer is shown before it writes a chapter</text>
<rect x="20" y="30" width="140" height="30" rx="3" class="node"/><rect x="132" y="30" width="28" height="30" rx="3" class="node bad"/><text x="76" y="49" font-size="11" text-anchor="middle">chapter N−3</text><rect x="170" y="30" width="140" height="30" rx="3" class="node"/><rect x="282" y="30" width="28" height="30" rx="3" class="node bad"/><text x="226" y="49" font-size="11" text-anchor="middle">chapter N−2</text><rect x="320" y="30" width="140" height="30" rx="3" class="node"/><rect x="432" y="30" width="28" height="30" rx="3" class="node bad"/><text x="376" y="49" font-size="11" text-anchor="middle">chapter N−1</text><text x="470" y="42" font-size="11" class="w">shaded: the last 1,200 characters</text><text x="470" y="57" font-size="11" class="w">of each, shown word for word</text><line x1="340" y1="62" x2="340" y2="96" class="edge w" marker-end="url(#da2)"/><rect x="240" y="98" width="200" height="40" rx="4" class="node code"/><text x="340" y="114" text-anchor="middle" font-size="11">“IMMEDIATELY PRECEDING PROSE</text><text x="340" y="130" text-anchor="middle" font-size="11">… continue from it”</text><line x1="340" y1="138" x2="340" y2="160" class="edge" marker-end="url(#da1)"/><rect x="160" y="162" width="360" height="30" rx="3" class="node"/><rect x="160" y="162" width="90" height="30" rx="3" class="node bad"/><text x="205" y="181" font-size="10" text-anchor="middle" class="w">copied tail</text><text x="385" y="181" font-size="11" text-anchor="middle">chapter N</text><text x="20" y="212" font-size="11" class="m">every copied passage on the branch sat 92–98% of the way through the chapter it came from: inside the shown tail</text></svg>

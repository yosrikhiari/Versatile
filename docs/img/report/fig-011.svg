<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 247" width="732" height="247" role="img" aria-labelledby="t d"><title id="t">A single 1 to 10 rating versus a checklist of yes or no questions</title><desc id="d">CheckEval and TICK: swap one 1–10 rating for a few yes/no questions, some written from the scene&#x27;s own plan. Judges, and humans, agree far more on yes/no than on a score.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="731" height="246" rx="10"/><defs><marker id="dc8_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="node" x="20" y="20" width="220" height="44" rx="6"/><text x="130" y="46" font-size="12" text-anchor="middle">"Rate show vs tell, 1–10"</text><line class="edge" x1="240" y1="42" x2="298" y2="42" marker-end="url(#dc8_k)"/><rect class="node bad" x="300" y="20" width="220" height="44" rx="6"/><text x="410" y="38" font-size="12" text-anchor="middle">one fuzzy number</text><text x="410" y="54" font-size="11" class="w" text-anchor="middle">judges often disagree</text><line class="grid" x1="20" y1="84" x2="680" y2="84"/><rect class="node" x="20" y="100" width="330" height="30" rx="6"/><text x="185" y="119" font-size="12" text-anchor="middle">Names an emotion outright?  yes / no</text><line class="edge" x1="350" y1="115" x2="408" y2="138" marker-end="url(#dc8_k)"/><rect class="node" x="20" y="138" width="330" height="30" rx="6"/><text x="185" y="157" font-size="12" text-anchor="middle">Feeling shown by an action?  yes / no</text><line class="edge" x1="350" y1="153" x2="408" y2="142" marker-end="url(#dc8_k)"/><rect class="node" x="20" y="176" width="330" height="30" rx="6"/><text x="185" y="195" font-size="12" text-anchor="middle">Does what the plan says?  yes / no</text><line class="edge" x1="350" y1="191" x2="408" y2="146" marker-end="url(#dc8_k)"/><rect class="node hl" x="410" y="120" width="200" height="50" rx="6"/><text x="510" y="141" font-size="12" text-anchor="middle">count the yes/no answers</text><text x="510" y="157" font-size="11" class="a" text-anchor="middle">judges agree far more</text></svg>

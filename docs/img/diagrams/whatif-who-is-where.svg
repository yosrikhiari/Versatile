<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 282" width="772" height="282" role="img" aria-labelledby="t d"><title id="t">One person followed scene by scene; code flags a missing leaving and marks the scene for review</title><desc id="d">The check follows each person the change names through the later scenes. Code, not the model, decides that an event is missing: last seen here, now treated as gone, and no scene shows the leaving. It flags the scene; it does not edit it.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="281" rx="10"/>
<defs><marker id="ua1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="ua2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
<text x="20" y="22" font-size="12">one person (here Zeena), the scenes after the change, in order</text>
<rect x="20" y="36" width="108" height="40" rx="4" class="node hl"/><text x="74" y="52" text-anchor="middle" font-size="11">IV</text><text x="74" y="68" text-anchor="middle" font-size="11">here: at the table</text><rect x="140" y="36" width="108" height="40" rx="4" class="node hl"/><text x="194" y="52" text-anchor="middle" font-size="11">V</text><text x="194" y="68" text-anchor="middle" font-size="11">here: at the hearth</text><rect x="260" y="36" width="108" height="40" rx="4" class="node hl"/><text x="314" y="52" text-anchor="middle" font-size="11">VI</text><text x="314" y="68" text-anchor="middle" font-size="11">here: at the table</text><rect x="380" y="36" width="108" height="40" rx="4" class="node hl"/><text x="434" y="52" text-anchor="middle" font-size="11">VII</text><text x="434" y="68" text-anchor="middle" font-size="11">here: kitchen door</text><rect x="500" y="36" width="108" height="40" rx="4" class="node bad"/><text x="554" y="52" text-anchor="middle" font-size="11">VIII</text><text x="554" y="68" text-anchor="middle" font-size="11">“her absence…”</text><rect x="620" y="36" width="108" height="40" rx="4" class="node"/><text x="674" y="52" text-anchor="middle" font-size="11">epilogue</text><text x="674" y="68" text-anchor="middle" font-size="11">…</text><line x1="128" y1="56" x2="138" y2="56" class="edge" marker-end="url(#ua1)"/><line x1="248" y1="56" x2="258" y2="56" class="edge" marker-end="url(#ua1)"/><line x1="368" y1="56" x2="378" y2="56" class="edge" marker-end="url(#ua1)"/><line x1="488" y1="56" x2="498" y2="56" class="edge" marker-end="url(#ua1)"/><line x1="608" y1="56" x2="618" y2="56" class="edge" marker-end="url(#ua1)"/>
<text x="20" y="104" font-size="11" class="m">each scene: ONE question (reason first) → here? where? a leaving shown? a return shown? a sentence treating them as away?</text>
<rect x="20" y="122" width="200" height="46" rx="4" class="node code"/><text x="120" y="142" text-anchor="middle" font-size="11">code: quotes really in the text?</text><text x="120" y="156" text-anchor="middle" font-size="11">(≥ 8 letters, verbatim)</text><line x1="220" y1="145" x2="258" y2="145" class="edge" marker-end="url(#ua1)"/><rect x="260" y="122" width="230" height="46" rx="4" class="node code"/><text x="375" y="142" text-anchor="middle" font-size="11">last shown HERE, now treated as gone</text><text x="375" y="156" text-anchor="middle" font-size="11">or shown coming back, no leaving shown?</text><line x1="490" y1="145" x2="528" y2="145" class="edge a" marker-end="url(#ua2)"/><rect x="530" y="122" width="190" height="46" rx="4" class="node bad"/><text x="625" y="142" text-anchor="middle" font-size="11">missing event</text><text x="625" y="156" text-anchor="middle" font-size="11">→ scene flagged for you</text>
<line x1="625" y1="168" x2="625" y2="200" class="edge a" marker-end="url(#ua2)"/>
<rect x="470" y="202" width="250" height="36" rx="4" class="node hl"/><text x="595" y="224" text-anchor="middle" font-size="11">sentence + reason listed; text not changed</text>
<text x="20" y="224" font-size="11" class="m">nothing is assumed from the premise: the first scene that shows a person sets where they are</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 242" width="772" height="242" role="img" aria-labelledby="t d"><title id="t">Branch switch blanked the open scene through the autosave; three fixes</title><desc id="d">Found because a fresh branch started by “rewriting” a chapter before the change: the original book’s first chapter had been saved empty during an earlier run. It was restored from the branch copy, and three small fixes make sure it can’t happen again.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="241" rx="10"/>
<defs><marker id="xc1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="xc2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="w"/></marker><marker id="xc3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
<rect x="20" y="20" width="150" height="46" rx="4" class="node"/><text x="95" y="40" text-anchor="middle" font-size="11">original Introduction</text><text x="95" y="54" text-anchor="middle" font-size="11">open in the editor</text><line x1="170" y1="43" x2="198" y2="43" class="edge" marker-end="url(#xc1)"/><rect x="200" y="20" width="150" height="46" rx="4" class="node"/><text x="275" y="40" text-anchor="middle" font-size="11">What If switches</text><text x="275" y="54" text-anchor="middle" font-size="11">to the branch</text><line x1="350" y1="43" x2="378" y2="43" class="edge" marker-end="url(#xc1)"/><rect x="380" y="20" width="160" height="46" rx="4" class="node bad"/><text x="460" y="40" text-anchor="middle" font-size="11">old id still “open”,</text><text x="460" y="54" text-anchor="middle" font-size="11">editor loads ‘’</text><line x1="540" y1="43" x2="568" y2="43" class="edge w" marker-end="url(#xc2)"/><rect x="570" y="20" width="150" height="46" rx="4" class="node bad"/><text x="645" y="40" text-anchor="middle" font-size="11">10 s autosave:</text><text x="645" y="54" text-anchor="middle" font-size="11">original saved empty</text>
<text x="380" y="88" font-size="11" class="w">TipTap 3 counts a load as an edit</text>
<rect x="20" y="110" width="220" height="46" rx="4" class="node hl"/><text x="130" y="130" text-anchor="middle" font-size="11">load is not an edit</text><text x="130" y="144" text-anchor="middle" font-size="11">(emitUpdate: false, save first)</text><rect x="260" y="110" width="220" height="46" rx="4" class="node hl"/><text x="370" y="130" text-anchor="middle" font-size="11">an id no longer loaded</text><text x="370" y="144" text-anchor="middle" font-size="11">is no longer “open”</text><rect x="500" y="110" width="220" height="46" rx="4" class="node hl"/><text x="610" y="130" text-anchor="middle" font-size="11">never save an empty editor</text><text x="610" y="144" text-anchor="middle" font-size="11">over a scene you can’t see</text>
<text x="20" y="186" font-size="11" class="a">live: same sequence, 12 s later the original is untouched; typing still saves to the right scene</text></svg>

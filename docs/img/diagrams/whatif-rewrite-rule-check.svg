<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 772 202" width="772" height="202" role="img" aria-labelledby="t d"><title id="t">Re-check blind spot and the rule check that closes it</title><desc id="d">The question only counts an absence when the person isn’t in the scene. After a rewrite that’s the wrong test: the rule was “she never left”. The new code check flags exactly the rewrite that failed and none of the five that held.</desc><style>
svg{--paper:#ffffff;--ink:#1b2130;--muted:#586174;--line:#d9dee7;--accent:#2f56c9;--accent-soft:#e3e9fb;--warn:#b4480f;--warn-soft:#fbeadf;--good:#18794a;--good-soft:#e0f2e8;--bar:#a9b2c3;color:var(--ink)}
@media (prefers-color-scheme: dark){svg{--paper:#191d27;--ink:#e5e8ee;--muted:#9ba4b6;--line:#2c3342;--accent:#86a4ff;--accent-soft:#1f2a4a;--warn:#f0925c;--warn-soft:#3a2418;--good:#5fcf93;--good-soft:#15301f;--bar:#4b5468}}
.bg{fill:var(--paper);stroke:var(--line)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:currentColor}
.m{fill:var(--muted)}.a{fill:var(--accent)}.w{fill:var(--warn)}.g{fill:var(--good)}
.node{fill:var(--paper);stroke:currentColor;stroke-width:1.2}
.node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.node.bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.6}
.node.code{fill:var(--good-soft);stroke:var(--good);stroke-width:1.4}
.node.dash{stroke-dasharray:5 4}
.edge{stroke:currentColor;stroke-width:1.3;fill:none}
.edge.dash{stroke-dasharray:5 4;opacity:.7}.edge.a{stroke:var(--accent)}.edge.w{stroke:var(--warn)}
.barA{fill:var(--accent)}.barB{fill:var(--bar)}.grid{stroke:var(--line);stroke-width:1}
</style><rect class="bg" x="-15.5" y="-15.5" width="771" height="201" rx="10"/>
<defs><marker id="wb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="wb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
<rect x="20" y="20" width="250" height="46" rx="4" class="node bad"/><text x="145" y="40" text-anchor="middle" font-size="11">rewrite still says: “He thought of</text><text x="145" y="54" text-anchor="middle" font-size="11">Zeena’s absence, of the way she’d left”</text><line x1="270" y1="43" x2="308" y2="43" class="edge" marker-end="url(#wb1)"/><rect x="310" y="20" width="200" height="46" rx="4" class="node"/><text x="410" y="40" text-anchor="middle" font-size="11">question: is Zeena here?</text><text x="410" y="54" text-anchor="middle" font-size="11">yes (named 24 times)</text><line x1="510" y1="43" x2="548" y2="43" class="edge" marker-end="url(#wb1)"/><rect x="550" y="20" width="170" height="46" rx="4" class="node dash"/><text x="635" y="40" text-anchor="middle" font-size="11">absence ignored</text><text x="635" y="54" text-anchor="middle" font-size="11">→ passed</text><rect x="20" y="100" width="490" height="46" rx="4" class="node code"/><text x="265" y="120" text-anchor="middle" font-size="11">new: the brief said she never left, so any sentence putting</text><text x="265" y="134" text-anchor="middle" font-size="11">her name next to an absence breaks it, here or not (code only)</text><line x1="510" y1="123" x2="548" y2="123" class="edge a" marker-end="url(#wb2)"/><rect x="550" y="100" width="170" height="46" rx="4" class="node hl"/><text x="635" y="120" text-anchor="middle" font-size="11">flags 1 of 6 rewrites:</text><text x="635" y="134" text-anchor="middle" font-size="11">exactly the one that failed</text></svg>

# Frontend static server for the Versatile SPA.
# Serves Vite's pre-compressed .br/.gz artifacts via content negotiation and
# falls back to index.html for client-side routing.

server {
    listen 80;
    # Dual-stack: the HEALTHCHECK probes http://localhost/, which resolves
    # to ::1 first — without this, wget gets connection-refused on IPv6
    # while IPv4 serves fine, and the container reports unhealthy forever.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compose embedded DNS (127.0.0.11) + variable indirection so nginx
    # resolves `api` at request time — a static proxy_pass hostname would
    # fail to start if the api container isn't up yet.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream api:8080;

    # REST API — proxied to the compose `api` service (same origin, no CORS).
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hubs — websocket upgrade required.
    location /hubs/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health, surfaced for compose/external monitoring.
    location = /health {
        proxy_pass http://$api_upstream/health;
    }

    # Serve pre-compressed .gz when the client accepts it (gzip_static is in the
    # stock nginx build). Brotli static requires the ngx_brotli module; if your
    # nginx image ships it, add `brotli_static on;` here as well.
    gzip_static on;

    # Long-cache fingerprinted assets; they change name on every build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path resolves to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

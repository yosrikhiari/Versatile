# Frontend static server for the Versatile SPA.
# Serves Vite's pre-compressed .br/.gz artifacts via content negotiation and
# falls back to index.html for client-side routing.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed .gz when the client accepts it (gzip_static is in the
    # stock nginx build). Brotli static requires the ngx_brotli module; if your
    # nginx image ships it, add `brotli_static on;` here as well.
    gzip_static on;

    # Long-cache fingerprinted assets; they change name on every build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path resolves to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

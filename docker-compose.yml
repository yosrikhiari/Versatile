services:
  postgres:
    image: postgres:16-alpine
    container_name: versatile-postgres
    environment:
      POSTGRES_DB: versatile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional static frontend (nginx). Enable with:  docker compose --profile frontend up
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: versatile-frontend
    profiles: ['frontend']
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  pgdata:
